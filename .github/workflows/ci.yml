name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    # CHỈ Windows. Mọi thứ khiến công cụ này đáng dùng đều là chi tiết Windows
    # (junction, ACL, taskkill, tên thiết bị NUL/COM1) và mọi phép đo trong
    # docs/DO-LUONG.md đều là phép đo Windows. Chạy CI trên Linux cho một sản
    # phẩm không hỗ trợ Linux chỉ tạo cảm giác an toàn giả.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Đọc thẳng từ go.mod (gồm cả dòng `toolchain`) để CI và máy dev dùng
          # ĐÚNG một phiên bản. Ghim '1.25' kiểu cũ thì CI có thể build bằng
          # toolchain khác với thứ đã quét lỗ hổng ở dưới.
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        shell: bash
        # Ghi kết quả vào JOB SUMMARY khi hỏng.
        #
        # Vì sao cần: log đầy đủ của Actions chỉ tải được nếu CÓ QUYỀN ADMIN repo
        # (`/actions/jobs/{id}/logs` trả 403 "Must have admin rights"). Ai không
        # phải chủ repo — kể cả người đang sửa lỗi — chỉ thấy đúng một dòng
        # "Process completed with exit code 1". Đã tốn một vòng đoán mò vì chuyện
        # này. Job summary thì đọc được qua API công khai.
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test-output.txt || {
            {
              echo '## go test ĐỎ'
              echo '```'
              grep -E "^(---|\s+.*_test\.go:|FAIL|panic)" test-output.txt | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - name: go build
        run: go build ./cmd/sagent
      - name: thông báo giấy phép còn khớp phụ thuộc?
        # Sổ giấy phép viết tay thì TRÔI — đã đo: nó từng kê một module không hề
        # được liên kết vào binary. Bước này làm CI đỏ ngay khi file lệch.
        run: go run ./tools/giayphep -kiem

  vuln:
    # Quét lỗ hổng phụ thuộc (Pha 7). Chạy riêng và KHÔNG chặn job trên: một lỗ
    # hổng mới công bố không nên chặn việc test code đang viết.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
