name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Đọc thẳng từ go.mod (gồm cả dòng `toolchain`) để CI và máy dev dùng
          # ĐÚNG một phiên bản. Ghim '1.25' như trước thì CI có thể build bằng
          # toolchain khác với thứ đã quét lỗ hổng ở dưới.
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build ./cmd/sagent

  vuln:
    # Quét lỗ hổng phụ thuộc (Pha 7). Chạy riêng và KHÔNG fail-fast cùng job trên:
    # một lỗ hổng mới công bố không nên chặn việc test code đang viết.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        # Chỉ báo lỗi khi có ĐƯỜNG GỌI thật tới lỗ hổng, không phải khi chỉ
        # "có mặt trong go.sum" — mặc định của govulncheck đã đúng như vậy.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
