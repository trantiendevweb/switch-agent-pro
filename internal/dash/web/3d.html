<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Switch-Agent-Pro — 3D</title>
<style>
  :root{--bg:#0F172A;--fg:#F8FAFC;--sub:#94A3B8;--border:#475569;--run:#22C55E;
    --warn:#F59E0B;--limit:#EF4444;--idle:#64748B;--panel:rgba(30,41,59,.6);--ease:cubic-bezier(0.16,1,0.3,1)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none}
  #scene{position:fixed;inset:0;display:block}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 10px 20px rgba(0,0,0,.4)}
  #top{top:12px;left:12px;right:12px;height:50px;display:flex;align-items:center;gap:12px;padding:0 14px}
  .b{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
  .b small{color:var(--sub);font-weight:400;font-size:11px}
  #conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
  #conn .d{width:9px;height:9px;border-radius:50%;background:var(--limit)}#conn.on .d{background:var(--run)}
  .nav{margin-left:auto;display:flex;gap:8px}
  .nav a{text-decoration:none;color:var(--fg);border:1px solid var(--border);border-radius:8px;
    padding:7px 12px;font-size:12px;font-weight:600}
  .nav a.on{border-color:var(--run);background:rgba(34,197,94,.14);color:var(--run)}
  #legend{bottom:12px;left:12px;display:flex;gap:14px;padding:9px 14px;font-size:12px}
  #legend span{display:flex;align-items:center;gap:6px;color:var(--sub)}
  .dot{width:9px;height:9px;border-radius:50%}
  #detail{bottom:12px;right:12px;width:250px;padding:14px;display:none}
  #detail .a{font-size:17px;font-weight:600}
  #detail .kv{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid rgba(71,85,105,.35)}
  #detail .kv .k{color:var(--sub)}
  #detail button{margin-top:12px;width:100%;cursor:pointer;background:transparent;color:#fca5a5;
    border:1px solid rgba(239,68,68,.5);border-radius:8px;padding:8px;font:inherit;font-weight:600}
  #detail button:hover{background:rgba(239,68,68,.12)}
  #tip{position:fixed;transform:translate(12px,12px);pointer-events:none;z-index:8;background:#1E293B;
    border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;display:none}
  #fallback{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px}
  #fallback div{max-width:360px}#fallback a{color:#7dd3fc}
  .lbl{position:fixed;transform:translate(-50%,-50%);font-size:12px;font-weight:600;
    text-shadow:0 0 10px rgba(0,0,0,.95);pointer-events:none;white-space:nowrap}
  .lbl small{display:block;color:var(--sub);font-weight:400;font-size:10px;text-align:center}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="top" class="panel">
  <div class="b">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8"><path d="M12 2l8.5 5v10L12 22 3.5 17V7z"/><circle cx="12" cy="12" r="3" fill="#22C55E" stroke="none"/></svg>
    Switch-Agent-Pro <small>3D · dữ liệu thật</small>
  </div>
  <div id="flowname" style="font-size:12px;color:#7dd3fc;font-weight:600"></div>
  <div id="conn"><span class="d"></span><span id="conntext">đang kết nối…</span></div>
  <div class="nav"><a id="to2d" href="./">2D</a><a class="on" href="3d.html">3D</a><a id="toflow" href="flow.html">Workflow</a><a href="/docs/">Plan</a><a href="/logout">Thoát</a></div>
</div>
<div id="legend" class="panel">
  <span><i class="dot" style="background:var(--run)"></i>đang chạy</span>
  <span><i class="dot" style="background:var(--idle)"></i>nghỉ/khác</span>
  <span id="scount" style="color:var(--fg)">0 phiên</span>
</div>
<div id="detail" class="panel">
  <div class="a" id="d-addr"></div>
  <div class="kv"><span class="k">PID</span><span id="d-pid"></span></div>
  <div class="kv"><span class="k">Nơi làm việc</span><span id="d-where" style="font-size:11px"></span></div>
  <button id="d-stop">Dừng phiên này</button>
</div>
<div id="tip"></div>
<div id="fallback"><div>
  <h2>Không tải được 3D</h2>
  <p style="color:var(--sub)">Thư viện Three.js cần mạng để tải. Máy đang offline hoặc bị chặn.</p>
  <p><a href="./">← Về dashboard 2D</a> (không cần mạng)</p>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// Xác thực bằng cookie phiên HttpOnly — trình duyệt tự gửi kèm. Không còn
// token trên URL, nên link điều hướng cũng không phải mang theo gì.
const H = { 'Content-Type': 'application/json' };
const $ = id => document.getElementById(id);

$('to2d').href = './';
$('toflow').href = 'flow.html';
document.querySelector('#fallback a').href = './';

// Không có Three (offline/CDN chặn) thì rơi về 2D thay vì màn hình trống.
if (typeof THREE === 'undefined') { $('fallback').style.display = 'grid'; throw new Error('no three'); }

const TINT = {claude:0xD97757, codex:0x10A37F, gemini:0x4285F4, cursor:0x8B5CF6};
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- Three.js scene ----
const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0F172A);
scene.fog = new THREE.FogExp2(0x0a0f1e, 0.03);
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 9, 17);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .06; controls.enablePan = false;
controls.minDistance = 6; controls.maxDistance = 40; controls.maxPolarAngle = Math.PI*0.49;
controls.target.set(0,1,0); controls.autoRotate = !RM; controls.autoRotateSpeed = 0.4;
scene.add(new THREE.AmbientLight(0x334155, 1.2));
const key = new THREE.PointLight(0x22C55E, 0.6, 60); key.position.set(0,14,0); scene.add(key);
const front = new THREE.DirectionalLight(0xffffff, 0.4); front.position.set(6,8,12); scene.add(front);
const grid = new THREE.GridHelper(50, 50, 0x1e293b, 0x162032);
grid.material.transparent = true; grid.material.opacity = .3; grid.position.y = -2; scene.add(grid);

// orchestrator
const orch = new THREE.Mesh(new THREE.OctahedronGeometry(1,0),
  new THREE.MeshStandardMaterial({color:0x0f172a, emissive:0x22C55E, emissiveIntensity:.5, roughness:.35}));
orch.position.y = 1.1; scene.add(orch);

// ---- mascot (robot dễ thương, tô màu provider) ----
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function mascotTex(key,tint){
  const bh='#'+tint.toString(16).padStart(6,'0');
  const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  const g=x.createRadialGradient(128,150,8,128,150,132);g.addColorStop(0,bh+'55');g.addColorStop(1,bh+'00');x.fillStyle=g;x.fillRect(0,0,256,256);
  x.strokeStyle=bh;x.lineWidth=8;x.beginPath();x.moveTo(128,74);x.lineTo(128,52);x.stroke();x.fillStyle=bh;x.beginPath();x.arc(128,48,7,0,7);x.fill();
  x.fillStyle='#0F172A';rr(x,64,74,128,106,30);x.fill();x.strokeStyle=bh;x.lineWidth=6;x.stroke();
  x.fillStyle=bh;x.beginPath();x.arc(104,150,13,0,7);x.arc(152,150,13,0,7);x.fill();
  x.fillStyle='#0F172A';x.beginPath();x.arc(108,150,5,0,7);x.arc(156,150,5,0,7);x.fill();
  x.strokeStyle=bh;x.lineWidth=5;x.beginPath();x.arc(128,166,13,.15*Math.PI,.85*Math.PI);x.stroke();
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;
}

// ---- render động theo dữ liệu thật ----
const orbGeo = new THREE.SphereGeometry(0.42, 22, 22);
let orbGroup = new THREE.Group(); scene.add(orbGroup);
let clusterGroup = new THREE.Group(); scene.add(clusterGroup);
let luongGroup = new THREE.Group(); scene.add(luongGroup);
const duongTruyen = []; // {cur, hat, pha} — hạt chạy dọc cạnh needs
let clickable = []; // {mesh, session}
const labels = [];  // {el, pos}

function clearGroup(g){ while(g.children.length){ const c=g.children.pop(); if(c.geometry&&c.geometry!==orbGeo)c.geometry.dispose(); if(c.material)c.material.dispose(); } }
function clearLabels(){ labels.forEach(l=>l.el.remove()); labels.length=0; }

// Trạng thái của lượt chạy flow mới nhất — thứ cho biết AI ĐANG LÀM GÌ.
// Không có nó thì cảnh 3D chỉ là mấy hình hộp đứng im, nhìn không biết ai chỉ huy
// ai, ai đang chạy, dữ liệu đi từ đâu tới đâu.
let flowSteps = [];   // [{id,type,needs,state,profile,output}]
let flowName  = '';
let agents    = {};   // addr -> {mesh, ring, pos, base, step, state, vai}

// taoRobot dựng linh vật bằng KHỐI 3D THẬT, không phải ảnh phẳng dán lên.
//
// Bản trước dùng THREE.Sprite — một tấm ảnh luôn quay mặt về camera. Sprite thì
// vĩnh viễn không có tay chân, và xoay góc nhìn kiểu gì nó cũng dẹt. Muốn robot
// vung tay lúc gửi tin thì phải có KHỚP thật, nên phải là Group phân cấp: vai là
// cha của cánh tay, xoay vai thì cả tay đi theo — đúng cách xương hoạt động.
//
// Chỉ dùng hình học có trong three.js r128 (bản đang nhúng). CapsuleGeometry chỉ
// có từ r140 nên không dùng được ở đây.
function taoRobot(tint){
  const g = new THREE.Group();
  const than = new THREE.MeshStandardMaterial({color:0x0F172A, metalness:.35, roughness:.45});
  const vien = new THREE.MeshStandardMaterial({color:tint, emissive:tint, emissiveIntensity:.3,
                                               metalness:.4, roughness:.35});
  const sang = new THREE.MeshStandardMaterial({color:tint, emissive:tint, emissiveIntensity:1.2});

  // CHÂN — pivot ở hông để bước được
  const hongT = new THREE.Group(), hongP = new THREE.Group();
  hongT.position.set(-0.22, 0.62, 0); hongP.position.set(0.22, 0.62, 0);
  [hongT, hongP].forEach(h=>{
    const chan = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.55, 0.22), vien);
    chan.position.y = -0.3; h.add(chan);
    const ban = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.12, 0.34), than);
    ban.position.set(0, -0.6, 0.05); h.add(ban);
    g.add(h);
  });

  // THÂN + đèn ngực (nhịp "tim")
  const nguoi = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.7, 0.42), than);
  nguoi.position.y = 1.0; g.add(nguoi);
  const nguc = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.26, 0.06), sang);
  nguc.position.set(0, 1.06, 0.22); g.add(nguc);

  // TAY — pivot ở vai để vung được
  const vaiT = new THREE.Group(), vaiP = new THREE.Group();
  vaiT.position.set(-0.42, 1.25, 0); vaiP.position.set(0.42, 1.25, 0);
  [vaiT, vaiP].forEach(v=>{
    const tay = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.6, 0.18), vien);
    tay.position.y = -0.32; v.add(tay);
    const ban = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 12), than);
    ban.position.y = -0.66; v.add(ban);
    g.add(v);
  });

  // ĐẦU
  const dau = new THREE.Group(); dau.position.y = 1.72; g.add(dau);
  const so = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.64, 0.48), than); dau.add(so);
  const matT = new THREE.Mesh(new THREE.SphereGeometry(0.09, 14, 14), sang);
  const matP = matT.clone();
  matT.position.set(-0.17, 0.03, 0.25); matP.position.set(0.17, 0.03, 0.25);
  dau.add(matT); dau.add(matP);
  const can = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.3, 8), vien);
  can.position.y = 0.45; dau.add(can);
  const bong = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 12), sang);
  bong.position.y = 0.62; dau.add(bong);

  g.userData = {vaiT, vaiP, hongT, hongP, dau, nguc, bong, sang, vien};
  return g;
}

// vaiTro suy từ ĐỒ THỊ của flow, không bịa khái niệm mới vào file flow.
function vaiTro(st){
  const nhan = (st.needs||[]).length;
  const giao = flowSteps.filter(x=>(x.needs||[]).includes(st.id)).length;
  if(!nhan && giao) return 'giao việc';
  if(nhan && !giao) return 'chốt';
  if(nhan && giao) return 'nhận rồi giao';
  return '';
}

function buocCuaAddr(addr){
  // Bước ĐANG CHẠY được ưu tiên; không có thì lấy bước gần nhất của tài khoản đó.
  const cua = flowSteps.filter(s=>s.profile===addr);
  return cua.find(s=>s.state==='running') || cua.filter(s=>s.state).pop() || cua[0] || null;
}

const MAU_TT = {running:0x22C55E, done:0x38BDF8, failed:0xEF4444, pending:0x64748B, '':0x64748B};

function build(state){
  clearGroup(orbGroup); clearGroup(clusterGroup); clearLabels(); clickable=[]; agents={};
  const sessions = state.sessions||[];
  const profiles = state.profiles||[];
  $('scount').textContent = sessions.length + ' phiên';

  // MỘT NODE MỖI TÀI KHOẢN, không gộp theo provider: đội của bạn có hai tài khoản
  // Claude khác nhau, gộp lại thì không nhìn ra ai là người giao việc, ai là thợ.
  const addrs = [...new Set([...profiles.map(p=>p.addr), ...sessions.map(s=>s.addr.split('#')[0])])].sort();

  addrs.forEach((addr,i)=>{
    const prov = addr.split(':')[0];
    const a = addrs.length===1 ? 0 : (i/addrs.length)*Math.PI*2;
    const R = addrs.length===1 ? 0.0001 : 8;
    const c = new THREE.Vector3(Math.cos(a)*R, 0.4, Math.sin(a)*R);

    const st = buocCuaAddr(addr);
    const tt = st ? st.state||'pending' : '';
    const dangChay = tt==='running' || sessions.some(x=>x.addr.split('#')[0]===addr);

    const bot = taoRobot(TINT[prov]||0x94A3B8);
    bot.position.set(c.x, 0.15, c.z);
    bot.lookAt(0, bot.position.y, 0); // quay mặt vào giữa sân để chúng nhìn nhau
    clusterGroup.add(bot);

    // Vòng dưới chân: màu theo trạng thái bước. Nhìn màu là biết đang chạy/xong/hỏng.
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(1.5, 0.07, 8, 48),
      new THREE.MeshStandardMaterial({color:MAU_TT[tt], emissive:MAU_TT[tt],
        emissiveIntensity: dangChay?0.9:0.25, transparent:true, opacity: dangChay?1:0.45}));
    ring.rotation.x = Math.PI/2; ring.position.set(c.x, 0.06, c.z);
    clusterGroup.add(ring);

    agents[addr] = {bot, ring, pos:c, base:0.15, step:st, state:tt, dangChay,
                    vai: st?vaiTro(st):'', ph:i*1.9, gui:0};

    // Nhãn: TÀI KHOẢN · vai trò · việc đang làm
    const el=document.createElement('div'); el.className='lbl';
    const vai = agents[addr].vai ? '<i style="color:#7fd1a6;font-style:normal">'+agents[addr].vai+'</i> · ' : '';
    const viec = st ? (st.id+' <b style="color:'+('#'+MAU_TT[tt].toString(16).padStart(6,'0'))+'">'+(tt||'chờ')+'</b>')
                    : (sessions.some(x=>x.addr.split('#')[0]===addr) ? 'đang chạy' : 'rảnh');
    el.innerHTML = addr + '<small>' + vai + viec + '</small>';
    document.body.appendChild(el);
    labels.push({el, pos:c.clone().setY(3.4)});
  });

  // ---- LUỒNG TRAO ĐỔI: bước A xong → bước B nhận kết quả của A ----
  // Vẽ đúng theo cạnh `needs` của flow, nên nó là quan hệ THẬT chứ không phải
  // hiệu ứng trang trí. Hạt chạy dọc đường cong theo hướng A → B.
  duongTruyen.length = 0;
  clearGroup(luongGroup);
  flowSteps.forEach(b=>{
    (b.needs||[]).forEach(idA=>{
      const a = flowSteps.find(x=>x.id===idA);
      if(!a || !a.profile || !b.profile || a.profile===b.profile) return;
      const A = agents[a.profile], B = agents[b.profile];
      if(!A || !B) return;
      const p0 = A.pos.clone().setY(1.2), p2 = B.pos.clone().setY(1.2);
      const p1 = p0.clone().add(p2).multiplyScalar(0.5).setY(3.6);
      const cur = new THREE.QuadraticBezierCurve3(p0,p1,p2);
      const song = (a.state==='done') && (b.state==='running' || b.state==='done');
      const mau = song ? 0x38BDF8 : 0x475569;
      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(cur.getPoints(40)),
        new THREE.LineBasicMaterial({color:mau, transparent:true, opacity: song?0.8:0.25}));
      luongGroup.add(line);
      if(song){
        const hat = new THREE.Mesh(new THREE.SphereGeometry(0.16,10,10),
          new THREE.MeshBasicMaterial({color:0x7dd3fc}));
        luongGroup.add(hat);
        duongTruyen.push({cur, hat, pha: Math.random(), tu:a.profile, den:b.profile});
        A.gui = 1;              // A đang GỬI -> vung tay
        A.huong = B.pos.clone(); // vung về phía người nhận
        B.nhan = 1;              // B đang NHẬN -> ngửa tay đón
      }
    });
  });

  // orb cho mỗi phiên, xoay quanh TÀI KHOẢN của nó
  const perAddr = {};
  sessions.forEach(s=>{
    const addr = s.addr.split('#')[0];
    const A = agents[addr];
    const c = A ? A.pos : new THREE.Vector3(0,0.4,0);
    const k = (perAddr[addr] = (perAddr[addr]||0)); perAddr[addr]++;
    const count = sessions.filter(x=>x.addr.split('#')[0]===addr).length;
    const ang = count>1 ? (k/count)*Math.PI*2 : 0;
    const m = new THREE.Mesh(orbGeo, new THREE.MeshStandardMaterial({
      color:0x22C55E, emissive:0x22C55E, emissiveIntensity:.4, metalness:.2, roughness:.4}));
    m.position.set(c.x+Math.cos(ang)*2.4, 0.9, c.z+Math.sin(ang)*2.4);
    m.userData.session = s;
    orbGroup.add(m); clickable.push(m);
  });

  $('flowname').textContent = flowName ? ('flow: '+flowName) : '';
}

// ---- tương tác: bấm orb để dừng ----
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let hover=null, selected=null;
function pick(e){ mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera); return ray.intersectObjects(clickable)[0]; }
canvas.addEventListener('pointermove', e=>{ const h=pick(e); hover=h?h.object:null;
  const tip=$('tip'); if(hover){ const s=hover.object?hover.object.userData.session:hover.userData.session;
    tip.style.display='block'; tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px';
    tip.textContent = (hover.userData.session.addr)+' · PID '+hover.userData.session.pid; canvas.style.cursor='pointer';
  } else { tip.style.display='none'; canvas.style.cursor='grab'; } });
let downXY=null;
canvas.addEventListener('pointerdown', e=>downXY=[e.clientX,e.clientY]);
canvas.addEventListener('pointerup', e=>{ if(!downXY)return; const moved=Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1]); downXY=null;
  if(moved>8) return; const h=pick(e); if(!h){ $('detail').style.display='none'; selected=null; return; }
  selected=h.object.userData.session; showDetail(selected); });

function showDetail(s){
  $('d-addr').textContent=s.addr; $('d-pid').textContent=s.pid;
  $('d-where').textContent = s.worktree ? s.worktree.split(/[\\/]/).slice(-2).join('/') : 'thư mục hiện tại';
  $('detail').style.display='block';
}
$('d-stop').onclick = async ()=>{ if(!selected)return;
  try{ await fetch('/api/stop',{method:'POST',headers:H,body:JSON.stringify({id:selected.id})});
    $('detail').style.display='none'; }catch(e){ alert(e.message); } };

// ---- dữ liệu ----
async function refresh(){
  try{
    // Lấy lượt chạy flow mới nhất TRƯỚC khi dựng cảnh: build() cần biết bước nào
    // của ai đang chạy mới vẽ được vai trò và luồng trao đổi.
    try{
      const fr = await fetch('/api/flows',{headers:H});
      if(fr.ok){
        const fd = await fr.json();
        const runs = fd.runs||[];
        const run = runs.find(r=>r.state==='running') || runs[0];
        if(run){
          flowName = run.flow;
          const dr = await fetch('/api/run?id='+run.id,{headers:H});
          if(dr.ok){ flowSteps = (await dr.json()).steps || []; }
        } else { flowName=''; flowSteps=[]; }
      }
    }catch(_){ }
    const r=await fetch('/api/state',{headers:H}); if(!r.ok)throw 0; build(await r.json());
  }catch(_){}
}
function connect(){
  const es=new EventSource('/api/events');
  es.onopen=()=>{ $('conn').classList.add('on'); $('conntext').textContent='đã kết nối'; };
  es.onerror=()=>{ $('conn').classList.remove('on'); $('conntext').textContent='mất kết nối'; };
  es.onmessage=ev=>{ let e; try{e=JSON.parse(ev.data)}catch(_){return}
    if(String(e.type).startsWith('flow.') ||
       ['session.started','session.stopped','worktree.removed','clones.cleaned','profile.created','profile.removed'].includes(e.type)) refresh(); };
}

// ---- vòng lặp ----
function project(){ labels.forEach(l=>{ const v=l.pos.clone().project(camera);
  const vis=v.z<1; l.el.style.display=vis?'block':'none';
  l.el.style.left=((v.x*.5+.5)*innerWidth)+'px'; l.el.style.top=((-v.y*.5+.5)*innerHeight)+'px'; }); }
let t=0;
function tick(){ requestAnimationFrame(tick); t+=0.016;
  if(!RM){ orch.rotation.y+=0.006;
    orbGroup.children.forEach((m,i)=>{ const p=0.5+0.5*Math.sin(t*2.4+i); m.material.emissiveIntensity=0.3+p*0.5; m.scale.setScalar(1+p*0.08); });

    // BA ĐIỆU KHÁC NHAU, mỗi điệu ứng với một việc thật — không phải nhấp nháy
    // trang trí. Nhìn dáng là đoán được nó đang làm gì mà chưa cần đọc nhãn:
    //   rảnh    : thở chậm, tay buông, thỉnh thoảng nghiêng đầu
    //   làm việc: hai tay gõ so le, người hơi chúi tới, chân nhún, mắt sáng
    //   gửi tin : xoay người về phía người nhận rồi VUNG một tay lên
    for(const addr in agents){
      const A = agents[addr]; const u = A.bot.userData; const ph = A.ph;

      if(A.gui){
        // GỬI: quay mặt về người nhận, vung tay phải theo nhịp
        if(A.huong){
          const m = Math.atan2(A.huong.x-A.pos.x, A.huong.z-A.pos.z);
          A.bot.rotation.y += (m - A.bot.rotation.y) * 0.08;
        }
        const v = Math.sin(t*4.5+ph);
        u.vaiP.rotation.x = -2.1 + v*0.35;   // giơ cao
        u.vaiP.rotation.z = -0.25;
        u.vaiT.rotation.x = 0.15*v;
        u.dau.rotation.x  = -0.12;
        A.bot.position.y  = A.base + Math.abs(v)*0.05;
      } else if(A.dangChay){
        // LÀM VIỆC: gõ hai tay so le
        const g1 = Math.sin(t*7.5+ph), g2 = Math.sin(t*7.5+ph+Math.PI);
        u.vaiT.rotation.x = -1.05 + g1*0.28;
        u.vaiP.rotation.x = -1.05 + g2*0.28;
        u.vaiT.rotation.z =  0.22; u.vaiP.rotation.z = -0.22;
        u.hongT.rotation.x =  g2*0.08; u.hongP.rotation.x = g1*0.08;
        u.dau.rotation.x  = 0.16 + g1*0.05;   // chúi xuống như đang nhìn màn hình
        A.bot.position.y  = A.base + Math.abs(g1)*0.045;
      } else {
        // RẢNH: thở, tay buông, thỉnh thoảng nghiêng đầu
        const b = Math.sin(t*1.05+ph);
        u.vaiT.rotation.x = 0.06*b;  u.vaiP.rotation.x = -0.06*b;
        u.vaiT.rotation.z = 0.08;    u.vaiP.rotation.z = -0.08;
        u.hongT.rotation.x = 0; u.hongP.rotation.x = 0;
        u.dau.rotation.x = 0.03*b;
        u.dau.rotation.z = 0.10*Math.sin(t*0.34+ph); // ngó nghiêng
        A.bot.position.y = A.base + b*0.035;
      }

      // đèn ngực + đèn ăng-ten: nhịp tim nhanh khi bận
      const nhip = 0.5 + 0.5*Math.sin(t*(A.dangChay||A.gui ? 6.5 : 1.4) + ph);
      u.nguc.material.emissiveIntensity = 0.5 + nhip*1.5;
      u.bong.scale.setScalar(0.85 + nhip*0.35);

      if(A.ring){
        A.ring.rotation.z += (A.dangChay||A.gui) ? 0.03 : 0.004;
        A.ring.material.emissiveIntensity = (A.dangChay||A.gui) ? 0.6+0.5*nhip : 0.25;
      }
    }
    // Hạt chạy dọc cạnh needs: A xong → B nhận. Hướng đi chính là hướng dữ liệu.
    duongTruyen.forEach((d,i)=>{
      d.pha = (d.pha + 0.006) % 1;
      const v = d.cur.getPoint(d.pha);
      d.hat.position.copy(v);
      d.hat.scale.setScalar(0.8 + 0.4*Math.sin(t*6+i));
    });
  }
  if(hover){ hover.scale.setScalar(1.3); }
  controls.update(); project(); renderer.render(scene,camera); }
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
renderer.setSize(innerWidth,innerHeight);

refresh(); connect(); tick();
</script>
