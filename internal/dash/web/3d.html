<!-- Ba @font-face + toàn bộ bảng màu nay nằm ở vendor/token.css, dùng chung với
     ba trang 2D. Trước đây trang này là trang DUY NHẤT nhúng font, và nó còn tự
     khai một bảng màu thứ tư — nên chuyển 2D↔3D là đổi cả chữ lẫn màu.
     Trang không được tự khai lại --run/--pending/--done/--idle/--error
     (test giữ: designsystem_test.go). -->
<link rel="stylesheet" href="vendor/token.css" />
<style>
  /* --mono giữ lại làm bí danh cho --font-mono: trang này gọi nó ở 5 chỗ. */
  :root{--mono:var(--font-mono)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--void);color:var(--hi);
    font-family:var(--font-body);overflow:hidden;touch-action:none}
  #scene{position:fixed;inset:0;display:block}
  .panel{position:fixed;background:rgba(12,14,23,.72);border:1px solid var(--line);border-radius:12px;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 10px 20px rgba(0,0,0,.4)}
  #top{top:12px;left:12px;right:12px;height:50px;display:flex;align-items:center;gap:12px;padding:0 14px}
  .b{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;
    font-family:var(--font-display)}
  .b small{color:var(--mid);font-weight:400;font-size:11px}
  #conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mid)}
  #conn .d{width:9px;height:9px;border-radius:50%;background:var(--error)}#conn.on .d{background:var(--run)}
  .nav{margin-left:auto;display:flex;gap:8px}
  /* Thanh điều hướng là KHUNG: đơn sắc. Tab đang mở nổi bằng độ sáng, không màu. */
  .nav a{text-decoration:none;color:var(--hi);border:1px solid var(--line-2);border-radius:8px;
    padding:7px 12px;font-size:12px;font-weight:600}
  .nav a.on{border-color:var(--hi);background:rgba(255,255,255,.09)}
  .nav a:focus-visible,#detail button:focus-visible{outline:2px solid var(--core);outline-offset:2px}
  #legend{bottom:12px;left:12px;display:flex;gap:14px;padding:9px 14px;font-size:12px}
  #legend span{display:flex;align-items:center;gap:6px;color:var(--mid)}
  .dot{width:9px;height:9px;border-radius:50%}
  #detail{bottom:12px;right:12px;width:250px;padding:14px;display:none}
  #detail .a{font-size:17px;font-weight:600;font-family:var(--mono)}
  #detail .kv{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;
    font-family:var(--mono);border-bottom:1px solid var(--line)}
  #detail .kv .k{color:var(--mid)}
  #detail button{margin-top:12px;width:100%;cursor:pointer;background:transparent;color:var(--error);
    border:1px solid rgba(255,93,121,.5);border-radius:8px;padding:8px;font:inherit;font-weight:600}
  #detail button:hover{background:rgba(255,93,121,.12)}
  #tip{position:fixed;transform:translate(12px,12px);pointer-events:none;z-index:8;background:var(--panel-2);
    border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-size:12px;
    font-family:var(--mono);display:none}
  #fallback{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px}
  #fallback div{max-width:360px}#fallback a{color:var(--link)}
  .lbl{position:fixed;transform:translate(-50%,-50%);font-size:12px;font-weight:600;
    font-family:var(--mono);
    text-shadow:0 0 10px rgba(0,0,0,.95);pointer-events:none;white-space:nowrap}
  .lbl small{display:block;color:var(--mid);font-weight:400;font-size:10px;text-align:center}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="top" class="panel">
  <div class="b">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l8.5 5v10L12 22 3.5 17V7z"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg>
    Switch-Agent-Pro <small>3D · dữ liệu thật</small>
  </div>
  <div id="flowname" style="font-size:12px;color:var(--link);font-weight:600;font-family:var(--mono)"></div>
  <div id="conn"><span class="d"></span><span id="conntext">đang kết nối…</span></div>
  <div class="nav"><a id="to2d" href="./">2D</a><a class="on" href="3d.html">3D</a><a id="toflow" href="flow.html">Workflow</a><a href="/docs/">Plan</a><a href="/logout">Thoát</a></div>
</div>
<div id="legend" class="panel">
  <span><i class="dot" style="background:var(--run)"></i>đang chạy</span>
  <span><i class="dot" style="background:var(--idle)"></i>nghỉ/khác</span>
  <span id="scount" style="color:var(--hi)">0 phiên</span>
</div>
<div id="detail" class="panel">
  <div class="a" id="d-addr"></div>
  <div class="kv"><span class="k">PID</span><span id="d-pid"></span></div>
  <div class="kv"><span class="k">Nơi làm việc</span><span id="d-where" style="font-size:11px"></span></div>
  <button id="d-stop">Dừng phiên này</button>
</div>
<div id="tip"></div>
<div id="fallback"><div>
  <h2>Không tải được 3D</h2>
  <p style="color:var(--mid)">Three.js nằm sẵn trong binary nên không phải lỗi mạng:
    trình duyệt này không dựng được WebGL.</p>
  <p><a href="./">← Về dashboard 2D</a> (không cần mạng)</p>
</div></div>

<script src="vendor/three.min.js"></script>
<script>
// Xác thực bằng cookie phiên HttpOnly — trình duyệt tự gửi kèm. Không còn
// token trên URL, nên link điều hướng cũng không phải mang theo gì.
const H = { 'Content-Type': 'application/json' };
const $ = id => document.getElementById(id);

$('to2d').href = './';
$('toflow').href = 'flow.html';
document.querySelector('#fallback a').href = './';

// Mặt 3D hỏng thì CHỈ mặt 3D hỏng. Bảng 2D là DOM/CSS thuần ở file khác, nên
// nó không dính gì; việc duy nhất phải làm ở đây là chỉ đường về đó tử tế,
// thay vì bỏ người dùng ở lại một màn hình đen không nói gì.
function hongThreeJS(){
  $('fallback').style.display = 'grid';
  $('scene').style.display = 'none';
}
if (typeof THREE === 'undefined') { hongThreeJS(); throw new Error('no three'); }

// ---- MÀU: đọc từ vendor/token.css, không chép mã màu vào JS ----
//
// Trước đây bảng màu của cảnh 3D nằm ngay trong file này (MAU_TT, TINT,
// 0x39D9E0...). Nó khớp với token.css đúng vào NGÀY chép — sau đó token.css
// đổi một lần là 3D giữ màu cũ, im lặng, không ai báo lỗi. Đó chính là cách
// "bảng màu thứ tư" quay về bằng đường vòng.
//
// WebGL cần số chứ không đọc được biến CSS, nên phải có bước dịch: đọc giá trị
// thật của biến trên :root rồi đổi #RRGGBB thành số. Một bước, chạy một lần
// lúc dựng, và từ đó chỉ còn MỘT nguồn màu duy nhất.
const CSS_ROOT = getComputedStyle(document.documentElement);
// Dự phòng DUY NHẤT của cả file. Để nhiều giá trị dự phòng thì thực chất là
// chép lại bảng màu lần hai. Một giá trị xám: token.css hỏng thì cả cảnh xám
// đều — thấy ngay là hỏng, chứ không lệch màu lắt nhắt rồi tưởng là thật.
const XAM = 0x5A6273;
function mauToken(ten){
  const v = (CSS_ROOT.getPropertyValue(ten) || '').trim();
  const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(v);
  if(!m) return XAM;
  const h = m[1].length === 3 ? m[1].replace(/./g, c => c + c) : m[1];
  return parseInt(h, 16);
}

// Trạng thái — CÙNG bộ token mà 2D dùng cho pill/chấm (vendor/token.css):
// --run --done --error --pending --idle. Trước đây 3D có bộ riêng, nên một
// bước "xong" ở bảng 2D là xanh lá còn ở 3D là xanh dương.
const MAU_TT = {running:mauToken('--run'), done:mauToken('--done'),
                failed:mauToken('--error'), pending:mauToken('--pending'),
                '':mauToken('--idle')};
// Sắc HÃNG = da robot. Đây là DANH TÍNH chứ không phải trạng thái, nên nó chỉ
// nằm trên robot; vòng dưới chân mới mang màu trạng thái. Cùng bộ --prov-* mà
// hội thoại 2D dùng để tô huy hiệu hãng.
const TINT = {claude:mauToken('--prov-claude'), codex:mauToken('--prov-codex'),
              gemini:mauToken('--prov-gemini'), cursor:mauToken('--prov-cursor'),
              antigravity:mauToken('--prov-antigravity'), grok:mauToken('--prov-grok')};
const MAU_NEN  = mauToken('--void');
const MAU_LO   = mauToken('--prov-may');   // hãng lạ: xám, không bịa màu mới
const MAU_CORE = mauToken('--core');
const MAU_LINK = mauToken('--link');
const MAU_CHU  = mauToken('--hi');

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

// CHAY: hai trạng thái mà phiên ĐANG thật sự làm việc. Chỉ hai trạng thái này
// mới được có hạt chạy dọc beam. Hạt chạy ở done/idle là chuyển động không mã
// hoá thông tin nào — nhìn thì sống động, đọc thì sai.
const CHAY = tt => tt === 'running' || tt === 'pending';

// ---- Three.js scene ----
const canvas = $('scene');
let renderer;
// WebGLRenderer NÉM khi trình duyệt không dựng được context (máy ảo không GPU,
// driver cũ, WebGL bị tắt trong cấu hình). Không bắt thì trang ra màn đen im
// lặng — đúng kiểu hỏng mà dự án này sợ nhất.
try {
  renderer = new THREE.WebGLRenderer({canvas, antialias:true});
} catch(e) {
  hongThreeJS();
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(MAU_NEN);
// Chiều sâu: sương mũ mờ dần theo khoảng cách. Không có nó thì vật ở xa và vật
// ở gần sáng như nhau, cả cảnh bẹt lại thành một miếng phẳng.
scene.fog = new THREE.FogExp2(MAU_NEN, 0.028);
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 9, 17);
// Orbit TỰ VIẾT TAY. OrbitControls là addon: một file rời nữa phải tải — dùng nó
// là buộc phải có CDN, mà CDN chính là thứ làm màn 3D trắng trơn. Bản nhúng
// chỉ giữ MỘT file three core. Hành vi giữ y hệt bản cũ: damping .06, không
// pan, target (0,1,0), tự xoay nhẹ khi không bật reduce-motion, zoom 6..40,
// clamp polar <= PI*0.49 để camera không lật qua cực.
const controls = (function(){
  const GAN = 6, XA = 40, POLAR_MAX = Math.PI*0.49, POLAR_MIN = 0.05;
  const DAMP = .06, TU_XOAY = RM ? 0 : 2*Math.PI/3600*0.4; // 0.4 = autoRotateSpeed cũ
  const target = new THREE.Vector3(0,1,0);
  const off = camera.position.clone().sub(target);
  // toạ độ cầu: r bán kính, polar góc với trục Y, azi góc quay quanh trục Y
  const nay = {r: off.length(), polar: Math.acos(off.y/off.length()), azi: Math.atan2(off.x, off.z)};
  const muon = {r: nay.r, polar: nay.polar, azi: nay.azi};
  let keo = null;
  canvas.addEventListener('pointerdown', e=>{ keo = {x:e.clientX, y:e.clientY};
    if(canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e=>{ if(!keo) return;
    muon.azi   -= (e.clientX - keo.x)*0.005;
    muon.polar -= (e.clientY - keo.y)*0.005;
    muon.polar = Math.min(POLAR_MAX, Math.max(POLAR_MIN, muon.polar));
    keo = {x:e.clientX, y:e.clientY}; });
  const buong = ()=>{ keo = null; };
  canvas.addEventListener('pointerup', buong);
  canvas.addEventListener('pointercancel', buong);
  canvas.addEventListener('wheel', e=>{ e.preventDefault();
    muon.r = Math.min(XA, Math.max(GAN, muon.r * (e.deltaY > 0 ? 1.1 : 1/1.1))); }, {passive:false});
  return {
    target: target,
    // update() gọi mỗi frame — nhích dần tới góc muốn (damping) rồi đặt lại camera.
    update: function(){
      if(TU_XOAY && !keo) muon.azi -= TU_XOAY;
      nay.azi   += (muon.azi   - nay.azi)*DAMP;
      nay.polar += (muon.polar - nay.polar)*DAMP;
      nay.r     += (muon.r     - nay.r)*DAMP;
      const sin = Math.sin(nay.polar);
      camera.position.set(target.x + nay.r*sin*Math.sin(nay.azi),
                          target.y + nay.r*Math.cos(nay.polar),
                          target.z + nay.r*sin*Math.cos(nay.azi));
      camera.lookAt(target);
    }
  };
})();
scene.add(new THREE.AmbientLight(mauToken('--lo'), 1.1));
const key = new THREE.PointLight(MAU_CORE, 0.9, 60);   // đèn của lõi điều phối
key.position.set(0, 14, 0);
scene.add(key);
// Ba dòng trên từng là MỘT dòng: `const key = ...;  // --core: đèn của lõi điều
// phối key.position.set(0,14,0); scene.add(key);`. Dấu // nuốt luôn hai câu lệnh
// sau nó, nên đèn được tạo, được đặt tên, và không bao giờ sáng. Đừng gộp lại.
const front = new THREE.DirectionalLight(MAU_CHU, 0.4); front.position.set(6,8,12); scene.add(front);
const grid = new THREE.GridHelper(60, 60, mauToken('--panel-2'), mauToken('--panel'));
grid.material.transparent = true; grid.material.opacity = .32; grid.position.y = -0.06; scene.add(grid);

// ---- QUẦNG SÁNG: glow sprite additive, KHÔNG post-processing ----
//
// "Bloom" đúng nghĩa là EffectComposer + UnrealBloomPass — cả hai đều là addon
// three.js, tức thêm file rời phải tải. Bản này nhúng thẳng vào binary và chạy
// offline nên chỉ được giữ MỘT file three core. Thay bằng cách cũ mà hiệu quả:
// một sprite gradient toả tròn, blending cộng (AdditiveBlending) nên chồng lớp
// thì sáng dồn lên đúng như quầng thật, và depthWrite tắt để nó không khoét
// vào vật phía sau.
function texQuang(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.22,'rgba(255,255,255,.55)');
  g.addColorStop(0.55,'rgba(255,255,255,.14)');
  g.addColorStop(1,   'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
const TEX_QUANG = texQuang();
function taoQuang(mau, co, mo){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX_QUANG, color: mau, blending: THREE.AdditiveBlending,
    depthWrite: false, transparent: true, opacity: mo === undefined ? .85 : mo}));
  s.scale.setScalar(co);
  return s;
}

// ---- LÕI ĐIỀU PHỐI: icosahedron wireframe + halo ----
//
// Wireframe chứ không phải khối đặc: lõi đứng giữa sân, khối đặc sẽ che mất
// orb ở phía sau nó mỗi khi camera xoay qua. Khung dây thì nhìn xuyên được, và
// nó đọc ra "bộ khung điều phối" thay vì một hòn đá.
const CORE_Y = 1.7;
const core = new THREE.Group(); core.position.y = CORE_Y; scene.add(core);
core.add(new THREE.Mesh(new THREE.IcosahedronGeometry(1.15, 1),
  new THREE.MeshBasicMaterial({color:MAU_CORE, wireframe:true, transparent:true, opacity:.8})));
core.add(new THREE.Mesh(new THREE.IcosahedronGeometry(0.6, 0),
  new THREE.MeshBasicMaterial({color:MAU_CORE, transparent:true, opacity:.3})));
const halo = taoQuang(MAU_CORE, 7.0, .5); core.add(halo);

// Vành sân: đường tròn mảnh đơn sắc, đánh dấu đúng chỗ agent đứng. Nó biến
// "mấy robot rải rác" thành "một đội hình" — mắt bắt được vành trước, rồi mới
// đếm từng agent trên đó.
const R_VANH = 8;      // bán kính vành agent — MỘT vành, khai một chỗ
const R_ORB  = 3.6;    // bán kính vành phiên, nằm trong, quanh lõi
const vanhSan = new THREE.Mesh(new THREE.TorusGeometry(R_VANH, 0.025, 6, 160),
  new THREE.MeshBasicMaterial({color:mauToken('--lo'), transparent:true, opacity:.28}));
vanhSan.rotation.x = Math.PI/2; vanhSan.position.y = 0.02; scene.add(vanhSan);

// ---- mascot (robot dễ thương, tô màu provider) ----
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function mascotTex(key,tint){
  const bh='#'+tint.toString(16).padStart(6,'0');
  const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  const g=x.createRadialGradient(128,150,8,128,150,132);g.addColorStop(0,bh+'55');g.addColorStop(1,bh+'00');x.fillStyle=g;x.fillRect(0,0,256,256);
  x.strokeStyle=bh;x.lineWidth=8;x.beginPath();x.moveTo(128,74);x.lineTo(128,52);x.stroke();x.fillStyle=bh;x.beginPath();x.arc(128,48,7,0,7);x.fill();
  x.fillStyle='#070810';rr(x,64,74,128,106,30);x.fill();x.strokeStyle=bh;x.lineWidth=6;x.stroke();
  x.fillStyle=bh;x.beginPath();x.arc(104,150,13,0,7);x.arc(152,150,13,0,7);x.fill();
  x.fillStyle='#070810';x.beginPath();x.arc(108,150,5,0,7);x.arc(156,150,5,0,7);x.fill();
  x.strokeStyle=bh;x.lineWidth=5;x.beginPath();x.arc(128,166,13,.15*Math.PI,.85*Math.PI);x.stroke();
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;
}

// ---- render động theo dữ liệu thật ----
const orbGeo   = new THREE.SphereGeometry(0.42, 22, 22);
const orbVanhGeo = new THREE.TorusGeometry(0.72, 0.035, 8, 40);
// Hình học DÙNG CHUNG giữa các lần dựng — clearGroup không được dispose chúng,
// nếu không thì lần dựng thứ hai vẽ ra khoảng trống.
const dungChung = new Set([orbGeo, orbVanhGeo]);
let orbGroup = new THREE.Group(); scene.add(orbGroup);
let clusterGroup = new THREE.Group(); scene.add(clusterGroup);
let luongGroup = new THREE.Group(); scene.add(luongGroup);
const duongTruyen = []; // {cur, hat, pha} — hạt chạy dọc cạnh needs
const tiaCore = [];     // {tu, den, hat, pha, nhanh} — hạt chạy dọc beam lõi->orb
const orbs = [];        // {m, vanh, glow, tt, ph, co}
let clickable = []; // {mesh, session}
const labels = [];  // {el, pos}

function clearGroup(g){
  while(g.children.length){
    const c = g.children.pop();
    // traverse chứ không chỉ xét con trực tiếp: robot là một Group lồng nhiều
    // cấp, xét mỗi cấp trên thì mọi hình học bên trong nó rò lại mỗi lần dựng.
    c.traverse(o=>{
      // Sprite dùng CHUNG một geometry nội bộ của three — dispose nó là giết
      // mọi sprite khác trong cảnh. Chỉ bỏ material.
      if(o.geometry && !o.isSprite && !dungChung.has(o.geometry)) o.geometry.dispose();
      if(o.material) o.material.dispose();
    });
  }
}
function clearLabels(){ labels.forEach(l=>l.el.remove()); labels.length=0; }

// Trạng thái của lượt chạy flow mới nhất — thứ cho biết AI ĐANG LÀM GÌ.
// Không có nó thì cảnh 3D chỉ là mấy hình hộp đứng im, nhìn không biết ai chỉ huy
// ai, ai đang chạy, dữ liệu đi từ đâu tới đâu.
let flowSteps = [];   // [{id,type,needs,state,profile,output}]
let flowName  = '';
let agents    = {};   // addr -> {mesh, ring, pos, base, step, state, vai}

// taoRobot dựng linh vật bằng KHỐI 3D THẬT, không phải ảnh phẳng dán lên.
//
// Bản trước dùng THREE.Sprite — một tấm ảnh luôn quay mặt về camera. Sprite thì
// vĩnh viễn không có tay chân, và xoay góc nhìn kiểu gì nó cũng dẹt. Muốn robot
// vung tay lúc gửi tin thì phải có KHỚP thật, nên phải là Group phân cấp: vai là
// cha của cánh tay, xoay vai thì cả tay đi theo — đúng cách xương hoạt động.
//
// Chỉ dùng hình học có trong three.js r128 (bản đang nhúng). CapsuleGeometry chỉ
// có từ r140 nên không dùng được ở đây.
function taoRobot(tint){
  const g = new THREE.Group();
  const than = new THREE.MeshStandardMaterial({color:MAU_NEN, metalness:.35, roughness:.45});
  const vien = new THREE.MeshStandardMaterial({color:tint, emissive:tint, emissiveIntensity:.3,
                                               metalness:.4, roughness:.35});
  const sang = new THREE.MeshStandardMaterial({color:tint, emissive:tint, emissiveIntensity:1.2});

  // CHÂN — pivot ở hông để bước được
  const hongT = new THREE.Group(), hongP = new THREE.Group();
  hongT.position.set(-0.22, 0.62, 0); hongP.position.set(0.22, 0.62, 0);
  [hongT, hongP].forEach(h=>{
    const chan = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.55, 0.22), vien);
    chan.position.y = -0.3; h.add(chan);
    const ban = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.12, 0.34), than);
    ban.position.set(0, -0.6, 0.05); h.add(ban);
    g.add(h);
  });

  // THÂN + đèn ngực (nhịp "tim")
  const nguoi = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.7, 0.42), than);
  nguoi.position.y = 1.0; g.add(nguoi);
  const nguc = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.26, 0.06), sang);
  nguc.position.set(0, 1.06, 0.22); g.add(nguc);

  // TAY — pivot ở vai để vung được
  const vaiT = new THREE.Group(), vaiP = new THREE.Group();
  vaiT.position.set(-0.42, 1.25, 0); vaiP.position.set(0.42, 1.25, 0);
  [vaiT, vaiP].forEach(v=>{
    const tay = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.6, 0.18), vien);
    tay.position.y = -0.32; v.add(tay);
    const ban = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 12), than);
    ban.position.y = -0.66; v.add(ban);
    g.add(v);
  });

  // ĐẦU
  const dau = new THREE.Group(); dau.position.y = 1.72; g.add(dau);
  const so = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.64, 0.48), than); dau.add(so);
  const matT = new THREE.Mesh(new THREE.SphereGeometry(0.09, 14, 14), sang);
  const matP = matT.clone();
  matT.position.set(-0.17, 0.03, 0.25); matP.position.set(0.17, 0.03, 0.25);
  dau.add(matT); dau.add(matP);
  const can = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.3, 8), vien);
  can.position.y = 0.45; dau.add(can);
  const bong = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 12), sang);
  bong.position.y = 0.62; dau.add(bong);

  g.userData = {vaiT, vaiP, hongT, hongP, dau, nguc, bong, sang, vien};
  return g;
}

// vaiTro suy từ ĐỒ THỊ của flow, không bịa khái niệm mới vào file flow.
function vaiTro(st){
  const nhan = (st.needs||[]).length;
  const giao = flowSteps.filter(x=>(x.needs||[]).includes(st.id)).length;
  if(!nhan && giao) return 'giao việc';
  if(nhan && !giao) return 'chốt';
  if(nhan && giao) return 'nhận rồi giao';
  return '';
}

function buocCuaAddr(addr){
  // Bước ĐANG CHẠY được ưu tiên; không có thì lấy bước gần nhất của tài khoản đó.
  const cua = flowSteps.filter(s=>s.profile===addr);
  return cua.find(s=>s.state==='running') || cua.filter(s=>s.state).pop() || cua[0] || null;
}

function build(state){
  clearGroup(orbGroup); clearGroup(clusterGroup); clearLabels();
  clickable=[]; agents={}; orbs.length=0; tiaCore.length=0;
  const sessions = state.sessions||[];
  const profiles = state.profiles||[];
  $('scount').textContent = sessions.length + ' phiên';

  // MỘT NODE MỖI TÀI KHOẢN, không gộp theo provider: đội của bạn có hai tài khoản
  // Claude khác nhau, gộp lại thì không nhìn ra ai là người giao việc, ai là thợ.
  const addrs = [...new Set([...profiles.map(p=>p.addr), ...sessions.map(s=>s.addr.split('#')[0])])].sort();

  // XẾP ĐỀU TRÊN MỘT VÀNH, không thả trôi. Góc chỉ phụ thuộc thứ hạng i trong
  // danh sách đã sort, nên mở lại trang là mọi thứ vẫn ở đúng chỗ cũ — mắt nhớ
  // được vị trí, và đó là điều kiện để "nhìn phát biết" hoạt động.
  addrs.forEach((addr,i)=>{
    const prov = addr.split(':')[0];
    const goc = addrs.length===1 ? 0 : (i/addrs.length)*Math.PI*2;
    const R = addrs.length===1 ? 0.0001 : R_VANH;
    const c = new THREE.Vector3(Math.cos(goc)*R, 0.4, Math.sin(goc)*R);

    const st = buocCuaAddr(addr);
    const tt = st ? st.state||'pending' : '';
    const dangChay = tt==='running' || sessions.some(x=>x.addr.split('#')[0]===addr);

    const bot = taoRobot(TINT[prov]||MAU_LO);
    bot.position.set(c.x, 0.15, c.z);
    bot.lookAt(0, bot.position.y, 0); // quay mặt vào giữa sân để chúng nhìn nhau
    clusterGroup.add(bot);

    // Vòng dưới chân: màu theo trạng thái bước. Nhìn màu là biết đang chạy/xong/hỏng.
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(1.5, 0.07, 8, 48),
      new THREE.MeshStandardMaterial({color:MAU_TT[tt], emissive:MAU_TT[tt],
        emissiveIntensity: dangChay?0.9:0.25, transparent:true, opacity: dangChay?1:0.45}));
    ring.rotation.x = Math.PI/2; ring.position.set(c.x, 0.06, c.z);
    clusterGroup.add(ring);

    agents[addr] = {bot, ring, pos:c, goc, base:0.15, step:st, state:tt, dangChay,
                    vai: st?vaiTro(st):'', ph:i*1.9, gui:0};

    // Nhãn: TÀI KHOẢN · vai trò · việc đang làm
    const el=document.createElement('div'); el.className='lbl';
    const vai = agents[addr].vai ? '<i style="color:var(--mid);font-style:normal">'+agents[addr].vai+'</i> · ' : '';
    const viec = st ? (st.id+' <b style="color:'+('#'+MAU_TT[tt].toString(16).padStart(6,'0'))+'">'+(tt||'chờ')+'</b>')
                    : (sessions.some(x=>x.addr.split('#')[0]===addr) ? 'đang chạy' : 'rảnh');
    el.innerHTML = addr + '<small>' + vai + viec + '</small>';
    document.body.appendChild(el);
    labels.push({el, pos:c.clone().setY(3.4)});
  });

  // ---- LUỒNG TRAO ĐỔI: bước A xong → bước B nhận kết quả của A ----
  // Vẽ đúng theo cạnh `needs` của flow, nên nó là quan hệ THẬT chứ không phải
  // hiệu ứng trang trí. Hạt chạy dọc đường cong theo hướng A → B.
  duongTruyen.length = 0;
  clearGroup(luongGroup);
  flowSteps.forEach(b=>{
    (b.needs||[]).forEach(idA=>{
      const a = flowSteps.find(x=>x.id===idA);
      if(!a || !a.profile || !b.profile || a.profile===b.profile) return;
      const A = agents[a.profile], B = agents[b.profile];
      if(!A || !B) return;
      const p0 = A.pos.clone().setY(1.2), p2 = B.pos.clone().setY(1.2);
      const p1 = p0.clone().add(p2).multiplyScalar(0.5).setY(3.6);
      const cur = new THREE.QuadraticBezierCurve3(p0,p1,p2);
      const song = (a.state==='done') && (b.state==='running' || b.state==='done');
      const mau = song ? MAU_LINK : mauToken('--panel-2');  // --link khi có dữ liệu chảy
      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(cur.getPoints(40)),
        new THREE.LineBasicMaterial({color:mau, transparent:true, opacity: song?0.8:0.25}));
      luongGroup.add(line);
      if(song){
        A.gui = 1;               // A đang GỬI -> vung tay
        A.huong = B.pos.clone(); // vung về phía người nhận
        B.nhan = 1;              // B đang NHẬN -> ngửa tay đón
        if(!RM){
          const hat = taoQuang(MAU_LINK, 0.9);
          luongGroup.add(hat);
          // Pha lệch nhau theo THỨ TỰ cạnh, không phải Math.random(): hạt vẫn
          // không đi thành một khối, mà cảnh dựng lại vẫn ra y hệt.
          duongTruyen.push({cur, hat, pha: (duongTruyen.length*0.23)%1, tu:a.profile, den:b.profile});
        }
      }
    });
  });

  // ---- ORB PHIÊN: vành trong quanh lõi, mỗi phiên một orb ----
  //
  // Orb đứng trên vành bán kính R_ORB, ở ĐÚNG hướng của tài khoản chủ nó, nên
  // đọc được cả hai chiều: orb thuộc về ai (cùng hướng với robot đó), và tất cả
  // orb cùng thuộc về lõi điều phối (cùng một vành quanh lõi).
  const perAddr = {};
  sessions.forEach((s,i)=>{
    const addr = s.addr.split('#')[0];
    const A = agents[addr];
    const count = sessions.filter(x=>x.addr.split('#')[0]===addr).length;
    const k = (perAddr[addr] = (perAddr[addr]||0)); perAddr[addr]++;
    // Nhiều phiên cùng một tài khoản thì toè ra quanh hướng của tài khoản đó,
    // đối xứng qua nó — không chồng lên nhau, cũng không rời khỏi hướng gốc.
    const gocGoc = A ? A.goc : (i/Math.max(1,sessions.length))*Math.PI*2;
    const goc = gocGoc + (k - (count-1)/2)*0.17;
    const p = new THREE.Vector3(Math.cos(goc)*R_ORB, 1.15, Math.sin(goc)*R_ORB);

    // Phiên đang sống thì mặc định là đang chạy; có bước flow thì bước nói thật
    // hơn (bước có thể còn đang chờ tài nguyên).
    const tt = A && A.state === 'pending' ? 'pending' : 'running';
    const mau = MAU_TT[tt];

    // MeshBasicMaterial: unlit, nên orb tự phát sáng đúng màu token thay vì bị
    // đèn trong cảnh kéo lệch. Màu trạng thái phải đọc chính xác như pill 2D.
    const m = new THREE.Mesh(orbGeo, new THREE.MeshBasicMaterial({color:mau}));
    m.position.copy(p); m.userData.session = s;
    orbGroup.add(m); clickable.push(m);

    const vanh = new THREE.Mesh(orbVanhGeo,
      new THREE.MeshBasicMaterial({color:mau, transparent:true, opacity:.55}));
    vanh.position.copy(p); vanh.rotation.x = Math.PI*0.42; orbGroup.add(vanh);

    const glow = taoQuang(mau, 2.6); glow.position.copy(p); orbGroup.add(glow);
    orbs.push({m, vanh, glow, tt, ph:i*1.37, co:2.6,
               nhanh: tt==='running' ? 3.2 : 1.5});

    // BEAM lõi -> orb: lõi điều phối cấp việc cho phiên, và đường này nói đúng
    // điều đó. Mờ, đơn sắc theo màu trạng thái, không tranh nhìn với orb.
    const goc0 = new THREE.Vector3(0, CORE_Y, 0);
    const beam = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([goc0, p]),
      new THREE.LineBasicMaterial({color:mau, transparent:true, opacity: CHAY(tt)?0.45:0.14}));
    orbGroup.add(beam);

    // Hạt chỉ chạy khi phiên THẬT SỰ đang làm việc, và không chạy khi người
    // dùng đã bảo giảm chuyển động. Hạt chạy ở trạng thái nghỉ là chuyển động
    // không mã hoá thông tin nào — nhìn thì sống, đọc thì sai.
    if(CHAY(tt) && !RM){
      const hat = taoQuang(mau, 0.85);
      hat.position.copy(goc0); orbGroup.add(hat);
      tiaCore.push({tu:goc0.clone(), den:p.clone(), hat, pha:(i*0.31)%1,
                    nhanh: tt==='running' ? 0.011 : 0.005});
    }
  });

  $('flowname').textContent = flowName ? ('flow: '+flowName) : '';
}

// ---- tương tác: bấm orb để dừng ----
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let hover=null, selected=null;
function pick(e){ mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera); return ray.intersectObjects(clickable)[0]; }
canvas.addEventListener('pointermove', e=>{ const h=pick(e); hover=h?h.object:null;
  const tip=$('tip'); if(hover){
    tip.style.display='block'; tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px';
    tip.textContent = (hover.userData.session.addr)+' · PID '+hover.userData.session.pid; canvas.style.cursor='pointer';
  } else { tip.style.display='none'; canvas.style.cursor='grab'; } });
let downXY=null;
canvas.addEventListener('pointerdown', e=>downXY=[e.clientX,e.clientY]);
canvas.addEventListener('pointerup', e=>{ if(!downXY)return; const moved=Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1]); downXY=null;
  if(moved>8) return; const h=pick(e); if(!h){ $('detail').style.display='none'; selected=null; return; }
  selected=h.object.userData.session; showDetail(selected); });

function showDetail(s){
  $('d-addr').textContent=s.addr; $('d-pid').textContent=s.pid;
  $('d-where').textContent = s.worktree ? s.worktree.split(/[\\/]/).slice(-2).join('/') : 'thư mục hiện tại';
  $('detail').style.display='block';
}
$('d-stop').onclick = async ()=>{ if(!selected)return;
  try{ await fetch('/api/stop',{method:'POST',headers:H,body:JSON.stringify({id:selected.id})});
    $('detail').style.display='none'; }catch(e){ alert(e.message); } };

// ---- dữ liệu ----
async function refresh(){
  try{
    // Lấy lượt chạy flow mới nhất TRƯỚC khi dựng cảnh: build() cần biết bước nào
    // của ai đang chạy mới vẽ được vai trò và luồng trao đổi.
    try{
      const fr = await fetch('/api/flows',{headers:H});
      if(fr.ok){
        const fd = await fr.json();
        const runs = fd.runs||[];
        const run = runs.find(r=>r.state==='running') || runs[0];
        if(run){
          flowName = run.flow;
          const dr = await fetch('/api/run?id='+run.id,{headers:H});
          if(dr.ok){ flowSteps = (await dr.json()).steps || []; }
        } else { flowName=''; flowSteps=[]; }
      }
    }catch(_){ }
    const r=await fetch('/api/state',{headers:H}); if(!r.ok)throw 0; build(await r.json());
  }catch(_){}
}
function connect(){
  const es=new EventSource('/api/events');
  es.onopen=()=>{ $('conn').classList.add('on'); $('conntext').textContent='đã kết nối'; };
  es.onerror=()=>{ $('conn').classList.remove('on'); $('conntext').textContent='mất kết nối'; };
  es.onmessage=ev=>{ let e; try{e=JSON.parse(ev.data)}catch(_){return}
    if(String(e.type).startsWith('flow.') ||
       ['session.started','session.stopped','worktree.removed','clones.cleaned','profile.created','profile.removed'].includes(e.type)) refresh(); };
}

// ---- vòng lặp ----
// Nhãn là HTML overlay, không phải 3D text: 3D text nhoè khi xoay và không dùng
// được đúng --font-mono của token. Mỗi frame chiếu toạ độ world -> screen; z>=1
// nghĩa là điểm nằm sau camera, khi đó phép chiếu lật ngược nên phải ẩn hẳn.
function project(){ labels.forEach(l=>{ const v=l.pos.clone().project(camera);
  const vis=v.z<1; l.el.style.display=vis?'block':'none';
  l.el.style.left=((v.x*.5+.5)*innerWidth)+'px'; l.el.style.top=((-v.y*.5+.5)*innerHeight)+'px'; }); }

// Nhịp của orb: khi bật reduced-motion thì p đứng ở 0 — orb vẫn đủ sáng, đủ
// quầng, chỉ là không thở. Cảnh VẪN vẽ, không rơi về màn đen.
function nhipOrb(){
  orbs.forEach(o=>{
    const p = RM ? 0 : 0.5+0.5*Math.sin(t*o.nhanh + o.ph);
    o.m.scale.setScalar((hover===o.m ? 1.3 : 1) * (1 + p*0.10));
    if(!RM) o.vanh.rotation.z += CHAY(o.tt) ? 0.02 : 0.003;
    o.glow.material.opacity = 0.40 + p*0.45;
    o.glow.scale.setScalar(o.co * (1 + p*0.12));
  });
}
let t=0;
function tick(){ requestAnimationFrame(tick); t+=0.016;
  if(!RM){ core.rotation.y+=0.006; core.rotation.x = 0.12*Math.sin(t*0.4);
    halo.material.opacity = 0.42 + 0.12*Math.sin(t*1.1);

    // BA ĐIỆU KHÁC NHAU, mỗi điệu ứng với một việc thật — không phải nhấp nháy
    // trang trí. Nhìn dáng là đoán được nó đang làm gì mà chưa cần đọc nhãn:
    //   rảnh    : thở chậm, tay buông, thỉnh thoảng nghiêng đầu
    //   làm việc: hai tay gõ so le, người hơi chúi tới, chân nhún, mắt sáng
    //   gửi tin : xoay người về phía người nhận rồi VUNG một tay lên
    for(const addr in agents){
      const A = agents[addr]; const u = A.bot.userData; const ph = A.ph;

      if(A.gui){
        // GỬI: quay mặt về người nhận, vung tay phải theo nhịp
        if(A.huong){
          const m = Math.atan2(A.huong.x-A.pos.x, A.huong.z-A.pos.z);
          A.bot.rotation.y += (m - A.bot.rotation.y) * 0.08;
        }
        const v = Math.sin(t*4.5+ph);
        u.vaiP.rotation.x = -2.1 + v*0.35;   // giơ cao
        u.vaiP.rotation.z = -0.25;
        u.vaiT.rotation.x = 0.15*v;
        u.dau.rotation.x  = -0.12;
        A.bot.position.y  = A.base + Math.abs(v)*0.05;
      } else if(A.dangChay){
        // LÀM VIỆC: gõ hai tay so le
        const g1 = Math.sin(t*7.5+ph), g2 = Math.sin(t*7.5+ph+Math.PI);
        u.vaiT.rotation.x = -1.05 + g1*0.28;
        u.vaiP.rotation.x = -1.05 + g2*0.28;
        u.vaiT.rotation.z =  0.22; u.vaiP.rotation.z = -0.22;
        u.hongT.rotation.x =  g2*0.08; u.hongP.rotation.x = g1*0.08;
        u.dau.rotation.x  = 0.16 + g1*0.05;   // chúi xuống như đang nhìn màn hình
        A.bot.position.y  = A.base + Math.abs(g1)*0.045;
      } else {
        // RẢNH: thở, tay buông, thỉnh thoảng nghiêng đầu
        const b = Math.sin(t*1.05+ph);
        u.vaiT.rotation.x = 0.06*b;  u.vaiP.rotation.x = -0.06*b;
        u.vaiT.rotation.z = 0.08;    u.vaiP.rotation.z = -0.08;
        u.hongT.rotation.x = 0; u.hongP.rotation.x = 0;
        u.dau.rotation.x = 0.03*b;
        u.dau.rotation.z = 0.10*Math.sin(t*0.34+ph); // ngó nghiêng
        A.bot.position.y = A.base + b*0.035;
      }

      // đèn ngực + đèn ăng-ten: nhịp tim nhanh khi bận
      const nhip = 0.5 + 0.5*Math.sin(t*(A.dangChay||A.gui ? 6.5 : 1.4) + ph);
      u.nguc.material.emissiveIntensity = 0.5 + nhip*1.5;
      u.bong.scale.setScalar(0.85 + nhip*0.35);

      if(A.ring){
        A.ring.rotation.z += (A.dangChay||A.gui) ? 0.03 : 0.004;
        A.ring.material.emissiveIntensity = (A.dangChay||A.gui) ? 0.6+0.5*nhip : 0.25;
      }
    }
    // Hạt chạy dọc cạnh needs: A xong → B nhận. Hướng đi chính là hướng dữ liệu.
    duongTruyen.forEach((d,i)=>{
      d.pha = (d.pha + 0.006) % 1;
      d.hat.position.copy(d.cur.getPoint(d.pha));
      d.hat.scale.setScalar(0.8 + 0.4*Math.sin(t*6+i));
    });
    // Hạt chạy dọc beam lõi -> orb: lõi đang cấp việc cho phiên đó.
    tiaCore.forEach(d=>{
      d.pha = (d.pha + d.nhanh) % 1;
      d.hat.position.lerpVectors(d.tu, d.den, d.pha);
    });
  }
  nhipOrb();
  controls.update(); project(); renderer.render(scene,camera); }
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
renderer.setSize(innerWidth,innerHeight);

refresh(); connect(); tick();
</script>
</body>
