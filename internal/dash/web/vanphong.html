<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Switch-Agent-Pro — Văn phòng</title>
<!-- Toàn bộ bảng màu + ba @font-face nằm ở vendor/token.css, dùng chung với bốn
     mặt kia. Trang này KHÔNG được tự khai --run/--pending/--done/--idle/--error
     (designsystem_test.go giữ điều đó) — một mặt tự khai màu là bắt đầu lệch. -->
<link rel="stylesheet" href="vendor/token.css" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--void);color:var(--hi);
    font-family:var(--font-body);overflow:hidden;touch-action:none}
  #scene{position:fixed;inset:0;display:block}
  .panel{position:fixed;background:rgba(12,14,23,.72);border:1px solid var(--line);border-radius:12px;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 10px 20px rgba(0,0,0,.4)}
  #top{top:12px;left:12px;right:12px;min-height:50px;display:flex;align-items:center;gap:12px;
    padding:0 14px;flex-wrap:wrap}
  .b{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;
    font-family:var(--font-display)}
  .b small{color:var(--mid);font-weight:400;font-size:11px}
  #conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mid)}
  #conn .d{width:9px;height:9px;border-radius:50%;background:var(--error)}
  #conn.on .d{background:var(--run)}
  /* Thanh điều hướng là KHUNG: đơn sắc. Tab đang mở nổi bằng độ sáng, không màu. */
  .nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .nav a{text-decoration:none;color:var(--hi);border:1px solid var(--line-2);border-radius:8px;
    padding:7px 12px;font-size:12px;font-weight:600}
  .nav a.on{border-color:var(--hi);background:rgba(255,255,255,.09)}
  .nav a:focus-visible{outline:2px solid var(--core);outline-offset:2px}
  #legend{bottom:12px;left:12px;display:flex;gap:14px;padding:9px 14px;font-size:12px;flex-wrap:wrap;
    max-width:calc(100% - 24px)}
  #legend span{display:flex;align-items:center;gap:6px;color:var(--mid)}
  .dot{width:9px;height:9px;border-radius:50%}

  /* Nhãn và bóng thoại là HTML overlay, KHÔNG phải 3D text: 3D text nhoè khi
     xoay và không dùng được đúng --font-mono của token. Mỗi frame chiếu toạ độ
     world sang screen rồi đặt lại left/top. */
  .lbl{position:fixed;transform:translate(-50%,-50%);font-size:12px;font-weight:600;
    font-family:var(--font-mono);text-shadow:0 0 10px rgba(0,0,0,.95);pointer-events:none;
    white-space:nowrap;z-index:4}
  .lbl small{display:block;color:var(--mid);font-weight:400;font-size:10px;text-align:center}
  .phong-lbl{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:3;
    text-align:center;font-family:var(--font-display);font-size:13px;font-weight:600;
    color:var(--mid);letter-spacing:.04em;text-shadow:0 0 10px rgba(0,0,0,.95)}
  .phong-lbl small{display:block;color:var(--lo);font-weight:400;font-size:10px;
    font-family:var(--font-body);letter-spacing:0}

  /* Bóng thoại: câu THẬT của agent, lấy từ trường output của /api/flow/detail.
     Không có output thì không có bóng — thà trống còn hơn bịa một câu. */
  .thoai{position:fixed;transform:translate(-50%,-100%);pointer-events:none;z-index:5;
    max-width:280px;padding:8px 11px;border-radius:10px 10px 10px 2px;
    background:rgba(17,20,31,.94);border:1px solid var(--line-2);
    font-size:11px;line-height:1.45;color:var(--hi);font-family:var(--font-mono);
    box-shadow:0 8px 18px rgba(0,0,0,.5);transition:opacity .18s var(--ease)}
  .thoai b{display:block;font-size:10px;color:var(--mid);font-weight:600;margin-bottom:3px}

  #thieu{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;z-index:9}
  #thieu div{max-width:420px}
  #thieu a{color:var(--link)}
  #thieuten{font-family:var(--font-mono);color:var(--hi)}
  #thieuly{color:var(--mid);font-size:13px}

  @media (max-width:720px){
    #top{gap:8px;padding:8px 10px}
    .nav{margin-left:0;width:100%}
    .thoai{max-width:200px}
  }
  /* Người dùng bảo giảm chuyển động thì TẮT HẲN, không giảm bớt: JS cũng đọc
     đúng media query này (biến RM) và không cho mixer chạy, không cho nhân vật
     đi lại, không tự xoay camera. */
  @media (prefers-reduced-motion: reduce){
    .thoai{transition:none}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="top" class="panel">
  <div class="b">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l8.5 5v10L12 22 3.5 17V7z"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg>
    Switch-Agent-Pro <small>Văn phòng · dữ liệu thật</small>
  </div>
  <div id="flowname" style="font-size:12px;color:var(--link);font-weight:600;font-family:var(--font-mono)"></div>
  <div id="conn"><span class="d"></span><span id="conntext">đang kết nối…</span></div>
  <div class="nav">
    <a href="./">2D</a>

<div id="legend" class="panel">
  <span><i class="dot" style="background:var(--run)"></i>đang chạy</span>

  <span><i class="dot" style="background:var(--idle)"></i>chưa chạy</span>
  <span id="scount" style="color:var(--hi)">0 nhân vật</span>
</div>

<div id="thieu"><div>
  <h2>Không mở được văn phòng 3D</h2>
  <p>Thiếu file: <span id="thieuten"></span></p>
  <p id="thieuly"></p>
  <p><a href="./">← Về dashboard 2D</a> (không cần mạng, không cần 3D)</p>
</div></div>

<script src="vendor/three.min.js"></script>
<!-- GLTFLoader là LOADER, không phải addon hiệu ứng: một file độc lập, không kéo
     theo gì, và đã nằm sẵn trong binary (web/vendor). Luật cấm vẫn giữ nguyên với
     OrbitControls/EffectComposer/UnrealBloomPass — camera dưới đây tự viết tay. -->
<script src="vendor/GLTFLoader.js"></script>
<script>
// Xác thực bằng cookie phiên HttpOnly — trình duyệt tự gửi kèm.
const H = { 'Content-Type': 'application/json' };
const $ = id => document.getElementById(id);

// Hỏng thì phải nói THIẾU FILE NÀO. Một màn đen im lặng là kiểu hỏng dự án này
// sợ nhất: người dùng đoán là lỗi mạng, trong khi asset nằm ngay trong binary.
function baoThieu(ten, ly){
  $('thieu').style.display = 'grid';
  $('scene').style.display = 'none';
  $('thieuten').textContent = ten;
  $('thieuly').textContent = ly || '';
}
if (typeof THREE === 'undefined') {
  baoThieu('vendor/three.min.js',
    'Nhân ba chiều không nạp được. File nằm trong binary nên đây không phải lỗi mạng.');
  throw new Error('thieu three.min.js');
}
if (typeof THREE.GLTFLoader === 'undefined') {
  baoThieu('vendor/GLTFLoader.js',
    'Không có bộ đọc .glb thì không dựng được nhân vật. File nằm trong binary.');
  throw new Error('thieu GLTFLoader.js');
}

// ---- MÀU: đọc từ vendor/token.css, không chép mã màu vào JS ----
const CSS_ROOT = getComputedStyle(document.documentElement);
// Dự phòng DUY NHẤT của cả file. Nhiều giá trị dự phòng thực chất là chép lại
// bảng màu lần hai. Một giá trị xám: token.css hỏng thì cả cảnh xám đều — thấy
// ngay là hỏng, chứ không lệch màu lắt nhắt rồi tưởng là thật.
const XAM = 0x5A6273;
function mauToken(ten){
  const v = (CSS_ROOT.getPropertyValue(ten) || '').trim();
  const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(v);
  if(!m) return XAM;
  const h = m[1].length === 3 ? m[1].replace(/./g, c => c + c) : m[1];
  return parseInt(h, 16);
}
function chuoiMau(so){ return '#' + so.toString(16).padStart(6, '0'); }

const MAU_TT = {running:mauToken('--run'), done:mauToken('--done'),
                failed:mauToken('--error'), pending:mauToken('--pending'),
                skipped:mauToken('--idle'), waiting:mauToken('--pending'),
                '':mauToken('--idle')};
// Sắc HÃNG = da robot. DANH TÍNH chứ không phải trạng thái, nên nó chỉ nằm trên
// nhân vật; vòng dưới chân mới mang màu trạng thái.
const TINT = {claude:mauToken('--prov-claude'), codex:mauToken('--prov-codex'),
              gemini:mauToken('--prov-gemini'), cursor:mauToken('--prov-cursor'),
              antigravity:mauToken('--prov-antigravity'), grok:mauToken('--prov-grok')};
const MAU_LO   = mauToken('--prov-may');   // hãng lạ: xám, không bịa màu mới
const MAU_NEN  = mauToken('--void');
const MAU_SAN  = mauToken('--panel');
const MAU_SAN2 = mauToken('--panel-2');
const MAU_VACH = mauToken('--lo');
const MAU_CHU  = mauToken('--hi');
const MAU_CORE = mauToken('--core');

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- BỐN PHÒNG + SẢNH CHUNG ----
//
// Phòng chia theo LOẠI VIỆC, không theo tên người: đổi vai_tro trong flows.toml
// là nhân vật đổi phòng, không phải sửa mã. Vai lấy từ trường vaiTro của
// /api/flow/detail — cùng một nguồn mà mặt 2D và mặt sơ đồ 3D đang đọc.
//
// Bước KHÔNG khai vai thì đứng ở SẢNH CHUNG giữa sân. Cố ý để thấy ngay là
// "chưa phân vai" chứ không giấu vào một phòng nào đó cho đẹp đội hình.
const NUA_PHONG = 4.6;   // nửa cạnh một phòng
const R_SANH    = 5.2;   // bán kính sảnh chung
const PHONG = [
  {khoa:'hop',    ten:'Phòng họp',    mo:'ceo · leader',   x:-12, z:-12, vai:['ceo','leader']},
  {khoa:'code',   ten:'Phòng code',   mo:'coder',          x: 12, z:-12, vai:['coder']},
  {khoa:'test',   ten:'Phòng test',   mo:'tester',         x: 12, z: 12, vai:['tester']},
  {khoa:'review', ten:'Phòng review', mo:'soi',            x:-12, z: 12, vai:['soi']}
];
const SANH = {khoa:'sanh', ten:'Sảnh chung', mo:'chưa phân vai', x:0, z:0, vai:[]};

function phongCuaVai(vai){
  for(const p of PHONG){ if(p.vai.indexOf(vai) >= 0) return p; }
  return SANH;
}

// Bước MÁY: không có agent nào đứng sau, nên nó phải khác hình với nhân vật.
// Trộn hai thứ vào một hình là nói dối về ai đã làm việc đó.
const LOAI_MAY = ['test', 'lint', 'shell', 'merge'];
const laMay = typ => LOAI_MAY.indexOf(typ) >= 0;

// ---- three.js: cảnh, đèn, camera ----
const canvas = $('scene');
let renderer;
// WebGLRenderer NÉM khi trình duyệt không dựng được context (máy ảo không GPU,
// driver cũ, WebGL bị tắt). Không bắt thì trang ra màn đen im lặng.
try {
  renderer = new THREE.WebGLRenderer({canvas, antialias:true});
} catch(e) {
  baoThieu('WebGL', 'Trình duyệt này không dựng được WebGL. Ba file vendor vẫn đủ, chỉ máy không vẽ được.');
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(MAU_NEN);
scene.fog = new THREE.FogExp2(MAU_NEN, 0.016);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 20, 30);

// Orbit TỰ VIẾT TAY. OrbitControls là addon hiệu ứng bị cấm — và nó cũng không
// cần thiết: kéo xoay, lăn zoom, clamp polar, damping, tất cả gói trong 30 dòng.
const controls = (function(){
  const GAN = 10, XA = 70, POLAR_MAX = Math.PI*0.47, POLAR_MIN = 0.12;
  const DAMP = .07, TU_XOAY = RM ? 0 : 2*Math.PI/3600*0.3;
  const target = new THREE.Vector3(0, 1.2, 0);
  const off = camera.position.clone().sub(target);
  const nay = {r: off.length(), polar: Math.acos(off.y/off.length()), azi: Math.atan2(off.x, off.z)};
  const muon = {r: nay.r, polar: nay.polar, azi: nay.azi};
  let keo = null;
  canvas.addEventListener('pointerdown', e=>{ keo = {x:e.clientX, y:e.clientY};
    if(canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e=>{ if(!keo) return;
    muon.azi   -= (e.clientX - keo.x)*0.005;
    muon.polar -= (e.clientY - keo.y)*0.005;
    muon.polar = Math.min(POLAR_MAX, Math.max(POLAR_MIN, muon.polar));
    keo = {x:e.clientX, y:e.clientY}; });
  const buong = ()=>{ keo = null; };
  canvas.addEventListener('pointerup', buong);
  canvas.addEventListener('pointercancel', buong);
  canvas.addEventListener('wheel', e=>{ e.preventDefault();
    muon.r = Math.min(XA, Math.max(GAN, muon.r * (e.deltaY > 0 ? 1.1 : 1/1.1))); }, {passive:false});
  return { target, update(){
    if(TU_XOAY && !keo) muon.azi -= TU_XOAY;
    nay.azi   += (muon.azi   - nay.azi)*DAMP;
    nay.polar += (muon.polar - nay.polar)*DAMP;
    nay.r     += (muon.r     - nay.r)*DAMP;
    const sin = Math.sin(nay.polar);
    camera.position.set(target.x + nay.r*sin*Math.sin(nay.azi),
                        target.y + nay.r*Math.cos(nay.polar),
                        target.z + nay.r*sin*Math.cos(nay.azi));
    camera.lookAt(target);
  }};
})();

scene.add(new THREE.AmbientLight(MAU_CHU, 0.75));
const den = new THREE.DirectionalLight(MAU_CHU, 0.85);
den.position.set(9, 18, 12); scene.add(den);
const denPhu = new THREE.DirectionalLight(MAU_CORE, 0.35);
denPhu.position.set(-12, 10, -8); scene.add(denPhu);

// ---- DỰNG PHÒNG: hình khối ĐƠN SẮC ----
//
// Luật màu: màu CHỈ dành cho trạng thái agent. Phòng ốc, vách, sàn, hành lang
// đều lấy từ --panel/--panel-2/--lo — tức là xám của khung, không phải màu.
const matSan   = new THREE.MeshStandardMaterial({color:MAU_SAN,  roughness:.95, metalness:.02});
const matSan2  = new THREE.MeshStandardMaterial({color:MAU_SAN2, roughness:.95, metalness:.02});
const matVach  = new THREE.MeshStandardMaterial({color:MAU_SAN2, roughness:.8,  metalness:.08});
const matVien  = new THREE.LineBasicMaterial({color:MAU_VACH, transparent:true, opacity:.55});
const nhanPhong = [];   // {el, pos}

function dungPhong(p){
  const san = new THREE.Mesh(new THREE.BoxGeometry(NUA_PHONG*2, 0.12, NUA_PHONG*2), matSan2);
  san.position.set(p.x, -0.06, p.z); scene.add(san);

  // Vách THẤP (0.95) chứ không phải tường kín: tường kín thì xoay camera một
  // vòng là che mất nửa văn phòng, và mất luôn thứ cần nhìn.
  const CAO = 0.95, DAY = 0.16;
  const canh = [
    [0, -NUA_PHONG, NUA_PHONG*2, DAY],
    [0,  NUA_PHONG, NUA_PHONG*2, DAY],
    [-NUA_PHONG, 0, DAY, NUA_PHONG*2],
    [ NUA_PHONG, 0, DAY, NUA_PHONG*2]
  ];
  canh.forEach(c=>{
    const m = new THREE.Mesh(new THREE.BoxGeometry(c[2], CAO, c[3]), matVach);
    m.position.set(p.x + c[0], CAO/2, p.z + c[1]);
    scene.add(m);
  });
  // Đường viền mảnh trên mép vách: bắt sáng nên mắt đọc ra ranh giới phòng ngay
  // cả khi camera ở xa và sàn chìm vào sương mù.
  const vien = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(NUA_PHONG*2, 0.02, NUA_PHONG*2)), matVien);
  vien.position.set(p.x, CAO, p.z); scene.add(vien);

  // Hành lang nối phòng với sảnh: nói rằng nhân vật ĐI ĐƯỢC từ đây sang kia.
  const d = Math.hypot(p.x, p.z);
  const hl = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.08, d), matSan);
  hl.position.set(p.x/2, -0.09, p.z/2);
  hl.rotation.y = Math.atan2(p.x, p.z);
  scene.add(hl);

  const el = document.createElement('div');
  el.className = 'phong-lbl';
  const t = document.createElement('span'); t.textContent = p.ten;
  const s = document.createElement('small'); s.textContent = p.mo;
  el.appendChild(t); el.appendChild(s);
  document.body.appendChild(el);
  nhanPhong.push({el, pos:new THREE.Vector3(p.x*1.14, 2.6, p.z*1.14)});
}
PHONG.forEach(dungPhong);

// SẢNH CHUNG: tròn, ở giữa, không vách. Ai chưa phân vai thì đứng đây — nhìn
// phát biết ngay còn bước nào chưa khai vai_tro.
const sanhSan = new THREE.Mesh(new THREE.CircleGeometry(R_SANH, 64), matSan);
sanhSan.rotation.x = -Math.PI/2; sanhSan.position.y = -0.02; scene.add(sanhSan);
const sanhVanh = new THREE.Mesh(new THREE.TorusGeometry(R_SANH, 0.05, 8, 96),
  new THREE.MeshBasicMaterial({color:MAU_VACH, transparent:true, opacity:.5}));
sanhVanh.rotation.x = Math.PI/2; sanhVanh.position.y = 0.02; scene.add(sanhVanh);
(function nhanSanh(){
  const el = document.createElement('div');
  el.className = 'phong-lbl';
  const t = document.createElement('span'); t.textContent = SANH.ten;
  const s = document.createElement('small'); s.textContent = SANH.mo;
  el.appendChild(t); el.appendChild(s);
  document.body.appendChild(el);
  nhanPhong.push({el, pos:new THREE.Vector3(0, 3.2, 0)});
})();

const luoi = new THREE.GridHelper(90, 45, MAU_SAN2, MAU_SAN);
luoi.material.transparent = true; luoi.material.opacity = .22; luoi.position.y = -0.16;
scene.add(luoi);

// ---- NHÂN VẬT ----
//
// RobotExpressive.glb (CC0, three.js) có sẵn 13 clip ĐẶT TÊN THEO TRẠNG THÁI.
// Không tự nặn nhân vật vì không tự nặn được: sáu điệu dưới đây là sáu việc
// thật, và tự vẽ chúng bằng khối hộp thì ra sáu điệu gượng.
//
//   Idle     — rảnh, chưa tới lượt
//   Walking  — đang chuyển sang phòng khác (bước đổi loại việc)
//   Running  — đang chạy bước
//   Wave     — giao việc cho agent khác (có cạnh needs giữa hai bước)
//   ThumbsUp — bước vừa xong
//   No       — bước hỏng
const CLIP = {ranh:'Idle', di:'Walking', chay:'Running',
              giao:'Wave', xong:'ThumbsUp', hong:'No'};

let phoiGLB = null;         // ArrayBuffer của .glb, đọc MỘT lần rồi parse lại
const loader = new THREE.GLTFLoader();
const nhanVat = {};         // khoá -> nhân vật đang đứng trong văn phòng
const nhanKhac = [];        // {el, pos} nhãn tên
const bongThoai = [];       // {el, chu} bóng thoại HTML overlay
let flowSteps = [];
let flowName  = '';
let choDung   = false;      // đã có dữ liệu nhưng .glb chưa về

// Đọc .glb bằng fetch để BIẾT CHẮC file thiếu hay hỏng, rồi parse lại cho từng
// nhân vật. Parse lại chứ không clone: clone một SkinnedMesh cần SkeletonUtils
// — lại thêm một file addon nữa phải tải, đúng thứ ràng buộc nhúng cấm.
fetch('vendor/RobotExpressive.glb')
  .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
  .then(buf => { phoiGLB = buf; if(choDung) capNhat(); })
  .catch(err => baoThieu('vendor/RobotExpressive.glb',
    'Không đọc được mô hình nhân vật (' + err.message + '). File nằm trong binary, không tải từ mạng.'));

// Máy chấm là NHÂN VẬT RIÊNG, khác hình hẳn với agent: một trụ máy có màn hình.
// Bước test/lint/shell/merge do máy chạy, không agent nào đứng sau — vẽ chúng
// thành người là nói dối về ai đã làm việc đó.
function taoMayCham(mau){
  const g = new THREE.Group();
  const vo = new THREE.MeshStandardMaterial({color:MAU_SAN2, roughness:.45, metalness:.5});
  const than = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.7), vo);
  than.position.y = 0.55; g.add(than);
  const chan = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.5, 0.14, 16), vo);
  chan.position.y = 0.07; g.add(chan);
  // Màn hình: chỗ DUY NHẤT của máy mang màu trạng thái.
  const manVL = new THREE.MeshBasicMaterial({color:mau});
  const man = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.42), manVL);
  man.position.set(0, 0.78, 0.36); g.add(man);
  // Vật liệu viền phải là bản RIÊNG, không dùng chung matVien của phòng ốc:
  // máy chấm bị gỡ khỏi cảnh khi bước biến mất, và xoaNhanVat dispose mọi vật
  // liệu nó chạm tới — dùng chung là gỡ một máy chấm thì viền BỐN phòng tắt.
  const khung = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(0.9, 1.1, 0.7)), matVien.clone());
  khung.position.y = 0.55; g.add(khung);
  g.userData = {man: manVL};
  return g;
}

// Chuẩn hoá chiều cao mô hình về 1.8 đơn vị: .glb đổi bản là tỉ lệ đổi theo,
// và một nhân vật cao gấp đôi vách phòng thì cả bố cục vô nghĩa.
function chuanCao(obj, cao){
  const hop = new THREE.Box3().setFromObject(obj);
  const h = hop.max.y - hop.min.y;
  if(h > 0.001) obj.scale.setScalar(cao / h);
}

// Tô DA robot theo hãng — danh tính, đúng một chỗ trên mỗi mặt. Vật liệu phải
// clone: mọi bản parse dùng chung tên vật liệu, sửa thẳng là bốn robot đổi màu.
function toDa(root, tint){
  root.traverse(o=>{
    if(!o.isMesh || !o.material) return;
    o.material = o.material.clone();
    if(o.material.name === 'Main') o.material.color.setHex(tint);
    o.castShadow = false;
  });
}

// ---- dựng / cập nhật dàn nhân vật theo dữ liệu THẬT ----
function buocCua(prof){
  const cua = flowSteps.filter(s => s.profile === prof);
  return cua.find(s => s.state === 'running') ||
         cua.filter(s => s.state && s.state !== 'pending').pop() ||
         cua[0] || null;
}

// Giao việc: bước của tôi XONG, và có bước sau (needs trỏ về tôi) của NGƯỜI
// KHÁC đang chạy hoặc đang chờ. Đây là quan hệ thật trong flow, không phải hiệu
// ứng trang trí — vẫy tay mà không có cạnh needs thì là chuyển động rỗng.
function giaoViecCho(st){
  if(!st || st.state !== 'done') return null;
  for(const b of flowSteps){
    if((b.needs || []).indexOf(st.id) < 0) continue;
    if(!b.profile || b.profile === st.profile) continue;
    if(b.state === 'running' || b.state === 'pending' || b.state === 'waiting') return b;
  }
  return null;
}

function oTrongPhong(p, i, n){
  const buoc = 2.0;
  const lech = (i - (n-1)/2) * buoc;
  if(p.khoa === 'sanh'){
    const goc = n <= 1 ? 0 : (i/n)*Math.PI*2;
    const r = n <= 1 ? 0 : Math.min(R_SANH - 1.2, 1.1 + n*0.25);
    return new THREE.Vector3(Math.cos(goc)*r, 0, Math.sin(goc)*r);
  }
  const gioi = NUA_PHONG - 1.1;
  return new THREE.Vector3(p.x + Math.max(-gioi, Math.min(gioi, lech)), 0, p.z + 0.4);
}

function datClip(A, ten, motLan){
  if(!A.act || A.clip === ten) return;
  const act = A.act[ten];
  if(!act) return;
  const cu = A.actNay;
  act.reset();
  act.setLoop(motLan ? THREE.LoopOnce : THREE.LoopRepeat, motLan ? 1 : Infinity);
  act.clampWhenFinished = !!motLan;
  act.play();
  if(RM){
    if(cu) cu.stop();
    act.setEffectiveWeight(1);
    A.mixer.update(0);
  } else {
    if(cu) cu.fadeOut(0.22);
    act.fadeIn(0.22);
  }
  A.actNay = act; A.clip = ten;
}

function chonClip(A){
  if(!A.act) return;
  // Giảm chuyển động: KHÔNG có điệu một lần nào cả. Điệu một lần cần mixer chạy
  // để kết thúc, mà mixer thì đang đứng — nhân vật sẽ kẹt vĩnh viễn ở tư thế đó.
  if(!RM && A.emote){ datClip(A, A.emote, true); return; }
  if(A.dangDi){ datClip(A, CLIP.di, false); return; }
  datClip(A, A.tt === 'running' ? CLIP.chay : CLIP.ranh, false);
}

// dungNguoi parse .glb thành MỘT bản riêng cho nhân vật này. Parse lại chứ
// không clone vì clone SkinnedMesh cần SkeletonUtils — thêm một file addon nữa.
function dungNguoi(A){
  if(A.dangTai || !phoiGLB) return;
  A.dangTai = true;
  loader.parse(phoiGLB, '', gltf => {
    const root = gltf.scene;
    toDa(root, A.tint);
    chuanCao(root, 1.8);
    A.obj = root; A.cao = 1.8;
    root.position.copy(A.pos);
    scene.add(root);
    A.mixer = new THREE.AnimationMixer(root);
    A.act = {};
    gltf.animations.forEach(c => { A.act[c.name] = A.mixer.clipAction(c); });
    A.mixer.addEventListener('finished', ()=>{ A.emote = null; A.clip = null; A.actNay = null; chonClip(A); });
    chonClip(A);
  }, err => baoThieu('vendor/RobotExpressive.glb',
      'Đọc được file nhưng không dựng được mô hình: ' + (err && err.message ? err.message : err)));
}

function themNhanVat(khoa, prof, may, tint){
  const A = {khoa, prof, may, tint, pos:new THREE.Vector3(), dich:new THREE.Vector3(),
             dangDi:false, tt:'', clip:null, actNay:null, emote:null, giaoKey:''};
  nhanVat[khoa] = A;
  if(may){
    A.obj = taoMayCham(MAU_TT['']);
    chuanCao(A.obj, 1.45);
    A.cao = 1.45;
    scene.add(A.obj);
    return A;
  }
  A.cao = 1.8;
  dungNguoi(A);   // .glb chưa về thì thôi — capNhat sẽ gọi lại khi nó về
  return A;
}

function xoaNhanVat(khoa){
  const A = nhanVat[khoa];
  if(!A) return;
  if(A.obj){
    scene.remove(A.obj);
    A.obj.traverse(o=>{
      if(o.geometry) o.geometry.dispose();
      if(o.material){ Array.isArray(o.material) ? o.material.forEach(m=>m.dispose()) : o.material.dispose(); }
    });
  }
  if(A.vong){ scene.remove(A.vong); A.vong.geometry.dispose(); A.vong.material.dispose(); }
  delete nhanVat[khoa];
}

function xoaNhan(){
  nhanKhac.forEach(l => l.el.remove()); nhanKhac.length = 0;
  bongThoai.forEach(b => b.el.remove()); bongThoai.length = 0;
}

// Dòng ĐẦU của output THẬT, cắt cho vừa bóng thoại. Không có output thì không
// có bóng — thà trống còn hơn bịa một câu cho cảnh sinh động.
function loiThoai(st){
  if(!st || !st.output) return '';
  const dong = String(st.output).split('\n').map(d => d.trim()).filter(Boolean);
  if(!dong.length) return '';
  const d = dong[0];
  return d.length > 110 ? d.slice(0, 110) + '…' : d;
}

function capNhat(){
  if(!phoiGLB){ choDung = true; }
  xoaNhan();

  // MỖI TÀI KHOẢN một nhân vật (agent), MỖI BƯỚC MÁY một máy chấm. Không gộp
  // hai tài khoản Claude khác nhau làm một: gộp là mất chuyện ai giao cho ai.
  const dan = [];
  const daCo = {};
  flowSteps.forEach(st=>{
    if(laMay(st.type)){
      dan.push({khoa:'may:'+st.id, prof:st.id, may:true, st});
      return;
    }
    if(!st.profile) return;
    if(daCo[st.profile]) return;
    daCo[st.profile] = true;
    dan.push({khoa:'ai:'+st.profile, prof:st.profile, may:false, st:buocCua(st.profile)});
  });

  // Bỏ nhân vật không còn trong lượt chạy này.
  Object.keys(nhanVat).forEach(k=>{ if(!dan.some(d => d.khoa === k)) xoaNhanVat(k); });
  $('scount').textContent = dan.length + ' nhân vật';

  // Xếp chỗ: gom theo phòng trước để biết mỗi phòng có bao nhiêu người.
  const theoPhong = {};
  dan.forEach(d=>{
    const vai = d.st ? (d.st.vaiTro || '') : '';
    d.phong = phongCuaVai(vai);
    d.vai = vai;
    (theoPhong[d.phong.khoa] = theoPhong[d.phong.khoa] || []).push(d);
  });

  dan.forEach(d=>{
    const cung = theoPhong[d.phong.khoa];
    const i = cung.indexOf(d);
    const cho = oTrongPhong(d.phong, i, cung.length);
    let A = nhanVat[d.khoa];
    if(!A) A = themNhanVat(d.khoa, d.prof, d.may, TINT[String(d.prof).split(':')[0]] || MAU_LO);
    // .glb về sau lần dựng đầu: nhân vật đã có chỗ đứng, giờ mới có thân.
    if(!A.may && !A.obj) dungNguoi(A);

    const st = d.st;
    const tt = st ? (st.state || '') : '';
    const phongCu = A.phongKhoa;

    // ĐỔI PHÒNG = bước chuyển sang loại việc khác. Đây là lúc DUY NHẤT nhân vật
    // đi lại: đi mà không đổi việc thì chuyển động không nói gì.
    if(phongCu && phongCu !== d.phong.khoa){
      A.dich.copy(cho);
      A.dangDi = !RM;
      if(RM) A.pos.copy(cho);
    } else if(!phongCu){
      A.pos.copy(cho); A.dich.copy(cho); A.dangDi = false;
    } else {
      A.dich.copy(cho);
      if(A.pos.distanceTo(cho) > 0.05 && !RM) A.dangDi = true; else A.pos.copy(cho);
    }
    A.phongKhoa = d.phong.khoa;

    // Điệu MỘT LẦN gắn với một SỰ KIỆN, không phải một trạng thái: xong thì giơ
    // ngón cái một lần rồi thôi. Lặp mãi là chuyển động rỗng — màu vòng dưới
    // chân mới là thứ giữ trạng thái.
    if(tt !== A.tt){
      if(tt === 'done')   A.emote = CLIP.xong;
      if(tt === 'failed') A.emote = CLIP.hong;
      A.tt = tt;
    }
    const nhan = giaoViecCho(st);
    const key = nhan ? (st.id + '>' + nhan.id) : '';
    if(key && key !== A.giaoKey){ A.emote = CLIP.giao; }
    A.giaoKey = key;
    if(nhan){
      const B = dan.find(x => !x.may && x.prof === nhan.profile);
      if(B) A.huongKhoa = B.khoa; else A.huongKhoa = null;
    } else A.huongKhoa = null;

    A.buoc = st;
    if(A.obj) A.obj.position.copy(A.pos);
    chonClip(A);

    // Vòng dưới chân: chỗ mang MÀU TRẠNG THÁI. Cùng bộ token với pill 2D, nên
    // một bước xong là xanh dương ở cả hai mặt, không phải mỗi mặt một màu.
    const mau = MAU_TT[tt] !== undefined ? MAU_TT[tt] : MAU_TT[''];
    if(!A.vong){
      A.vong = new THREE.Mesh(new THREE.TorusGeometry(0.85, 0.055, 8, 40),
        new THREE.MeshBasicMaterial({color:mau, transparent:true, opacity:.85}));
      A.vong.rotation.x = Math.PI/2;
      scene.add(A.vong);
    }
    A.vong.material.color.setHex(mau);
    A.vong.position.set(A.pos.x, 0.05, A.pos.z);
    if(A.may && A.obj) A.obj.userData.man.color.setHex(mau);

    // Nhãn: TÀI KHOẢN (hoặc tên bước máy) · vai · bước và trạng thái.
    const el = document.createElement('div');
    el.className = 'lbl';
    const ten = document.createElement('span');
    ten.textContent = d.may ? ('máy chấm · ' + d.prof) : d.prof;
    const phu = document.createElement('small');
    const vaiChu = d.vai ? d.vai : 'chưa phân vai';
    phu.textContent = st ? (vaiChu + ' · ' + st.id + ' ' + (tt || 'chờ')) : vaiChu;
    if(tt) phu.style.color = chuoiMau(mau);
    el.appendChild(ten); el.appendChild(phu);
    document.body.appendChild(el);
    nhanKhac.push({el, khoa:d.khoa, cao:(A.cao || 1.8) + 0.5});

    const chu = loiThoai(st);
    if(chu){
      const b = document.createElement('div');
      b.className = 'thoai';
      const ai = document.createElement('b');
      ai.textContent = (d.may ? 'máy chấm' : d.prof) + ' · ' + st.id;
      const noi = document.createElement('span');
      noi.textContent = chu;
      b.appendChild(ai); b.appendChild(noi);
      document.body.appendChild(b);
      bongThoai.push({el:b, khoa:d.khoa, cao:(A.cao || 1.8) + 1.15});
    }
  });

  $('flowname').textContent = flowName ? ('flow: ' + flowName) : 'chưa có lượt chạy nào';
}

// ---- dữ liệu: MỘT nguồn cho cả ba mặt — /api/flow/detail ----
async function refresh(){
  try{
    const fr = await fetch('/api/flows', {headers:H});
    if(!fr.ok) return;
    const fd = await fr.json();
    const runs = fd.runs || [];
    const run = runs.find(r => r.state === 'running') || runs[0];
    if(!run){ flowName = ''; flowSteps = []; capNhat(); return; }
    flowName = run.flow;
    const dr = await fetch('/api/flow/detail?id=' + run.id, {headers:H});
    if(dr.ok){
      const d = await dr.json();
      flowSteps = d.steps || [];
    }
    capNhat();
  }catch(e){
    // Nuốt lỗi ở đây là cách văn phòng đứng im mà không ai biết vì sao: cảnh
    // vẫn vẽ, robot vẫn thở, chỉ là dữ liệu dừng lại từ lúc nào không rõ.
    $('conn').classList.remove('on');
    $('conntext').textContent = 'lỗi đọc dữ liệu';
    console.error('vanphong: refresh hỏng', e);
  }
}

function connect(){
  const es = new EventSource('/api/events');
  es.onopen  = ()=>{ $('conn').classList.add('on'); $('conntext').textContent = 'đã kết nối'; };
  es.onerror = ()=>{ $('conn').classList.remove('on'); $('conntext').textContent = 'mất kết nối'; };
  es.onmessage = ev=>{ let e; try{ e = JSON.parse(ev.data); }catch(_){ return; }
    if(String(e.type).startsWith('flow.')) refresh(); };
}

// ---- vòng lặp ----
function chieu(){
  nhanPhong.forEach(l=>{
    const v = l.pos.clone().project(camera);
    l.el.style.display = v.z < 1 ? 'block' : 'none';
    l.el.style.left = ((v.x*.5+.5)*innerWidth) + 'px';
    l.el.style.top  = ((-v.y*.5+.5)*innerHeight) + 'px';
  });
  const dat = (danh)=> danh.forEach(l=>{
    const A = nhanVat[l.khoa];
    if(!A){ l.el.style.display = 'none'; return; }
    const p = new THREE.Vector3(A.pos.x, l.cao, A.pos.z);
    const v = p.project(camera);
    l.el.style.display = v.z < 1 ? 'block' : 'none';
    l.el.style.left = ((v.x*.5+.5)*innerWidth) + 'px';
    l.el.style.top  = ((-v.y*.5+.5)*innerHeight) + 'px';
  });
  dat(nhanKhac); dat(bongThoai);
}

const dongHo = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt = dongHo.getDelta();
  if(!RM){
    for(const k in nhanVat){
      const A = nhanVat[k];
      if(A.mixer) A.mixer.update(dt);
      if(!A.obj) continue;
      if(A.dangDi){
        const con = A.dich.clone().sub(A.pos);
        const xa = con.length();
        if(xa < 0.08){
          A.pos.copy(A.dich); A.dangDi = false; chonClip(A);
        }else{
          const b = Math.min(xa, dt * 2.6);
          A.pos.add(con.normalize().multiplyScalar(b));
          A.obj.rotation.y = Math.atan2(con.x, con.z);
        }
        A.obj.position.copy(A.pos);
        if(A.vong) A.vong.position.set(A.pos.x, 0.05, A.pos.z);
      } else if(A.clip === CLIP.giao && A.huongKhoa && nhanVat[A.huongKhoa]){
        // Vẫy tay thì phải vẫy VỀ PHÍA người nhận, nếu không thì nó chỉ là một
        // cái vẫy vào không khí.
        const B = nhanVat[A.huongKhoa];
        const m = Math.atan2(B.pos.x - A.pos.x, B.pos.z - A.pos.z);
        A.obj.rotation.y += (m - A.obj.rotation.y) * 0.1;
      } else if(A.may && A.obj.userData.man){
        // Máy chấm chỉ nhấp nháy khi ĐANG chạy — nhịp này mã hoá đúng một thông
        // tin, không phải trang trí.
        const o = A.tt === 'running' ? 0.55 + 0.45*Math.abs(Math.sin(dongHo.elapsedTime*4)) : 1;
        A.obj.userData.man.opacity = o;
        A.obj.userData.man.transparent = true;
      }
    }
  }
  controls.update();
  chieu();
  renderer.render(scene, camera);
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setSize(innerWidth, innerHeight);

refresh(); connect(); tick();
setInterval(refresh, 5000);
</script>
