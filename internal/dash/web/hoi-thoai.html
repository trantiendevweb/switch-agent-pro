<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switch-Agent-Pro — Hội thoại</title>
<!-- Màu và font khai MỘT chỗ: vendor/token.css. Trang không được tự khai lại
     --run/--pending/--done/--idle/--error — có test giữ (designsystem_test.go). -->
<link rel="stylesheet" href="vendor/token.css" />
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--hi);
  font:14px/1.55 var(--font-body)}
a{color:inherit}

/* ---------- khung ---------- */
header{display:flex;align-items:center;gap:14px;padding:12px 18px;
  border-bottom:1px solid var(--line-2);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px;font-family:var(--font-display)}
header nav{display:flex;gap:4px;margin-left:auto}
header nav a{padding:6px 11px;border-radius:7px;color:var(--mid);text-decoration:none;font-size:13px}
header nav a:hover{background:var(--panel-2);color:var(--hi)}
header nav a[aria-current]{background:var(--panel-2);color:var(--hi)}

main{display:grid;grid-template-columns:248px 1fr;height:calc(100vh - 53px)}
aside{border-right:1px solid var(--line-2);overflow-y:auto;background:var(--panel)}
#thread{overflow-y:auto;padding:20px 22px 90px}

/* ---------- danh sách lượt chạy ---------- */
.aside-title{padding:12px 14px 8px;font-size:11px;letter-spacing:.9px;
  text-transform:uppercase;color:var(--mid);font-weight:650}
.run{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;
  border-left:2px solid transparent}
.run:hover{background:var(--panel-2)}
.run[aria-selected="true"]{background:var(--panel-2);border-left-color:var(--core)}
.run-id{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--mid);font-size:12px;min-width:30px}
.run-name{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Chấm trạng thái bằng CSS — design system cấm dùng emoji làm icon. */
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--idle)}
.dot.running{background:var(--run)}
.dot.completed,.dot.done{background:var(--done)}
.dot.failed{background:var(--error)}
.dot.cancelled{background:var(--idle)}
.dot.waiting_approval{background:var(--pending)}
.dot.skipped{background:var(--panel-2);border:1px solid var(--line-2)}

/* Nhịp thở cho thứ ĐANG chạy — mắt cần bắt được ngay cái nào còn sống. */
.dot.running{animation:tho 1.6s var(--ease) infinite}
@keyframes tho{0%,100%{opacity:1}50%{opacity:.32}}

/* ---------- đầu luồng ---------- */
#head{margin-bottom:18px}
#head h2{margin:0 0 4px;font-size:19px;font-weight:650;font-family:var(--font-display)}
#meta{color:var(--mid);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
#meta b{color:var(--hi);font-weight:600;font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- một lượt nói ---------- */
.msg{margin:0 0 14px;border:1px solid var(--line-2);border-radius:11px;
  background:var(--panel);overflow:hidden}
.msg.running{border-color:var(--run)}
.msg.failed{border-color:var(--error)}

.msg-top{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--line-2);background:rgba(255,255,255,.02)}
.who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.badge{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--void);flex:none;font-family:var(--font-mono)}
/* id bước, token, chi phí, thời gian — dữ liệu máy, mono hết. */
.step-id{color:var(--mid);font-weight:500;font-size:12px;font-family:var(--font-mono)}
.msg-meta{margin-left:auto;display:flex;gap:12px;align-items:center;
  color:var(--mid);font-size:12px;font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.turn{padding:11px 14px;border-top:1px solid var(--line-2)}
.turn:first-of-type{border-top:0}
.turn-label{font-size:11px;letter-spacing:.7px;text-transform:uppercase;
  color:var(--mid);font-weight:650;margin-bottom:6px;display:flex;gap:8px;align-items:center}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12.5px/1.6 var(--font-mono);
  color:var(--hi)}
.turn.hoi pre{color:var(--mid)}
.fold{max-height:132px;overflow:hidden;position:relative}
.fold::after{content:"";position:absolute;inset:auto 0 0;height:46px;
  background:linear-gradient(transparent,var(--panel))}
button.more{margin-top:7px;background:var(--panel-2);border:1px solid var(--line-2);
  color:var(--mid);padding:3px 10px;border-radius:6px;cursor:pointer;font-size:12px}
button.more:hover{color:var(--hi)}

.err{color:var(--error);font-size:12.5px;padding:9px 14px;background:rgba(255,93,121,.08);
  border-top:1px solid var(--line)}
.tra-loi-ai{color:var(--mid);font-size:12px;padding:7px 14px;border-top:1px solid var(--line-2)}
.tra-loi-ai b{color:var(--hi);font-weight:600;font-family:var(--font-mono)}

/* ---------- bản tóm tắt ----------
   Panel này KHÔNG kể lại lời agent: nó là kết luận, kèm số commit máy tự đếm.
   Chỗ lệch tô bằng --error vì đó đúng là trạng thái lỗi của dữ liệu, không phải
   trang trí — xem internal/api/tomtat.go. */
button.tom-tat{background:var(--panel-2);border:1px solid var(--line-2);color:var(--mid);
  padding:5px 12px;border-radius:7px;cursor:pointer;font-size:12.5px;font-family:inherit}
button.tom-tat:hover,button.tom-tat[aria-expanded="true"]{color:var(--hi);border-color:var(--core)}
#tom-tat{margin:0 0 18px;border:1px solid var(--line-2);border-radius:11px;
  background:var(--panel);overflow:hidden}
.tt-dau{padding:10px 14px;border-bottom:1px solid var(--line-2);font-size:11px;
  letter-spacing:.7px;text-transform:uppercase;color:var(--mid);font-weight:650}
.tt-lech{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
  background:rgba(255,93,121,.08);color:var(--error);font-size:12.5px}
.tt-lech .rail{width:2px;border-radius:2px;background:var(--error);flex:none}
.tt-khop{padding:10px 14px;border-bottom:1px solid var(--line);color:var(--done);font-size:12.5px}
#tom-tat pre{padding:12px 14px}

.empty{color:var(--mid);padding:60px 20px;text-align:center}
#live{position:fixed;right:18px;bottom:16px;display:flex;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--line-2);border-radius:20px;
  padding:7px 14px;font-size:12px;color:var(--mid)}

/* ---------- màn hẹp ----------
   Chủ dự án điều khiển máy này từ điện thoại, nên mobile KHÔNG phải phần phụ.
   Đo trên máy thật (ảnh chụp 23:23, màn ~390px): lưới 248px + 1fr giữ nguyên
   nên cột danh sách nuốt hơn nửa bề ngang, phần hội thoại bị bóp còn một dải
   hẹp, tên bước "ke-hoach" bị cắt thành "ke-hoa…", và thanh điều hướng vỡ ba
   dòng. Nghĩa là thứ người ta mở điện thoại ra để xem lại là thứ khó đọc nhất.

   Cách sửa: bỏ hai cột, danh sách lượt chạy thành DẢI CHIP CUỘN NGANG dính
   trên đầu. Vẫn đổi lượt được bằng một chạm, mà không ăn chiều dọc — thứ quý
   nhất trên màn dọc. */
@media (max-width:720px){
  header{padding:9px 13px;gap:10px}
  header h1{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header nav{gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  header nav::-webkit-scrollbar{display:none}
  header nav a{padding:6px 9px;font-size:12px;white-space:nowrap}

  main{grid-template-columns:1fr;height:auto}
  aside{border-right:0;border-bottom:1px solid var(--line-2);
    position:sticky;top:47px;z-index:4;overflow:visible}
  .aside-title{display:none}
  #runs{display:flex;gap:7px;overflow-x:auto;padding:9px 13px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #runs::-webkit-scrollbar{display:none}
  .run{flex:none;border:1px solid var(--line-2);border-radius:999px;
    padding:6px 12px;border-left-width:1px}
  .run[aria-selected="true"]{border-color:var(--core)}
  .run-id{min-width:0}
  .run-name{max-width:104px}

  #thread{padding:15px 13px 78px}
  #head h2{font-size:17px}
  #meta{gap:5px 13px;font-size:12.5px}

  /* Tên bước xuống dòng thay vì bị cắt cụt — nó là thứ để tra lại trong log. */
  .msg-top{flex-wrap:wrap;gap:7px 9px;padding:10px 12px}
  .who{flex-wrap:wrap;gap:5px 7px;min-width:0}
  .msg-meta{margin-left:0;width:100%;gap:9px;font-size:11.5px}
  .turn{padding:10px 12px}
  pre{font-size:12px;line-height:1.55}
  .fold{max-height:150px}

  /* Chip trạng thái nhỏ lại và nhường chỗ, khỏi đè lên khối cuối. */
  #live{right:11px;bottom:11px;padding:6px 11px;font-size:11.5px}
}

/* Design system: mọi chuyển động phải tôn trọng lựa chọn của người dùng. */
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
  .dot.running{opacity:1}
}

/* Thao tác được bằng bàn phím — sàn chất lượng của skill. */
.run:focus-visible,button.more:focus-visible,button.tom-tat:focus-visible,
header nav a:focus-visible{
  outline:2px solid var(--core);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>Hội thoại giữa các agent</h1>
  <nav>
    <a href="/index.html">Bảng điều khiển</a>
    <a href="/flow.html">Luồng</a>
    <a href="/hoi-thoai.html" aria-current="page">Hội thoại</a>
    <a href="/trung-tam.html">Trung tâm</a>
  </nav>
</header>

<main>
  <aside>
    <div class="aside-title">Lượt chạy</div>
    <div id="runs"></div>
  </aside>
  <section id="thread">
    <div class="empty">Chọn một lượt chạy ở cột trái.</div>
  </section>
</main>

<div id="live"><span class="dot" id="live-dot"></span><span id="live-text">đang nối…</span></div>

<script>
"use strict";

// Sắc theo HÃNG, không theo bước: mắt nhớ màu nhanh hơn nhớ tên. Đây là DANH
// TÍNH chứ không phải trạng thái, nên nó chỉ được xuất hiện ở đúng huy hiệu này.
// Giá trị lấy từ vendor/token.css (--prov-*) — cùng bộ 3D dùng để tô robot, nên
// một tài khoản có MỘT màu dù đang mở tab nào.
const MAU = {claude:"var(--prov-claude)", antigravity:"var(--prov-antigravity)",
             grok:"var(--prov-grok)", codex:"var(--prov-codex)",
             cursor:"var(--prov-cursor)", may:"var(--prov-may)"};

const NHAN = {running:"đang chạy", done:"xong", completed:"xong", failed:"hỏng",
              skipped:"bỏ qua", cancelled:"đã huỷ", waiting_approval:"chờ duyệt", "":"chưa chạy"};

let runHienTai = null;
let dangMo = new Set();   // bước nào người dùng đã bấm "xem đủ"
let tomTat = null;        // bản tóm tắt đã tải của lượt đang mở
let moTomTat = false;     // người dùng có đang mở nó không

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

async function api(p){
  const r = await fetch(p, {headers:{"Accept":"application/json"}});
  if (!r.ok) throw new Error(p + " -> " + r.status);
  return r.json();
}

function hang(profile){
  if (!profile) return "may";
  const i = profile.indexOf(":");
  return i < 0 ? profile : profile.slice(0, i);
}

function tenNguoiNoi(b){
  if (b.profile) return b.profile;
  if (b.type === "notify") return "hệ thống";
  return "máy chấm";
}

// ---------------------------------------------------------------- cột trái
async function napDanhSach(){
  let st;
  try { st = await api("/api/state"); }
  catch (e) { $("#runs").innerHTML = '<div class="empty">không đọc được</div>'; return; }

  const runs = st.runs || [];
  if (!runs.length){ $("#runs").innerHTML = '<div class="empty">chưa có lượt nào</div>'; return; }

  // tabindex + role: đổi lượt chạy phải làm được bằng bàn phím, không chỉ bằng
  // chuột — sàn chất lượng của skill dashboard.
  $("#runs").innerHTML = runs.map(r => `
    <div class="run" role="option" tabindex="0" data-id="${r.id}"
         aria-selected="${r.id === runHienTai}"
         title="lượt #${r.id} · ${esc(r.flow)} · ${esc(NHAN[r.state] || r.state)}">
      <span class="dot ${esc(r.state)}"></span>
      <span class="run-id">#${r.id}</span>
      <span class="run-name">${esc(r.flow)}</span>
    </div>`).join("");

  for (const el of document.querySelectorAll(".run")){
    const mo = () => moLuot(Number(el.dataset.id));
    el.onclick = mo;
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); mo(); } };
  }
  // Lần đầu vào: mở lượt đang chạy, không có thì lượt mới nhất.
  if (runHienTai == null){
    const dangChay = runs.find(r => r.state === "running");
    moLuot((dangChay || runs[0]).id);
  }
}

// ---------------------------------------------------------------- luồng chat
async function moLuot(id){
  runHienTai = id;
  tomTat = null; moTomTat = false;   // tóm tắt là của MỘT lượt, không mang sang lượt khác
  for (const el of document.querySelectorAll(".run")){
    const chon = Number(el.dataset.id) === id;
    el.setAttribute("aria-selected", String(chon));
    // Trên màn hẹp danh sách là dải cuộn ngang: chip vừa chọn có thể nằm ngoài
    // khung nhìn, kéo nó vào để người dùng thấy mình vừa chọn cái nào.
    if (chon && el.scrollIntoView) el.scrollIntoView({block:"nearest", inline:"center"});
  }
  await veLuot();
}

async function veLuot(){
  if (runHienTai == null) return;
  let d;
  try { d = await api("/api/flow/detail?id=" + runHienTai); }
  catch (e) { $("#thread").innerHTML = '<div class="empty">không đọc được lượt này</div>'; return; }

  let tien = 0, tin = 0, tout = 0;
  for (const b of d.steps){ tien += b.costUsd||0; tin += b.tokensIn||0; tout += b.tokensOut||0; }

  const dau = `
    <div id="head">
      <h2>#${d.id} · ${esc(d.flow)}</h2>
      <div id="meta">
        <span><span class="dot ${esc(d.state)}"></span> ${esc(NHAN[d.state] || d.state)}</span>
        <span>bắt đầu <b>${new Date(d.started*1000).toLocaleString("vi-VN")}</b></span>
        <span>token <b>${tin.toLocaleString("vi-VN")}</b> vào / <b>${tout.toLocaleString("vi-VN")}</b> ra</span>
        ${tien > 0 ? `<span>chi phí <b>${tien.toFixed(4)} USD</b></span>` : ""}
        <button class="tom-tat" id="nut-tom-tat" aria-expanded="${moTomTat}" aria-controls="tom-tat"
          >${moTomTat ? "đóng tóm tắt" : "Tóm tắt + đối chiếu git"}</button>
      </div>
    </div>`;

  $("#thread").innerHTML = dau + veTomTat() + d.steps.map(veMot).join("") ;

  const nut = $("#nut-tom-tat");
  if (nut) nut.onclick = bamTomTat;
  for (const el of document.querySelectorAll("button.more")){
    el.onclick = () => {
      const k = el.dataset.k;
      dangMo.has(k) ? dangMo.delete(k) : dangMo.add(k);
      veLuot();
    };
  }
}

// ------------------------------------------------------------- bản tóm tắt
// Cả màn này đang bày NGUYÊN LIỆU: agent nói gì thì hiện y như vậy. Đọc hết một
// lượt bốn bước rồi tự kết luận là việc người dùng phải làm bằng tay — và bốn
// lần trong lịch sử dự án (lượt #21, #29, #31, #34) kết luận rút từ lời agent đã
// sai. Nút này hỏi máy: nó tự đếm commit trên các nhánh sagent/* rồi đối chiếu.
async function bamTomTat(){
  moTomTat = !moTomTat;
  if (moTomTat && !tomTat){
    try { tomTat = await api("/api/flow/tom-tat?id=" + runHienTai); }
    catch (e) { tomTat = {loi: "không đọc được bản tóm tắt: " + e.message}; }
  }
  veLuot();
}

function veTomTat(){
  if (!moTomTat) return "";
  const dau = `<div class="tt-dau">Tóm tắt lượt chạy — máy tự đếm commit, không tin lời agent</div>`;
  if (!tomTat) return `<div id="tom-tat">${dau}<pre>đang đọc…</pre></div>`;
  if (tomTat.loi) return `<div id="tom-tat">${dau}<pre>${esc(tomTat.loi)}</pre></div>`;

  const lech = (tomTat.mauThuan || [])
    .map(m => `<div class="tt-lech"><span class="rail"></span><span>${esc(m.noi)}</span></div>`)
    .join("");
  const soKhai = (tomTat.khai || []).length;
  const khop = (!lech && soKhai > 0)
    ? `<div class="tt-khop">${soKhai} lời khai về nhánh, không lời nào chọi với git</div>` : "";
  return `<div id="tom-tat">${dau}${lech}${khop}<pre>${esc(tomTat.vanBan || "")}</pre></div>`;
}

function veKhoi(nhan, chu, khoa, lop){
  if (!chu) return "";
  const mo = dangMo.has(khoa);
  const dai = chu.length > 420 || chu.split("\n").length > 7;
  return `
    <div class="turn ${lop}">
      <div class="turn-label">${nhan}</div>
      <div class="${dai && !mo ? "fold" : ""}"><pre>${esc(chu)}</pre></div>
      ${dai ? `<button class="more" data-k="${esc(khoa)}">${mo ? "thu gọn" : "xem đủ"}</button>` : ""}
    </div>`;
}

function veMot(b){
  const h = hang(b.profile);
  const mau = MAU[h] || MAU.may;
  const ten = tenNguoiNoi(b);
  const chuCai = (h === "may" ? "M" : h[0]).toUpperCase();

  const meta = [];
  if (b.attempt > 1) meta.push(`lần thử ${b.attempt}`);
  if (b.tokensIn || b.tokensOut) meta.push(`${b.tokensIn}&#8594;${b.tokensOut} tok`);
  if (b.costUsd > 0) meta.push(`${b.costUsd.toFixed(4)} USD`);
  meta.push(NHAN[b.state] || b.state || "chưa chạy");

  const nguon = (b.needs && b.needs.length)
    ? `<div class="tra-loi-ai">nối tiếp <b>${b.needs.map(esc).join("</b>, <b>")}</b></div>` : "";

  return `
    <article class="msg ${esc(b.state)}">
      <div class="msg-top">
        <span class="badge" style="background:${mau}">${esc(chuCai)}</span>
        <span class="who">${esc(ten)} <span class="step-id">${esc(b.id)}</span></span>
        <span class="msg-meta"><span class="dot ${esc(b.state)}"></span>${meta.join(" · ")}</span>
      </div>
      ${nguon}
      ${veKhoi("được giao", b.prompt, b.id + ":hoi", "hoi")}
      ${veKhoi("trả lời", b.output, b.id + ":dap", "dap")}
      ${b.msg && b.state === "failed" ? `<div class="err">${esc(b.msg)}</div>` : ""}
    </article>`;
}

// ---------------------------------------------------------------- realtime
function noiSuKien(){
  const es = new EventSource("/api/events");
  let hen = null;

  es.onopen = () => {
    $("#live-dot").className = "dot running";
    $("#live-text").textContent = "đang theo dõi";
  };
  es.onerror = () => {
    $("#live-dot").className = "dot failed";
    $("#live-text").textContent = "mất kết nối — thử lại…";
  };
  es.onmessage = ev => {
    let e; try { e = JSON.parse(ev.data); } catch { return; }
    const t = e.type || "";
    if (!t.startsWith("flow.") && t !== "failure") return;

    // Gộp nhiều sự kiện dồn dập thành một lần vẽ: lượt chạy song song có thể
    // bắn vài sự kiện trong cùng một khoảnh khắc.
    clearTimeout(hen);
    hen = setTimeout(() => {
      const cuaLuotNay = !e.detail || !e.detail.run || Number(e.detail.run) === runHienTai;
      if (cuaLuotNay) veLuot();
      napDanhSach();
    }, 250);
  };
}

napDanhSach();
noiSuKien();
setInterval(napDanhSach, 15000);   // lưới an toàn nếu lỡ mất sự kiện
</script>
