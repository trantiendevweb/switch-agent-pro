<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Switch-Agent-Pro — Workflow</title>
<style>
  :root{
    --bg:#0F172A;--panel:#141d31;--muted:#272F42;--fg:#F8FAFC;--sub:#94A3B8;--border:#334155;
    --run:#22C55E;--warn:#F59E0B;--limit:#EF4444;--api:#4285F4;--purple:#8B5CF6;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;
    -webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  /* khung */
  #app{display:grid;grid-template-columns:210px 1fr 300px;grid-template-rows:52px 1fr;height:100%}
  #top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;
    background:rgba(15,23,42,.9);border-bottom:1px solid var(--border);z-index:5}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
  .sp{flex:1}
  .btn{cursor:pointer;background:transparent;border:1px solid var(--border);border-radius:8px;
    padding:7px 12px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--fg);
    display:inline-flex;align-items:center;gap:6px;transition:all .15s var(--ease)}
  .btn:hover{border-color:var(--run);background:rgba(34,197,94,.1)}
  .btn.on{border-color:var(--run);background:rgba(34,197,94,.14);color:var(--run)}
  .btn.go{background:var(--run);color:#06240f;border-color:var(--run);font-weight:700}
  .btn.go:hover{opacity:.9}
  .btn.danger{color:#fca5a5;border-color:rgba(239,68,68,.45)}
  .btn.danger:hover{background:rgba(239,68,68,.12)}
  select.pick{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12.5px}
  /* cột trái: bảng node */
  #left{background:var(--panel);border-right:1px solid var(--border);overflow:auto;padding:12px}
  .lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--sub);margin:14px 0 8px}
  .lbl:first-child{margin-top:0}
  .pal{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--border);
    border-radius:9px;background:rgba(255,255,255,.02);cursor:grab;margin-bottom:7px;font-size:13px}
  .pal:hover{border-color:var(--run);background:rgba(34,197,94,.08)}
  .pal .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none}
  .pal small{display:block;color:var(--sub);font-size:11px;font-weight:400}
  /* canvas */
  #mid{position:relative;overflow:hidden;background:
    radial-gradient(circle at 1px 1px, rgba(148,163,184,.16) 1px, transparent 0) 0 0/22px 22px, var(--bg)}
  #world{position:absolute;inset:0;transform-origin:0 0}
  #edges{position:absolute;inset:0;overflow:visible;pointer-events:none}
  #edges path{pointer-events:stroke;cursor:pointer}
  .node{position:absolute;width:230px;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.45);user-select:none}
  .node.sel{border-color:var(--run);box-shadow:0 0 0 2px rgba(34,197,94,.35),0 8px 20px rgba(0,0,0,.5)}
  .node .bar{height:4px;border-radius:12px 12px 0 0}
  .node .hd{display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:grab;font-weight:600;font-size:13px}
  .node .hd .ic{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;flex:none}
  .node .hd .ty{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--sub)}
  .node .bd{padding:0 11px 11px;font-size:12px;color:var(--sub);line-height:1.45;
    max-height:74px;overflow:hidden;word-break:break-word;white-space:pre-wrap}
  .node .st{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;
    display:none;place-items:center;font-size:11px;font-weight:700;border:2px solid var(--bg)}
  .node.s-done .st{display:grid;background:var(--run);color:#06240f}
  .node.s-running .st{display:grid;background:var(--api);color:#fff}
  .node.s-waiting .st{display:grid;background:var(--warn);color:#3a2a00}
  .node.s-failed .st{display:grid;background:var(--limit);color:#fff}
  .port{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--bg);
    border:2px solid var(--sub);top:50%;transform:translateY(-50%);cursor:crosshair;z-index:2}
  .port:hover,.port.hot{border-color:var(--run);background:rgba(34,197,94,.35)}
  .port.in{left:-7px} .port.out{right:-7px}
  /* Vùng chạm rộng hơn phần nhìn thấy — CHỈ trên thiết bị cảm ứng.
     Trên desktop mà nới ra thì bấm giữa-trái node sẽ hoá thành kéo dây. */
  @media (pointer: coarse){
    .port{width:16px;height:16px}
    .port.in{left:-9px} .port.out{right:-9px}
    .port::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      width:38px;height:38px;border-radius:50%}
  }
  .btn:disabled{opacity:.35;cursor:default}
  .btn:disabled:hover{border-color:var(--border);background:transparent}
  /* cột phải */
  #right{background:var(--panel);border-left:1px solid var(--border);overflow:auto;padding:14px}
  .fld{margin-bottom:11px}
  .fld label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px}
  .fld input,.fld textarea,.fld select{width:100%;background:var(--bg);border:1px solid var(--border);
    border-radius:8px;padding:8px 10px;font-size:13px}
  .fld textarea{min-height:92px;resize:vertical;line-height:1.5}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--run)}
  .two{display:flex;gap:9px}.two>*{flex:1}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0}
  .hint{font-size:11.5px;color:var(--sub);line-height:1.5;margin-top:6px}
  .hint code{background:var(--muted);padding:1px 5px;border-radius:4px;font-size:.92em}
  /* nhật ký + thông báo */
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;
    padding:10px 16px;border-radius:10px;font-size:13px;display:none;max-width:80vw}
  #toast.ok{background:rgba(34,197,94,.16);border:1px solid rgba(34,197,94,.5);color:#bbf7d0}
  #toast.err{background:rgba(239,68,68,.16);border:1px solid rgba(239,68,68,.5);color:#fecaca}
  #log{position:absolute;left:12px;bottom:12px;width:340px;max-height:150px;overflow:auto;
    background:rgba(20,29,49,.92);border:1px solid var(--border);border-radius:10px;padding:8px 11px;
    font-family:ui-monospace,Consolas,monospace;font-size:11.5px;backdrop-filter:blur(10px)}
  #log div{padding:2px 0;border-bottom:1px solid rgba(51,65,85,.5)}
  #log .t{color:var(--sub);margin-right:6px}
  #zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
  #zoom .btn{padding:6px 10px;background:rgba(20,29,49,.92)}
  #empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--sub);text-align:center}
  @media(max-width:900px){
    #app{grid-template-columns:1fr;grid-template-rows:52px auto 1fr}
    #left{display:flex;gap:7px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:9px}
    #left .lbl{display:none}
    .pal{margin:0;white-space:nowrap}.pal small{display:none}
    #right{position:fixed;right:0;top:0;bottom:0;width:290px;transform:translateX(100%);
      transition:transform .3s var(--ease);z-index:20;border-left:1px solid var(--border)}
    #right.open{transform:none}
    #log{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="brand">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8"><path d="M12 2l8.5 5v10L12 22 3.5 17V7z"/><circle cx="12" cy="12" r="3" fill="#22C55E" stroke="none"/></svg>
      Workflow
    </div>
    <select class="pick" id="pick"></select>
    <button class="btn" id="new">+ Mới</button>
      <button class="btn" id="undo" title="Hoan tac (Ctrl+Z)" disabled></button>
      <button class="btn" id="redo" title="Lam lai (Ctrl+Shift+Z)" disabled></button>
    <button class="btn" id="tidy" title="Tự xếp theo thứ tự phụ thuộc">Tự xếp</button>
    <button class="btn" id="save">Lưu</button>
      <button class="btn go" id="run"><span id="run-ic"></span> Chay workflow</button>
    <div class="sp"></div>
    <span id="conn" style="font-size:12px;color:var(--sub)">…</span>
    <a class="btn" id="n2d" href="./">2D</a>
    <a class="btn" id="n3d" href="3d.html">3D</a>
    <a class="btn" href="/docs/">Plan</a>
    <a class="btn" href="/logout">Thoát</a>
  </div>

  <div id="left"></div>

  <style>
    #ketqua{position:absolute;right:12px;bottom:12px;width:380px;max-height:46%;overflow:auto;
      background:rgba(20,22,28,.95);border:1px solid #2c3040;border-radius:8px;font-size:12px;z-index:6}
    #ketqua-tieu{padding:6px 10px;border-bottom:1px solid #2c3040;font-weight:600;position:sticky;top:0;
      background:rgba(20,22,28,.98)}
    #ketqua-than{padding:6px 10px}
    #ketqua .b{margin-bottom:8px}
    #ketqua .b b{color:#9fd0ff}
    #ketqua pre{margin:3px 0 0;white-space:pre-wrap;word-break:break-word;color:#cfd4e0;
      background:#12141a;border-radius:5px;padding:5px 7px;max-height:150px;overflow:auto}
    #ketqua .trong{color:#e0a04a}
    #ketqua .mu{color:#8b93a7}
    /* Nhan chi phi: mau tien (xanh --run) de doc luot thay ngay "ton bao nhieu". */
    #ketqua .tien{color:var(--run);font-variant-numeric:tabular-nums}
    #ketqua .b.tong{border-bottom:1px solid #2c3040;padding-bottom:6px;font-weight:600}
    /* Cham trang thai thay cho ky tu la: doi mau duoc, chinh kich thuoc duoc,
       khong phu thuoc phong chu he thong. */
    .m{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle}
    .m.ok{background:var(--run)} .m.run{background:var(--run);animation:tho 1.1s ease-in-out infinite}
    .m.wait{background:var(--warn)} .m.bad{background:#EF4444} .m.skip{background:#64748B}
    @keyframes tho{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){ .m.run{animation:none} }
    .node .vt{padding:2px 10px 0;font-size:10.5px;color:#7fd1a6;letter-spacing:.2px}
    .node .ai{padding:3px 10px 0;display:flex;gap:5px;flex-wrap:wrap}
    .node .ai span{font-size:10px;padding:1px 6px;border-radius:4px;line-height:1.5}
    .node .acc{background:#1d3a5c;color:#9fd0ff;font-weight:600}
    .node .acc.chua{background:#4a2b2b;color:#f0a0a0;font-weight:400}
    .node .quyen{background:#4a3a1a;color:#f0c060}
    .node .wt{background:#26303f;color:#93a0b8}
  </style>
  <div id="mid">
    <div id="world">
      <svg id="edges"></svg>
    </div>
    <div id="empty"><div>Kéo một node từ cột trái vào đây<br><small>hoặc bấm vào node trong bảng</small></div></div>
    <div id="log"></div>
    <!-- Kết quả THẬT của từng bước. Thiếu khung này thì bảng vẽ chỉ khoe đề bài
         (prompt) mà giấu bài làm: lần chạy #8 hiện xanh đủ ba bước trong khi cả
         hai agent chỉ trả về câu từ chối quyền. -->
    <div id="ketqua" hidden><div id="ketqua-tieu">Kết quả từng bước</div><div id="ketqua-than"></div></div>
    <div id="zoom">
      <button class="btn" id="zin">+</button>
      <button class="btn" id="zout">−</button>
      <button class="btn" id="zfit">Vừa khung</button>
    </div>
  </div>

  <div id="right"><div class="hint">Chọn một node để sửa, hoặc bấm nền để sửa thông tin chung của workflow.</div></div>
</div>
<div id="toast"></div>

<script>
// Xác thực bằng cookie phiên HttpOnly — trình duyệt tự gửi kèm. Không còn
// token trên URL, nên link điều hướng cũng không phải mang theo gì.
const H = {'Content-Type':'application/json'};
const $ = s => document.querySelector(s);
$('#n2d').href='./'; $('#n3d').href='3d.html';

// ---- loại node ----
const TYPES = {
  agent:  {name:'Agent',   color:'#22C55E', desc:'Giao việc cho coding agent', icon:'M4 6h16M4 12h10M4 18h7'},
  shell:  {name:'Lệnh',    color:'#4285F4', desc:'Chạy lệnh (argv)',           icon:'M4 17l6-5-6-5M12 19h8'},
  approve:{name:'Duyệt',   color:'#F59E0B', desc:'Dừng chờ người quyết',       icon:'M9 12l2 2 4-4M12 3l9 4v6c0 4-4 7-9 8-5-1-9-4-9-8V7z'},
  notify: {name:'Báo',     color:'#8B5CF6', desc:'Nhắn một dòng',              icon:'M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4'},
  test:   {name:'Test',    color:'#06B6D4', desc:'Chạy commands.test',         icon:'M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3'},
  lint:   {name:'Lint',    color:'#06B6D4', desc:'Chạy commands.lint',         icon:'M4 7h16M4 12h10M4 17h13M18 15l2 2 3-3'},
  review: {name:'Review',  color:'#22C55E', desc:'Agent đọc kết quả trước đó', icon:'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6'},
};
const STATE_MARK = {done:'<i class="m ok"></i>', running:'<i class="m run"></i>', waiting:'<i class="m wait"></i>', failed:'<i class="m bad"></i>', skipped:'<i class="m skip"></i>'};

// ---- trạng thái bảng vẽ ----
let flowName = '', flowDesc = '', flowVars = {}, builtin = false;
let nodes = [];              // {id,type,x,y, prompt,run,message,copies,worktree,timeout_sec,retry,on_failure, needs:[]}
let sel = null, view = {x:60,y:60,k:1}, dirty = false;
let liveStates = {};         // id -> trạng thái khi đang chạy
let currentRun = null;

const world = $('#world'), edges = $('#edges'), mid = $('#mid');

// ---- tiện ích ----
async function call(path, opts){
  const r = await fetch(path, Object.assign({headers:H}, opts||{}));
  const ct = r.headers.get('content-type')||'';
  const b = ct.includes('json') ? await r.json().catch(()=>({})) : {};
  if(!r.ok) throw new Error(b.error || ('HTTP '+r.status));
  return b;
}
function toast(msg, kind){
  const t=$('#toast'); t.className=kind||'ok'; t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', 4200);
}
function esc(s){ return String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function icon(d,color,size){ return '<svg width="'+(size||14)+'" height="'+(size||14)+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"/></svg>'; }
function uid(base){
  let n=1, id=base;
  while(nodes.some(x=>x.id===id)){ n++; id=base+'-'+n; }
  return id;
}

// ---- bảng node bên trái ----
function buildPalette(){
  const box=$('#left'); box.innerHTML='<div class="lbl">Node</div>';
  Object.entries(TYPES).forEach(([t,d])=>{
    const el=document.createElement('div');
    el.className='pal'; el.draggable=true; el.dataset.type=t;
    el.innerHTML='<span class="ic" style="background:'+d.color+'22">'+icon(d.icon,d.color)+'</span>'+
                 '<span>'+d.name+'<small>'+d.desc+'</small></span>';
    el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',t));
    el.onclick=()=>addNode(t, (200-view.x)/view.k, (160-view.y)/view.k);
    box.appendChild(el);
  });
}

// ---- toạ độ ----
function toWorld(clientX, clientY){
  const r = mid.getBoundingClientRect();
  return { x:(clientX-r.left-view.x)/view.k, y:(clientY-r.top-view.y)/view.k };
}
function applyView(){ world.style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.k+')'; }

// ---- hoàn tác / làm lại ----
//
// Lưu ảnh chụp cả bảng (JSON) sau mỗi thay đổi. Đơn giản hơn ghi lại từng thao
// tác, và với vài chục node thì rẻ như không.
let hist = [], hpos = -1;
const HIST_MAX = 60;

function snap(){ return JSON.stringify({nodes, flowName, flowDesc, flowVars}); }
function pushHist(){
  const s = snap();
  if (hist[hpos] === s) return;          // không có gì đổi thì đừng ghi
  hist = hist.slice(0, hpos + 1);
  hist.push(s);
  if (hist.length > HIST_MAX) hist.shift(); else hpos++;
  dirty = true; updateHistBtns();
}
function resetHist(){ hist = [snap()]; hpos = 0; updateHistBtns(); }
function restoreHist(){
  const s = JSON.parse(hist[hpos]);
  nodes = s.nodes; flowName = s.flowName; flowDesc = s.flowDesc; flowVars = s.flowVars;
  if (sel && !nodes.some(n => n.id === sel)) sel = null;
  dirty = true; render(); inspector(); updateHistBtns();
}
function undo(){ if (hpos > 0) { hpos--; restoreHist(); toast('Đã hoàn tác'); } }
function redo(){ if (hpos < hist.length - 1) { hpos++; restoreHist(); toast('Đã làm lại'); } }
function updateHistBtns(){
  $('#undo').disabled = hpos <= 0;
  $('#redo').disabled = hpos >= hist.length - 1;
}

// ---- tự xếp theo tầng phụ thuộc ----
//
// Tầng của một node = tầng sâu nhất trong các node nó phụ thuộc, cộng một. Nhờ
// vậy dây luôn chảy từ trái sang phải và không cắt ngược.
function autoLayout(){
  if (!nodes.length) return;
  const byId = {}; nodes.forEach(n => byId[n.id] = n);
  const level = {}, seen = {};
  const depth = id => {
    if (level[id] !== undefined) return level[id];
    if (seen[id]) return 0;              // phòng vòng lặp, dù đã chặn ở chỗ nối
    seen[id] = true;
    const needs = (byId[id] && byId[id].needs) || [];
    let d = 0;
    needs.forEach(p => { if (byId[p]) d = Math.max(d, depth(p) + 1); });
    level[id] = d;
    return d;
  };
  nodes.forEach(n => depth(n.id));

  const cols = {};
  nodes.forEach(n => { (cols[level[n.id]] = cols[level[n.id]] || []).push(n); });
  const COL = 300, ROW = 175;
  Object.keys(cols).forEach(k => {
    const list = cols[k];
    // giữ thứ tự cũ theo trục dọc để bố cục không nhảy lung tung mỗi lần bấm
    list.sort((a, b) => a.y - b.y);
    list.forEach((n, i) => { n.x = 60 + Number(k) * COL; n.y = 80 + i * ROW; });
  });
  pushHist(); render(); fit();
  toast('Đã xếp lại theo thứ tự phụ thuộc');
}

// ---- thêm / xoá node ----
function addNode(type, x, y){
  const d = {agent:{prompt:'Mô tả việc cần agent làm.'}, shell:{run:'go test ./...'},
             approve:{message:'Duyệt để chạy tiếp?'}, notify:{message:'Đã xong.'},
             review:{prompt:'Đọc kết quả bước trước rồi nhận xét: {{steps.<id>.output}}'},
             test:{}, lint:{}}[type] || {};
  const n = Object.assign({
    id: uid({agent:'agent',shell:'lenh',approve:'duyet',notify:'bao',test:'test',lint:'lint',review:'review'}[type]||'buoc'),
    type, x:Math.round(x), y:Math.round(y), needs:[], copies:1, worktree:true,
    timeout_sec:0, retry:0, on_failure:'stop', prompt:'', run:'', message:'', when:'', profile:'', foreach:'', tuDuyetQuyen:false
  }, d);
  nodes.push(n); pushHist(); render(); select(n.id);
}
// nhân bản node đang chọn (Ctrl+D) — giữ mọi thuộc tính, chỉ đổi id và vị trí
function duplicateNode(id){
  const src = nodes.find(n=>n.id===id); if(!src) return;
  const copy = Object.assign({}, src);
  copy.id = uid(src.id.replace(/-\d+$/,''));
  copy.x = src.x + 40; copy.y = src.y + 40;
  copy.needs = (src.needs||[]).slice();   // giữ nguyên phụ thuộc đầu vào
  nodes.push(copy); pushHist(); render(); select(copy.id);
  toast('Đã nhân bản thành '+copy.id);
}

function removeNode(id){
  nodes = nodes.filter(n=>n.id!==id);
  nodes.forEach(n=> n.needs = (n.needs||[]).filter(x=>x!==id));
  sel=null; pushHist(); render(); inspector();
}

// vaiTro suy ra TỪ ĐỒ THỊ, không bịa thêm khái niệm mới vào file flow:
//   - không phụ thuộc ai, mà có người phụ thuộc mình  -> người giao việc
//   - có người giao cho mình, và không ai chờ mình     -> thợ / người nhận việc
//   - vừa nhận vừa giao                                -> ở giữa
// Nhờ vậy nhìn bảng vẽ là biết ngay ai chỉ huy ai, kể cả với flow người khác gửi.
function vaiTro(n){
  const nhan = (n.needs||[]).length;
  const giao = nodes.filter(x=>(x.needs||[]).includes(n.id)).length;
  const v = '#7fd1a6';
  if(!nhan && giao) return icon(IC.vua, v, 12)+' giao viec cho '+giao+' buoc';
  if(nhan && !giao) return icon(IC.dich, v, 12)+' nhan viec · buoc cuoi nhanh';
  if(nhan && giao)  return icon(IC.quaLai, v, 12)+' nhan viec roi giao tiep cho '+giao+' buoc';
  return '';
}

function render(){
  // node
  world.querySelectorAll('.node').forEach(e=>e.remove());
  nodes.forEach(n=>{
    const d = TYPES[n.type] || {name:n.type,color:'#94A3B8',icon:'M4 6h16'};
    const el=document.createElement('div');
    el.className='node'+(sel===n.id?' sel':'')+(liveStates[n.id]?' s-'+liveStates[n.id]:'');
    el.style.left=n.x+'px'; el.style.top=n.y+'px'; el.dataset.id=n.id;
    const body = (n.type==='shell') ? n.run
      : (n.type==='agent'||n.type==='review') ? n.prompt
      : (n.type==='test'||n.type==='lint') ? (n.run || '(lấy lệnh từ project.toml)')
      : n.message;
    // AI làm bước này, và bước này CHỈ HUY ai. Thiếu hai dòng đó thì nhìn bảng vẽ
    // chỉ thấy hình hộp nối nhau, không biết ai là người giao việc, ai là thợ.
    const nhan = vaiTro(n);
    el.innerHTML =
      '<div class="bar" style="background:'+d.color+'"></div>'+
      '<div class="st">'+(STATE_MARK[liveStates[n.id]]||'')+'</div>'+
      '<div class="hd"><span class="ic" style="background:'+d.color+'22">'+icon(d.icon,d.color,13)+'</span>'+
        esc(n.id)+(n.foreach?'<span class="ty" style="color:var(--warn)">⟳ lặp</span>':'')+
        '<span class="ty">'+d.name+'</span></div>'+
      (nhan ? '<div class="vt">'+nhan+'</div>' : '')+
      (LOAI_AGENT[n.type] ? '<div class="ai">'+(n.profile
          ? '<span class="acc">'+esc(n.profile)+'</span>'
          : '<span class="acc chua">chưa gán tài khoản</span>')+
        (n.tuDuyetQuyen?'<span class="quyen">'+icon(IC.canhBao,'#f0c060',10)+' toan quyen</span>':'')+
        (n.worktree?'<span class="wt">worktree riêng</span>':'')+'</div>' : '')+
      '<div class="bd">'+esc(body||'—')+'</div>'+
      '<div class="port in" data-port="in"></div><div class="port out" data-port="out"></div>';
    world.appendChild(el);
  });
  drawEdges();
  $('#empty').style.display = nodes.length ? 'none' : 'grid';
}

function portPos(id, kind){
  const el = world.querySelector('.node[data-id="'+CSS.escape(id)+'"]');
  if(!el) return null;
  const n = nodes.find(x=>x.id===id);
  const w = el.offsetWidth || 230, h = el.offsetHeight || 90;
  return { x: n.x + (kind==='out'? w : 0), y: n.y + h/2 };
}
function drawEdges(){
  let s='';
  nodes.forEach(n=>(n.needs||[]).forEach(from=>{
    const a=portPos(from,'out'), b=portPos(n.id,'in');
    if(!a||!b) return;
    const dx=Math.max(40,Math.abs(b.x-a.x)*0.5);
    s+='<path d="M '+a.x+' '+a.y+' C '+(a.x+dx)+' '+a.y+', '+(b.x-dx)+' '+b.y+', '+b.x+' '+b.y+'" '+
       'stroke="#475569" stroke-width="2" fill="none" data-from="'+esc(from)+'" data-to="'+esc(n.id)+'"/>';
  }));
  edges.innerHTML = s + (tmpEdge||'');
}
let tmpEdge = '';

// ---- kéo node / nối dây / pan ----
let drag=null, link=null, pan=null;
mid.addEventListener('pointerdown', e=>{
  const port = e.target.closest('.port');
  const node = e.target.closest('.node');
  if(port && node){                       // bắt đầu nối dây
    link = {from:node.dataset.id, kind:port.dataset.port};
    e.preventDefault(); return;
  }
  if(node){
    const hd = e.target.closest('.hd');
    select(node.dataset.id);
    if(hd){ const n=nodes.find(x=>x.id===node.dataset.id);
      const p=toWorld(e.clientX,e.clientY); drag={id:n.id, dx:p.x-n.x, dy:p.y-n.y}; }
    return;
  }
  if(e.target.tagName==='path'){          // bấm dây để xoá
    const from=e.target.dataset.from, to=e.target.dataset.to;
    const n=nodes.find(x=>x.id===to);
    if(n){ n.needs=n.needs.filter(x=>x!==from); pushHist(); render(); toast('Đã bỏ nối '+from+' → '+to); }
    return;
  }
  select(null);
  pan={x:e.clientX-view.x, y:e.clientY-view.y};
});
window.addEventListener('pointermove', e=>{
  if(drag){ const p=toWorld(e.clientX,e.clientY); const n=nodes.find(x=>x.id===drag.id);
    n.x=Math.round(p.x-drag.dx); n.y=Math.round(p.y-drag.dy); dirty=true; render(); return; }
  if(pan){ view.x=e.clientX-pan.x; view.y=e.clientY-pan.y; applyView(); return; }
  if(link){
    const a=portPos(link.from, link.kind), p=toWorld(e.clientX,e.clientY);
    if(a){ const dx=Math.max(40,Math.abs(p.x-a.x)*0.5);
      tmpEdge='<path d="M '+a.x+' '+a.y+' C '+(a.x+dx)+' '+a.y+', '+(p.x-dx)+' '+p.y+', '+p.x+' '+p.y+
              '" stroke="#22C55E" stroke-width="2" stroke-dasharray="5 4" fill="none"/>';
      drawEdges(); }
    document.querySelectorAll('.port').forEach(el=>el.classList.remove('hot'));
    const over=document.elementFromPoint(e.clientX,e.clientY);
    if(over && over.classList.contains('port')) over.classList.add('hot');
  }
});
window.addEventListener('pointerup', e=>{
  if(link){
    const over=document.elementFromPoint(e.clientX,e.clientY);
    const node=over && over.closest('.node');
    if(node && over.classList.contains('port')){
      // hướng phụ thuộc: out -> in nghĩa là "in" cần "out"
      const a = link.kind==='out' ? link.from : node.dataset.id;
      const b = link.kind==='out' ? node.dataset.id : link.from;
      connect(a,b);
    }
    link=null; tmpEdge=''; document.querySelectorAll('.port').forEach(el=>el.classList.remove('hot')); drawEdges();
  }
  if(drag){ pushHist(); }
  drag=null; pan=null;
});
function connect(from,to){
  if(from===to){ toast('Node không thể phụ thuộc chính nó','err'); return; }
  const n=nodes.find(x=>x.id===to); if(!n) return;
  n.needs=n.needs||[];
  if(n.needs.includes(from)) return;
  n.needs.push(from);
  if(hasCycle()){ n.needs=n.needs.filter(x=>x!==from);
    toast('Nối vậy tạo thành vòng lặp — không cho','err'); return; }
  pushHist(); render();
}
// phát hiện chu trình ngay trên bảng vẽ, khỏi đợi server báo
function hasCycle(){
  const color={};
  const need=id=>(nodes.find(n=>n.id===id)||{}).needs||[];
  const go=id=>{
    if(color[id]===1) return true;
    if(color[id]===2) return false;
    color[id]=1;
    for(const d of need(id)) if(go(d)) return true;
    color[id]=2; return false;
  };
  return nodes.some(n=>go(n.id));
}

// zoom
mid.addEventListener('wheel', e=>{
  e.preventDefault();
  const f = e.deltaY<0 ? 1.12 : 1/1.12;
  const r = mid.getBoundingClientRect(), cx=e.clientX-r.left, cy=e.clientY-r.top;
  const k2 = Math.min(2, Math.max(.35, view.k*f));
  view.x = cx - (cx-view.x)*(k2/view.k); view.y = cy - (cy-view.y)*(k2/view.k);
  view.k = k2; applyView();
}, {passive:false});
$('#zin').onclick=()=>{ view.k=Math.min(2,view.k*1.2); applyView(); };
$('#zout').onclick=()=>{ view.k=Math.max(.35,view.k/1.2); applyView(); };
$('#zfit').onclick=fit;
$('#undo').onclick=undo;
$('#redo').onclick=redo;
$('#tidy').onclick=autoLayout;
function fit(){
  if(!nodes.length){ view={x:60,y:60,k:1}; applyView(); return; }
  const xs=nodes.map(n=>n.x), ys=nodes.map(n=>n.y);
  const minX=Math.min(...xs)-40, minY=Math.min(...ys)-40;
  const maxX=Math.max(...xs)+270, maxY=Math.max(...ys)+150;
  const r=mid.getBoundingClientRect();
  view.k=Math.min(1.2, Math.max(.35, Math.min(r.width/(maxX-minX), r.height/(maxY-minY))));
  view.x=-minX*view.k+20; view.y=-minY*view.k+20; applyView();
}

function select(id){ sel=id; render(); inspector(); if(innerWidth<=900 && id) $('#right').classList.add('open'); }

function inspector(){
  const box=$('#right');
  if(!sel){
    box.innerHTML =
      '<div class="lbl">Workflow</div>'+
      '<div class="fld"><label>Tên (dùng khi chạy)</label><input id="i-name" value="'+esc(flowName)+'"></div>'+
      '<div class="fld"><label>Mô tả</label><input id="i-desc" value="'+esc(flowDesc)+'"></div>'+
      '<div class="fld"><label>Biến mặc định (mỗi dòng: ten=giá trị)</label>'+
        '<textarea id="i-vars">'+esc(Object.entries(flowVars).map(([k,v])=>k+'='+v).join('\n'))+'</textarea></div>'+
      '<div class="hint">Dùng trong prompt bằng <code>{{ten}}</code>. Kết quả bước trước: <code>{{steps.&lt;id&gt;.output&gt;}}</code></div>'+
      (builtin?'<div class="hint" style="color:var(--warn)">Đây là flow mẫu dựng sẵn. Lưu lại sẽ tạo bản của bạn đè lên nó.</div>':'')+
      (flowName && !builtin ? '<button class="btn danger" style="margin-top:14px;width:100%" id="i-del">Xoá workflow này</button>':'');
    const nm=$('#i-name'), ds=$('#i-desc'), vs=$('#i-vars');
    if(nm) nm.oninput=e=>{flowName=e.target.value.trim(); dirty=true;};
    if(ds) ds.oninput=e=>{flowDesc=e.target.value; dirty=true;};
    if(vs) vs.oninput=e=>{
      flowVars={}; e.target.value.split('\n').forEach(l=>{
        const i=l.indexOf('='); if(i>0) flowVars[l.slice(0,i).trim()]=l.slice(i+1).trim();
      }); dirty=true;
    };
    const del=$('#i-del');
    if(del) del.onclick=async()=>{
      if(!confirm('Xoá workflow "'+flowName+'" khỏi flows.toml?')) return;
      try{ await call('/api/flow/delete',{method:'POST',body:JSON.stringify({name:flowName})});
        toast('Đã xoá '+flowName); flowName=''; nodes=[]; render(); loadList(); inspector();
      }catch(e){ toast(e.message,'err'); }
    };
    return;
  }

  const n=nodes.find(x=>x.id===sel); if(!n) return;
  const d=TYPES[n.type]||{name:n.type};
  let body='';
  if(n.type==='agent'||n.type==='review'){
    body =
      '<div class="fld"><label>Prompt giao cho agent</label><textarea id="p-prompt">'+esc(n.prompt)+'</textarea></div>'+
      '<div class="two"><div class="fld"><label>Số agent song song</label>'+
        '<input type="number" id="p-copies" min="1" max="16" value="'+(n.copies||1)+'"></div>'+
      '<div class="fld"><label>Timeout (giây, 0 = không)</label>'+
        '<input type="number" id="p-timeout" min="0" value="'+(n.timeout_sec||0)+'"></div></div>'+
      '<label class="chk"><input type="checkbox" id="p-wt" '+(n.worktree?'checked':'')+'> mỗi agent một git worktree</label>'+
      '<div class="fld"><label>Tài khoản (để trống = mặc định khi chạy)</label>'+
        '<input id="p-profile" placeholder="claude:phu" value="'+esc(n.profile||'')+'">'+
        '<div class="hint">Ai làm bước này. Bỏ trống thì dùng --profile lúc chạy.</div></div>'+
        '<div class="fld"><label><input type="checkbox" id="p-quyen"'+(n.tuDuyetQuyen?' checked':'')+'> '+
        'Cho agent tự duyệt mọi quyền</label>'+
        '<div class="hint" style="color:var(--warn)">'+icon(IC.canhBao,'#f0c060',10)+' Agent duoc xoa file va chay lenh tuy y. '+
        'Không bật thì nhiều agent không đọc nổi file nào ở chế độ headless. '+
        'Luôn chạy trong worktree riêng nên không đụng cây làm việc chính.</div></div>'+
      '<div class="hint">Dùng <code>{{steps.&lt;id&gt;.output}}</code> để nhận kết quả bước trước.</div>';
  } else if(n.type==='test'||n.type==='lint'){
    body =
      '<div class="fld"><label>Lệnh (để trống = lấy <code>commands.'+n.type+'</code> của dự án)</label>'+
        '<input id="p-run" value="'+esc(n.run||'')+'"></div>'+
      '<div class="fld"><label>Timeout (giây)</label><input type="number" id="p-timeout" min="0" value="'+(n.timeout_sec||0)+'"></div>';
  } else if(n.type==='shell'){
    body =
      '<div class="fld"><label>Lệnh (cách nhau bằng khoảng trắng)</label><textarea id="p-run">'+esc(n.run)+'</textarea></div>'+
      '<div class="fld"><label>Timeout (giây)</label><input type="number" id="p-timeout" min="0" value="'+(n.timeout_sec||0)+'"></div>'+
      '<div class="hint">Chạy thẳng bằng argv, <b>không qua shell</b> — nên không có <code>|</code>, <code>&gt;</code>, <code>&amp;&amp;</code>.</div>';
  } else {
    body = '<div class="fld"><label>Lời nhắn</label><textarea id="p-message">'+esc(n.message)+'</textarea></div>'+
      (n.type==='approve' ? '<div class="hint">Flow sẽ <b>dừng ở đây</b> tới khi bạn bấm Duyệt. Không có cách nào bỏ qua bước này.</div>' : '');
  }

  box.innerHTML =
    '<div class="lbl">'+d.name+'</div>'+
    '<div class="fld"><label>Tên bước (id)</label><input id="p-id" value="'+esc(n.id)+'"></div>'+
    body +

      '<div class="fld"><label>Lặp qua danh sách (để trống = chạy một lần)</label>'+

    '<div class="hint" style="margin:-2px 0 10px">Ví dụ: <code>steps.a.state == done</code> · '+

      'Không thoả thì bước bị bỏ qua, các bước sau vẫn chạy.</div>'+
    '<div class="two"><div class="fld"><label>Thử lại</label>'+

    '<div class="fld"><label>Khi hỏng</label><select id="p-onfail">'+

  let typeTimer=null;
  const bind=(id,key,conv)=>{ const el=$('#'+id); if(el) el.oninput=e=>{
    n[key]= conv? conv(e.target.value) : e.target.value; dirty=true;
    if(key==='id'||key==='prompt'||key==='run'||key==='message'||key==='foreach') render();
    clearTimeout(typeTimer); typeTimer=setTimeout(pushHist, 700); // gõ xong mới ghi một mục
  };};
  bind('p-prompt','prompt'); bind('p-run','run'); bind('p-message','message');
  bind('p-when','when'); bind('p-profile','profile'); bind('p-foreach','foreach');
  const q=$('#p-quyen');
  if(q) q.onchange=()=>{ const n=nodes.find(x=>x.id===sel); if(!n) return;
    push(); n.tuDuyetQuyen=q.checked; dirty=true; render(); };
  bind('p-copies','copies',v=>Math.max(1,parseInt(v)||1));
  bind('p-timeout','timeout_sec',v=>Math.max(0,parseInt(v)||0));
  bind('p-retry','retry',v=>Math.max(0,parseInt(v)||0));
  const of=$('#p-onfail'); if(of) of.onchange=e=>{n.on_failure=e.target.value; dirty=true;};

    sel=nw; pushHist(); render(); inspector();
  };
  $('#p-del').onclick=()=>removeNode(n.id);
}

// ---- nạp / lưu ----
async function loadList(){
  try{
    const d=await call('/api/flows');
    const sel=$('#pick'); const cur=sel.value;
    sel.innerHTML='';
    (d.flows||[]).forEach(f=>{
      const o=document.createElement('option'); o.value=f.name;
      o.textContent=f.name+' ('+f.steps+' bước)'; sel.appendChild(o);
    });
    if(cur && (d.flows||[]).some(f=>f.name===cur)) sel.value=cur;
    else if(!flowName && d.flows && d.flows.length){ sel.value=d.flows[0].name; loadFlow(d.flows[0].name); }
  }catch(e){ toast(e.message,'err'); }
}
async function loadFlow(name){
  try{
    const d=await call('/api/flow/def?name='+encodeURIComponent(name));
    flowName=d.name; flowDesc=d.desc||''; flowVars=d.vars||{}; builtin=!!d.builtin;
    nodes=(d.steps||[]).map((s,i)=>({
      id:s.id, type:s.type, needs:s.needs||[],
      prompt:s.prompt||'', run:(s.run||[]).join(' '), message:s.message||'',
      copies:s.copies||1, worktree:!!s.worktree, timeout_sec:s.timeout_sec||0,
      retry:s.retry||0, on_failure:s.on_failure||'stop',
      when:s.when||'', profile:s.profile||'', foreach:s.foreach||'',
      tuDuyetQuyen:!!s.tuDuyetQuyen,
      x: s.x || (80 + i*270), y: s.y || (90 + (i%2)*150)
    }));
    sel=null; dirty=false; liveStates={}; resetHist(); render(); inspector(); fit();
  }catch(e){ toast(e.message,'err'); }
}
// Nut chi co icon: dat sau khi ham icon() da co, va co title cho tro doc man hinh.
$('#undo').innerHTML = icon(IC.hoanTac, 'currentColor', 14);
$('#redo').innerHTML = icon(IC.lamLai, 'currentColor', 14);
$('#run-ic').innerHTML = icon(IC.chay, 'currentColor', 12);

$('#pick').onchange=e=>{
  if(dirty && !confirm('Bỏ thay đổi chưa lưu?')) { e.target.value=flowName; return; }
  loadFlow(e.target.value);
};
$('#new').onclick=()=>{
  if(dirty && !confirm('Bỏ thay đổi chưa lưu?')) return;
  flowName=''; flowDesc=''; flowVars={}; builtin=false; nodes=[]; sel=null; liveStates={};
  view={x:60,y:60,k:1}; applyView(); resetHist(); dirty=false; render(); inspector();
  toast('Workflow mới — kéo node vào rồi đặt tên ở cột phải');
};
$('#save').onclick=async()=>{
  if(!flowName){ select(null); toast('Đặt tên cho workflow ở cột phải trước','err'); return; }
  if(!nodes.length){ toast('Chưa có node nào','err'); return; }
  const steps = nodes.map(n=>{
    const s={id:n.id, type:n.type, needs:n.needs||[], x:n.x, y:n.y,
             timeout_sec:n.timeout_sec||0, retry:n.retry||0, on_failure:n.on_failure||'stop'};
    if(n.type==='agent'||n.type==='review'){ s.prompt=n.prompt; s.copies=n.copies||1; s.worktree=!!n.worktree; }
    else if(n.type==='shell'){ s.run=(n.run||'').trim().split(/\s+/).filter(Boolean); }
    else { s.message=n.message; }
    return s;
  });
  try{
    const r=await call('/api/flow/save',{method:'POST',
      body:JSON.stringify({name:flowName, desc:flowDesc, vars:flowVars, step:steps})});
    dirty=false; toast('Đã lưu vào '+r.file); loadList();
  }catch(e){ toast(e.message,'err'); }
};
$('#run').onclick=async()=>{
  if(dirty){ toast('Lưu trước khi chạy','err'); return; }
  if(!flowName){ toast('Chưa chọn workflow','err'); return; }
  try{
    await call('/api/flow/run',{method:'POST',body:JSON.stringify({name:flowName})});
    liveStates={}; render(); toast('Đang chạy — theo dõi ở nhật ký');
  }catch(e){ toast(e.message,'err'); }
};

// ---- theo dõi khi chạy ----
async function pollRun(){
  try{
    const d=await call('/api/flows');
    const mine=(d.runs||[]).filter(r=>r.flow===flowName);
    if(!mine.length) return;
    currentRun=mine[0].id;
    const det=await call('/api/run?id='+currentRun);
    liveStates={}; (det.steps||[]).forEach(s=>{ if(s.state!=='pending') liveStates[s.id]=s.state; });
    veKetQua(det.steps||[], det.cost);
    render();
  }catch(_){}
}
// veKetQua bày output từng bước. Bước `done` mà rỗng thì nói thẳng là rỗng —
// im lặng ở đây chính là cách lần chạy #8 trông như đã thành công.
// chiPhiNhan trả về một nhãn chi phí "0,0042 USD · 1,2k→340 tok" hoặc rỗng nếu
// provider không đo được. Chỉ hiện khi có số thật, để không ai tưởng là miễn phí.
function chiPhiNhan(usd, tin, tout){
  if(!usd && !tin && !tout) return '';
  const s=(usd?usd.toFixed(4)+' USD':'');
  const tk=(tin||tout?(s?' · ':'')+(tin||0)+'→'+(tout||0)+' tok':'');
  return '<span class="mu tien">'+s+tk+'</span>';
}
function veKetQua(steps, cost){
  const box=$('#ketqua'), than=$('#ketqua-than');
  const co=steps.filter(s=>s.state && s.state!=='pending');
  if(!co.length){ box.hidden=true; return; }
  box.hidden=false;
  // Tổng cả lượt lên đầu: chủ dự án hỏi "lượt này tốn bao nhiêu" — trả lời ngay
  // dòng đầu, không bắt cộng nhẩm từng bước.
  let tong='';
  if(cost && (cost.usd||cost.tokens_in||cost.tokens_out)){
    tong='<div class="b tong">Cả lượt: '+chiPhiNhan(cost.usd, cost.tokens_in, cost.tokens_out)+'</div>';
  }
  than.innerHTML=tong+co.map(s=>{
    let t;
    if(s.output) t='<pre>'+esc(s.output)+'</pre>';
    else if(s.state==='done') t='<pre class="trong">(không có output — bước xong nhưng không trả về gì)</pre>';
    else t='';
    return '<div class="b"><b>'+esc(s.id)+'</b> <span class="mu">'+esc(s.state)+'</span> '+
           chiPhiNhan(s.cost_usd, s.tokens_in, s.tokens_out)+
           (s.msg?' <span class="trong">'+esc(s.msg)+'</span>':'')+t+'</div>';
  }).join('');
}
function logLine(e){
  const box=$('#log'); const d=document.createElement('div');
  d.innerHTML='<span class="t">'+new Date().toLocaleTimeString()+'</span>'+esc(e.msg||'');
  box.insertBefore(d, box.firstChild);
  while(box.children.length>60) box.removeChild(box.lastChild);
}
function connect_sse(){
  const es=new EventSource('/api/events');
  es.onopen=()=>{ $('#conn').innerHTML='<i class="m ok"></i> da ket noi'; };
  es.onerror=()=>{ $('#conn').innerHTML='<i class="m bad"></i> mat ket noi'; };
  es.onmessage=ev=>{
    let e; try{ e=JSON.parse(ev.data); }catch(_){ return; }
    logLine(e);
    if(String(e.type).startsWith('flow.')) pollRun();
  };
}

// ---- phím tắt ----
window.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea')) return;
  if((e.key==='Delete'||e.key==='Backspace') && sel){ e.preventDefault(); removeNode(sel); }
  if(e.key==='Escape'){ select(null); $('#right').classList.remove('open'); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='d' && sel){ e.preventDefault(); duplicateNode(sel); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); $('#save').click(); }
});
window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

buildPalette(); applyView(); resetHist(); loadList(); connect_sse();
setInterval(()=>{ if(flowName) pollRun(); }, 5000);
</script>
</body>
</html>
