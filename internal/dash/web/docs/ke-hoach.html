<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switch-Agent-Pro — Kế hoạch 8 mục</title>
<style>
:root{
  --bg:#0F172A;--panel:#141d31;--muted:#272F42;--fg:#F8FAFC;--sub:#94A3B8;--border:#334155;
  --run:#22C55E;--warn:#F59E0B;--limit:#EF4444;--api:#4285F4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.7 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:22px 18px 80px}

header{position:sticky;top:0;background:rgba(15,23,42,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);z-index:5}
.hrow{max-width:820px;margin:0 auto;padding:11px 18px;display:flex;gap:12px;align-items:center}
.hrow b{font-size:14px;font-weight:650}
.hrow a{margin-left:auto;color:var(--sub);text-decoration:none;font-size:13px;
  padding:6px 11px;border:1px solid var(--border);border-radius:7px}
.hrow a:hover{color:var(--fg)}

h1{font-size:26px;line-height:1.3;margin:6px 0 16px;font-weight:700}
h2{font-size:20px;margin:34px 0 10px;padding-top:16px;border-top:1px solid var(--border);font-weight:650}
h3{font-size:16.5px;margin:22px 0 6px;font-weight:650;color:#E2E8F0}
p{margin:11px 0}
ul,ol{margin:11px 0;padding-left:22px}
li{margin:5px 0}
hr{border:0;border-top:1px solid var(--border);margin:26px 0}
a{color:#93C5FD}

code{background:var(--muted);padding:1.5px 6px;border-radius:5px;
  font:13.5px/1.5 ui-monospace,"Cascadia Code",Consolas,monospace;color:#E9D5FF;
  word-break:break-word}
blockquote{margin:14px 0;padding:11px 15px;border-left:3px solid var(--api);
  background:var(--panel);border-radius:0 8px 8px 0;color:#CBD5E1}
blockquote p{margin:5px 0}

/* Bảng: trên điện thoại cho cuộn ngang thay vì bóp chữ nát ra. */
.tw{overflow-x:auto;margin:14px 0;border:1px solid var(--border);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--panel);font-weight:650;white-space:nowrap;color:#CBD5E1}
tr:last-child td{border-bottom:0}

strong{color:#fff;font-weight:650}
.load{color:var(--sub);padding:40px 0;text-align:center}

@media (max-width:520px){
  body{font-size:15px}
  h1{font-size:22px}
  h2{font-size:18px}
}
/* Design system: chuyển động phải tôn trọng lựa chọn của người dùng. */
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<header><div class="hrow">
  <b>Kế hoạch 8 mục</b>
  <a href="/docs/KE-HOACH-8-MUC.md">bản thô</a>
</div></header>

<div class="wrap"><div id="noi-dung" class="load">đang tải…</div></div>

<script>
"use strict";

// Bộ dựng markdown tối giản, CỐ Ý không kéo thư viện ngoài: trang này để đọc kế
// hoạch từ điện thoại, có khi mạng yếu, và một file tĩnh không phụ thuộc gì thì
// không bao giờ hỏng vì CDN chết.
//
// Chỉ xử lý đúng những thứ tài liệu này dùng: tiêu đề, bảng, danh sách, trích
// dẫn, đậm, mã, đường kẻ, liên kết. Gặp thứ lạ thì in nguyên văn — thà thô còn
// hơn nuốt mất chữ.

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, (_,m) => "<code>"+m+"</code>")
    .replace(/\*\*([^*]+)\*\*/g, (_,m) => "<strong>"+m+"</strong>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_,t,h) => '<a href="'+h+'">'+t+"</a>");
}

function hangBang(d){
  return d.replace(/^\||\|$/g, "").split("|").map(x => x.trim());
}

function dung(md){
  const dong = md.split(/\r?\n/);
  const ra = [];
  let i = 0;

  while (i < dong.length){
    const d = dong[i];

    // bảng: dòng có | và dòng kế là dải gạch ngang
    if (d.trim().startsWith("|") && /^\s*\|[\s:|-]+\|\s*$/.test(dong[i+1] || "")){
      const dau = hangBang(d);
      i += 2;
      const than = [];
      while (i < dong.length && dong[i].trim().startsWith("|")){
        than.push(hangBang(dong[i])); i++;
      }
      ra.push('<div class="tw"><table><thead><tr>' +
        dau.map(c => "<th>"+inline(c)+"</th>").join("") +
        "</tr></thead><tbody>" +
        than.map(h => "<tr>"+h.map(c => "<td>"+inline(c)+"</td>").join("")+"</tr>").join("") +
        "</tbody></table></div>");
      continue;
    }

    // trích dẫn
    if (d.startsWith("> ")){
      const kh = [];
      while (i < dong.length && dong[i].startsWith(">")){
        kh.push(dong[i].replace(/^>\s?/, "")); i++;
      }
      ra.push("<blockquote>" + kh.filter(Boolean).map(x => "<p>"+inline(x)+"</p>").join("") + "</blockquote>");
      continue;
    }

    // danh sách
    const dsCham = /^\s*[-*]\s+/, dsSo = /^\s*\d+\.\s+/;
    if (dsCham.test(d) || dsSo.test(d)){
      const co = dsSo.test(d);
      const muc = [];
      while (i < dong.length && (dsCham.test(dong[i]) || dsSo.test(dong[i]))){
        muc.push(dong[i].replace(co ? dsSo : dsCham, "")); i++;
      }
      const t = co ? "ol" : "ul";
      ra.push("<"+t+">" + muc.map(m => "<li>"+inline(m)+"</li>").join("") + "</"+t+">");
      continue;
    }

    if (/^---+\s*$/.test(d)){ ra.push("<hr>"); i++; continue; }

    const h = d.match(/^(#{1,4})\s+(.*)$/);
    if (h){ const n = Math.min(h[1].length, 3); ra.push("<h"+n+">"+inline(h[2])+"</h"+n+">"); i++; continue; }

    if (!d.trim()){ i++; continue; }

    // đoạn văn: gom tới dòng trống
    const doan = [];
    while (i < dong.length && dong[i].trim() &&
           !/^(#{1,4}\s|>|---+\s*$)/.test(dong[i]) &&
           !dong[i].trim().startsWith("|") &&
           !/^\s*([-*]|\d+\.)\s+/.test(dong[i])){
      doan.push(dong[i]); i++;
    }
    if (doan.length) ra.push("<p>"+inline(doan.join(" "))+"</p>");
  }
  return ra.join("\n");
}

fetch("/docs/KE-HOACH-8-MUC.md")
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
  .then(md => { document.getElementById("noi-dung").className = "";
                document.getElementById("noi-dung").innerHTML = dung(md); })
  .catch(e => { document.getElementById("noi-dung").textContent =
                "Không tải được kế hoạch: " + e.message + " — thử /docs/KE-HOACH-8-MUC.md"; });
</script>
</body>
</html>
