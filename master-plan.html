<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Switch-Agent-Pro — Master Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0F172A; --primary:#1E293B; --muted:#272F42; --fg:#F8FAFC; --sub:#94A3B8;
    --border:#475569; --run:#22C55E; --warn:#F59E0B; --limit:#EF4444;
    --panel:rgba(30,41,59,.55); --ease:cubic-bezier(0.16,1,0.3,1);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:
      radial-gradient(1100px 520px at 50% -8%,rgba(34,197,94,.10),transparent 60%),
      radial-gradient(800px 460px at 100% 6%,rgba(66,133,244,.07),transparent 55%),
      var(--bg);
    color:var(--fg);font-family:Inter,system-ui,sans-serif;line-height:1.65;
    -webkit-font-smoothing:antialiased;word-wrap:break-word}
  .nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:12px 16px;backdrop-filter:blur(18px);background:rgba(15,23,42,.8);
    border-bottom:1px solid rgba(71,85,105,.45)}
  .nav .b{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
  .nav .sp{margin-left:auto;display:flex;gap:8px}
  .nav a{text-decoration:none;color:var(--fg);border:1px solid var(--border);border-radius:8px;
    padding:7px 11px;font-size:12px;font-weight:600;transition:all .2s var(--ease);white-space:nowrap}
  .nav a:hover{border-color:var(--run);background:rgba(34,197,94,.1)}
  .nav a.p{border-color:var(--run);background:rgba(34,197,94,.14);color:var(--run)}
  main{max-width:860px;margin:0 auto;padding:22px 18px calc(80px + var(--safe-b))}
  #md h1{font-size:clamp(26px,6vw,40px);line-height:1.14;font-weight:800;letter-spacing:-.02em;
    margin:6px 0 14px;background:linear-gradient(120deg,#22C55E,#4285F4);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  #md h2{font-size:clamp(19px,4vw,26px);font-weight:700;margin:38px 0 10px;padding-top:14px;
    border-top:1px solid rgba(71,85,105,.4);letter-spacing:-.01em}
  #md h3{font-size:clamp(16px,3vw,19px);font-weight:600;margin:24px 0 8px;color:var(--run)}
  #md h4{font-size:15px;font-weight:600;margin:18px 0 6px;color:var(--sub)}
  #md p{margin:10px 0;color:#dbe3ee}
  #md a{color:#7dd3fc}
  #md ul,#md ol{padding-left:22px;margin:10px 0}
  #md li{margin:5px 0;color:#dbe3ee}
  #md li::marker{color:var(--run)}
  #md strong{color:var(--fg);font-weight:600}
  #md em{color:var(--sub)}
  #md code{background:var(--muted);padding:2px 6px;border-radius:5px;font-size:.87em;
    color:#e2e8f0;font-family:ui-monospace,Consolas,monospace}
  #md pre{background:rgba(15,23,42,.75);border:1px solid var(--border);border-radius:12px;
    padding:14px;overflow-x:auto;margin:14px 0}
  #md pre code{background:none;padding:0;font-size:12.5px;line-height:1.6}
  #md blockquote{margin:14px 0;padding:12px 16px;border-left:3px solid var(--run);
    background:rgba(34,197,94,.07);border-radius:0 10px 10px 0;color:#cbd5e1}
  #md blockquote strong{color:var(--run)}
  #md table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;display:block;overflow-x:auto}
  #md th,#md td{text-align:left;padding:9px 11px;border-bottom:1px solid rgba(71,85,105,.4);vertical-align:top}
  #md th{color:var(--sub);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.07em;white-space:nowrap}
  #md hr{border:0;border-top:1px solid rgba(71,85,105,.35);margin:26px 0}
  /* checkbox list */
  #md li input[type=checkbox]{accent-color:var(--run);margin-right:7px;transform:translateY(1px)}
  #md li:has(input:checked){color:var(--sub)}
  .load{color:var(--sub);padding:40px 0;text-align:center}
  .top{position:fixed;right:16px;bottom:calc(16px + var(--safe-b));z-index:15;
    background:var(--panel);border:1px solid var(--border);color:var(--fg);border-radius:999px;
    width:44px;height:44px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(14px);
    opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
  .top.show{opacity:1;pointer-events:auto}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.top{transition:none}}
</style>
</head>
<body>
<nav class="nav">
  <div class="b">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8"><path d="M12 2l8.5 5v10L12 22 3.5 17V7z"/><circle cx="12" cy="12" r="3" fill="#22C55E" stroke="none"/></svg>
    Switch-Agent-Pro
  </div>
  <div class="sp">
    <a class="p" href="MASTER-PLAN.md">.md</a>
    <a href="plan.html">Plan</a>
    <a href="index.html">3D</a>
  </div>
</nav>
<main><div id="md"><div class="load">Đang tải master plan…</div></div></main>
<button class="top" id="top" aria-label="Lên đầu trang">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
const el = document.getElementById('md');
fetch('MASTER-PLAN.md?' + Date.now())
  .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  .then(t => {
    marked.setOptions({ gfm:true, breaks:false });
    el.innerHTML = marked.parse(t);
    // biến "- [ ] / - [x]" thành checkbox thật (marked gfm đã làm, đảm bảo disabled)
    el.querySelectorAll('input[type=checkbox]').forEach(c => c.disabled = true);
  })
  .catch(e => { el.innerHTML = '<p style="color:var(--limit)">Không tải được MASTER-PLAN.md — ' + e.message + '</p>'; });

const top = document.getElementById('top');
addEventListener('scroll', () => top.classList.toggle('show', scrollY > 600), {passive:true});
top.onclick = () => scrollTo({top:0, behavior:'smooth'});
</script>
</body>
</html>
