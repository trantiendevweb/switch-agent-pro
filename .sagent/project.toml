version = 1
name = "switch-agent-pro"

[project]
default_branch = "main"
workspace      = "worktree"   # "dir" = dùng chung thư mục | "worktree" = mỗi phiên một cây

[commands]
# lint = ["npm run lint"]
# test = ["npm test"]

[policy]
max_parallel_sessions = 4
require_approval_for  = ["merge", "deploy"]

# ---- Trần đồng thời theo từng chiều ----
# BỐN trần CỘNG DỒN, không thay thế nhau: `max_parallel_sessions` ở trên vẫn là
# trần ngoài cùng, ba trần dưới siết thêm bên trong nó. Một lượt `sagent fleet`
# phải qua được cả bốn.
#
# Vì sao cần: trần chung chỉ đếm TỔNG. Bốn phiên rơi hết vào MỘT tài khoản
# claude vẫn qua nó, và chúng đốt sạch hạn mức của đúng tài khoản đó trong khi
# các tài khoản khác ngồi không. Hạn mức thuê bao tính theo TÀI KHOẢN; còn RAM
# và tiến trình con tính theo HARNESS. Một con số không đo được cả hai.
#
# Cả khối này CÓ THỂ BỎ TRỐNG — mặc định đã là 3/3/2 và chạy được ngay.
# Số 0 ở bất kỳ khoá nào nghĩa là TẮT chiều đó (giống `max_parallel_sessions`).
# ĐỌC KỸ TRƯỚC KHI SỬA `max_parallel_sessions` ở trên: với bộ mặc định dưới đây,
# con số 4 là một lời hứa mà trần provider (3) KHÔNG cho giữ. Bốn bước `agent`
# cùng nhà cung cấp `claude` không bao giờ chạy quá 3 cùng lúc, dù bạn có bao
# nhiêu tài khoản. Trước 22/08 chuyện đó vô hình vì cửa flow chưa áp trần; nay
# nó là hành vi thấy được mỗi ngày. Muốn đúng 4 thì nâng `provider_mac_dinh`.
[policy.tran]
harness_mac_dinh  = 3   # tài nguyên máy: bao nhiêu tiến trình CLI cùng lúc
provider_mac_dinh = 3   # trần của nhà cung cấp, tính trên TỔNG các tài khoản
ho_so_mac_dinh    = 2   # hạn mức thuê bao: bao nhiêu phiên trên MỘT tài khoản

  # Đè theo tên. Không khai tên nào thì tên đó dùng số mặc định ở trên.
  # [policy.tran.harness]
  # claude = 3
  #
  # [policy.tran.provider]
  # claude = 3
  #
  # Khoá phải là địa chỉ ĐẦY ĐỦ "provider:tài_khoản" — gõ thiếu thành "tns" thì
  # trần im lặng không khớp phiên nào, nên cấu hình bắt lỗi đó lúc đọc file.
  # [policy.tran.ho_so]
  # "claude:tns" = 1
  #
  # Gộp nhiều provider vào MỘT harness, khi chúng dùng chung runtime trên máy.
  # Không khai thì harness của một provider chính là tên provider đó (đo 22/08:
  # năm provider trên máy này ra năm binary khác nhau).
  # [policy.tran.thuoc_harness]
  # codex = "node"
  # grok  = "node"

[ui]
default_surface = "tui"       # tui | dashboard | workflow | 3d
theme           = "dark"

# LƯU Ý: file này KHÔNG được chứa API key hay token. Chỉ tham chiếu bằng ID.

# ---- Đường AI API ----
# Chỉ tham chiếu key bằng ID (tên file trong ~/.ai-accounts/api-keys/), KHÔNG
# bao giờ để key thật ở đây — file này nằm trong repo.
[ai]
default_route = "deepseek"
# Danh sách dự phòng PHẢI khai riêng — khai thêm một [[ai.route]] thôi thì chưa
# đủ để nó được dùng làm dự phòng. Bộ gọi chỉ chuyển tiếp ĐÚNG MỘT LẦN nên chỉ
# mục đầu của danh sách này có tác dụng.
fallback_routes = ["grok"]

  [[ai.route]]
  ten      = "deepseek"
  # ĐO ĐƯỢC 20/08: key này KHÔNG dùng được ở api.deepseek.com (401
  # "Authentication Fails"), nhưng dùng được ở modelapi.vn — cùng nhà bán lại
  # với grok. Model hợp lệ chỉ có hai: deepseek-v4-flash và deepseek-v4-pro,
  # KHÔNG có deepseek-chat. Liệt kê bằng GET /v1/models, không đoán.
  base_url = "https://modelapi.vn/v1"
  model    = "deepseek-v4-flash"
  key_id   = "deepseek"

  # Route dự phòng. Bộ chuyển route chỉ nhảy sang đây khi route chính hỏng vì
  # PHÍA NÓ (5xx, timeout, mất mạng) — sai key hay prompt rỗng thì không nhảy,
  # vì nhảy chỉ lặp lại đúng cái sai đó ở nhà cung cấp thứ hai.
  [[ai.route]]
  ten      = "grok"
  base_url = "https://modelapi.vn/v1"
  model    = "grok-4.5"
  key_id   = "grok"
