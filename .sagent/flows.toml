# File này do `sagent` và trình soạn thảo workflow cùng dùng.
# Sửa tay thoải mái — bảng vẽ đọc lại được, chỉ mất vị trí x/y nếu bạn xoá.

version = 1

[flow]
  [flow.agents]
    desc = "Bật một đội agent headless chạy song song, mỗi agent một worktree"
    [flow.agents.vars]
      copies = "4"
      task = "Rà một phần của repo và báo cáo vấn đề tìm được."

    [[flow.agents.step]]
      id = "chay"
      type = "agent"
      prompt = "{{task}}"
      copies = 4
      worktree = true
      timeout_sec = 3600
      retry = 0
      on_failure = "stop"
      x = 80
      y = 90

    [[flow.agents.step]]
      id = "bao"
      type = "notify"
      needs = ["chay"]
      copies = 0
      message = "Đội agent đã chạy xong — xem log từng phiên trong dashboard."
      timeout_sec = 0
      retry = 0
      on_failure = "stop"
      x = 350
      y = 240

# ---------------------------------------------------------------------------
# Một Claude ĐIỀU KHIỂN hai agent: một Claude khác + một Antigravity.
#
# Hình dạng: lập kế hoạch -> hai thợ chạy SONG SONG -> tổng hợp.
# Hai thợ chạy song song vì cả hai cùng `needs = ["ke-hoach"]` và không phụ
# thuộc nhau — runner tự xếp cùng một đợt.
#
# Mỗi bước khai `profile` riêng, nên "điều khiển" ở đây là thật: bộ não và hai
# tay chân là BA TÀI KHOẢN KHÁC NHAU, log riêng, hạn mức riêng.
  [flow.doi-hinh]
    desc = "Một Claude lập kế hoạch, hai agent làm song song (Claude + Antigravity), rồi tổng hợp"
    [flow.doi-hinh.vars]
      viec = "Rà soát repo này và chỉ ra những chỗ đáng sửa nhất"

    [[flow.doi-hinh.step]]
      id = "ke-hoach"
      type = "agent"
      profile = "claude:phu"
      prompt = """Bạn là người điều phối. Việc cần làm: {{viec}}
Hãy chia thành ĐÚNG HAI phần độc lập, không chồng nhau.
Trả lời đúng 2 dòng, mỗi dòng một phần, không giải thích thêm."""
      timeout_sec = 900
      on_failure = "stop"

    [[flow.doi-hinh.step]]
      id = "tho-claude"
      type = "agent"
      needs = ["ke-hoach"]
      profile = "claude:tns"
      prompt = """Làm PHẦN THỨ NHẤT trong kế hoạch dưới đây. Chỉ làm phần 1.

{{steps.ke-hoach.output}}"""
      timeout_sec = 1800
      on_failure = "continue"

    [[flow.doi-hinh.step]]
      id = "tho-anti"
      type = "agent"
      needs = ["ke-hoach"]
      profile = "antigravity:may"
      prompt = """Làm PHẦN THỨ HAI trong kế hoạch dưới đây. Chỉ làm phần 2.

{{steps.ke-hoach.output}}"""
      timeout_sec = 1800
      on_failure = "continue"

    [[flow.doi-hinh.step]]
      id = "tong-hop"
      type = "agent"
      needs = ["tho-claude", "tho-anti"]
      profile = "claude:phu"
      prompt = """Gộp hai kết quả dưới thành một báo cáo ngắn, bỏ trùng lặp.

--- phần 1 ---
{{steps.tho-claude.output}}

--- phần 2 ---
{{steps.tho-anti.output}}"""
      timeout_sec = 900

# ---------------------------------------------------------------------------
# Bản CHẠY ĐƯỢC NGAY HÔM NAY, không cần tài khoản Claude còn hạn mức.
# Cùng hình dạng: điều phối -> hai thợ song song -> tổng hợp.
  [flow.doi-hinh-khong-claude]
    desc = "Cùng hình dạng nhưng dùng Antigravity + Codex — chạy được khi Claude hết hạn mức"
    [flow.doi-hinh-khong-claude.vars]
      viec = "Nói tên ngôn ngữ lập trình chính của repo này"

    [[flow.doi-hinh-khong-claude.step]]
      id = "ke-hoach"
      type = "agent"
      profile = "antigravity:may"
      # Bật quyền cho bước NÀY: agent phải ĐỌC được repo mới trả lời nổi.
      # Mặc định tắt — xem docs/DO-LUONG.md mục "headless không có quyền".
      tu_duyet_quyen = true
      prompt = "Chỉ ĐỌC, tuyệt đối không sửa/xoá gì. {{viec}} Trả lời đúng một dòng."
      timeout_sec = 600

    [[flow.doi-hinh-khong-claude.step]]
      id = "tho-anti"
      type = "agent"
      needs = ["ke-hoach"]
      profile = "antigravity:may"
      prompt = "Nhắc lại đúng một từ đầu tiên của dòng này: {{steps.ke-hoach.output}}"
      timeout_sec = 600
      on_failure = "continue"

    [[flow.doi-hinh-khong-claude.step]]
      id = "bao"
      type = "notify"
      needs = ["tho-anti"]
      message = "Đội hình đã chạy xong — xem log từng phiên trong dashboard."

# ---------------------------------------------------------------------------
# ĐỘI 4 AGENT ĐỂ CODE THẬT.
#
#   ke-hoach  claude:phu       đọc repo + dự án tham khảo, chia việc làm 2 phần
#   tho-1     claude:tns   ┐   hai thợ làm SONG SONG, mỗi người một worktree
#   tho-2     antigravity:may ┘
#   soi       grok:api         soi diff của cả hai bằng mắt của hãng KHÁC
#   gop       claude:phu       gộp lại, nói rõ nhánh nào đáng trộn
#
# VÌ SAO THỢ PHẢI COMMIT: mỗi phiên chạy trong git worktree riêng, nhánh
# `sagent/<tài khoản>-1`. Thay đổi CHƯA commit nằm im trong worktree đó — người
# soi ở worktree khác không thấy gì cả. Commit lên nhánh thì `git diff` từ đâu
# cũng đọc được, vì nhánh dùng chung cả repo.
#
# VÌ SAO BẬT tu_duyet_quyen: đo ngày 18/08 — headless không hỏi được quyền nên
# tự từ chối, agent không đọc nổi một file nào. Antigravity không có nấc trung
# gian (7 biến thể allow-list đều bị chặn). Bù lại, mọi bước đều chạy trong
# worktree riêng nên không đụng cây làm việc chính của bạn.
#
# GROK KHÔNG CÓ RÀO QUYỀN NÀO — không khai cờ thì nó vẫn toàn quyền. Đó là lý do
# nó được giao việc CHỈ ĐỌC (soi diff), không giao việc sửa file.
  [flow.code]
    desc = "Đội 4 agent code thật: 1 lập kế hoạch, 2 làm song song, 1 soi, rồi gộp"
    [flow.code.vars]
      viec = "Mô tả việc cần làm ở đây"
      tham_khao = "https://github.com/farion1231/cc-switch"

    [[flow.code.step]]
      id = "ke-hoach"
      type = "agent"
      profile = "claude:phu"
      worktree = true
      tu_duyet_quyen = true
      timeout_sec = 1800
      on_failure = "stop"
      prompt = """Bạn là người điều phối. KHÔNG viết code ở bước này.

VIỆC CẦN LÀM: {{viec}}

DỰ ÁN THAM KHẢO: {{tham_khao}}
Nếu có link, hãy xem nó (clone nông vào thư mục tạm) và rút ra thứ ĐÁNG HỌC cho
việc trên. Bỏ qua nếu không truy cập được — đừng bịa.

Đọc repo hiện tại trước. Rồi chia VIỆC CẦN LÀM thành ĐÚNG HAI phần:
- độc lập nhau, không sửa cùng một file;
- mỗi phần tự nó hoàn chỉnh, làm xong là chạy được;
- ghi rõ phần nào đụng file nào.

Trả lời đúng khuôn:
PHẦN 1: <mô tả> | file: <danh sách>
PHẦN 2: <mô tả> | file: <danh sách>
GHI CHÚ: <thứ học được từ dự án tham khảo, hoặc "không có">"""

    [[flow.code.step]]
      id = "tho-1"
      type = "agent"
      profile = "claude:tns"
      needs = ["ke-hoach"]
      worktree = true
      tu_duyet_quyen = true
      timeout_sec = 3600
      on_failure = "continue"
      prompt = """Làm PHẦN 1 trong kế hoạch dưới đây. CHỈ phần 1, đừng đụng phần 2.

{{steps.ke-hoach.output}}

Yêu cầu bắt buộc:
1. Viết test cho thứ bạn sửa. Test phải ĐỎ khi gỡ phần sửa ra — không chứng minh
   được điều đó thì đừng bảo là đã xong.
2. Chạy `go build ./...` và `go test ./...`, phải xanh.
3. XONG THÌ COMMIT lên nhánh hiện tại:
   git add -A && git commit -m "<mô tả ngắn>"
   Không commit thì người soi ở worktree khác KHÔNG thấy việc bạn làm.
4. Trả lời: tên nhánh, các file đã sửa, và những gì CHƯA làm được (nói thẳng)."""

    [[flow.code.step]]
      id = "tho-2"
      type = "agent"
      profile = "antigravity:may"
      needs = ["ke-hoach"]
      worktree = true
      tu_duyet_quyen = true
      timeout_sec = 3600
      on_failure = "continue"
      prompt = """Làm PHẦN 2 trong kế hoạch dưới đây. CHỈ phần 2, đừng đụng phần 1.

{{steps.ke-hoach.output}}

Yêu cầu bắt buộc:
1. Viết test cho thứ bạn sửa. Test phải ĐỎ khi gỡ phần sửa ra.
2. Chạy `go build ./...` và `go test ./...`, phải xanh.
3. XONG THÌ COMMIT lên nhánh hiện tại:
   git add -A && git commit -m "<mô tả ngắn>"
   Không commit thì người soi KHÔNG thấy việc bạn làm.
4. Trả lời: tên nhánh, các file đã sửa, và những gì CHƯA làm được (nói thẳng)."""

    [[flow.code.step]]
      id = "soi"
      type = "agent"
      profile = "grok:api"
      needs = ["tho-1", "tho-2"]
      worktree = true
      timeout_sec = 1800
      on_failure = "continue"
      prompt = """Bạn là người soi độc lập, KHÁC HÃNG với hai người vừa làm. Việc
của bạn là TÌM LỖI, không phải khen. CHỈ ĐỌC — tuyệt đối không sửa, không commit.

MÁY NÀY LÀ WINDOWS, shell là cmd.exe. KHÔNG có `ls`, `cat`, `pwd`, `grep`.
Dùng `dir`, `type`, `cd`, `findstr` — hoặc tốt nhất là chỉ dùng `git`, vì git
chạy y hệt nhau trên mọi hệ. Một lệnh trượt hai lần thì ĐỔI CÁCH, đừng gọi lại.

Đọc thay đổi của cả hai bằng git:
    git log --oneline main..sagent/tns-1
    git diff main...sagent/tns-1
    git log --oneline main..sagent/may-1
    git diff main...sagent/may-1

Nếu một nhánh không có commit nào thì NÓI THẲNG là người đó chưa làm gì — đừng
đoán từ lời họ kể.

Với mỗi thay đổi, trả lời:
- Có test không, và test đó có thật sự đỏ khi gỡ phần sửa ra không?
- Chỗ nào sai, chỗ nào thiếu, chỗ nào chỉ trông có vẻ đúng?
- Hai phần có giẫm chân nhau không?

Kết bằng: NÊN TRỘN / CẦN SỬA THÊM / VỨT — kèm lý do."""

    [[flow.code.step]]
      id = "gop"
      type = "agent"
      profile = "claude:phu"
      needs = ["soi"]
      worktree = true
      tu_duyet_quyen = true
      timeout_sec = 1800
      prompt = """Gộp thành một báo cáo ngắn cho người chủ dự án.

--- phần 1 (claude:tns, nhánh sagent/tns-1) ---
{{steps.tho-1.output}}

--- phần 2 (antigravity:may, nhánh sagent/may-1) ---
{{steps.tho-2.output}}

--- người soi (grok) ---
{{steps.soi.output}}

Báo cáo phải trả lời đúng ba câu, không lan man:
1. Nhánh nào TRỘN ĐƯỢC ngay, lệnh git cụ thể là gì?
2. Nhánh nào CẦN SỬA THÊM, sửa gì?
3. Việc gì CHƯA ai làm?"""

# ---------------------------------------------------------------------------
# Bản THỬ CƠ CHẾ của flow `code`, không dùng Claude.
#
# Có mặt để kiểm đúng một thứ khó nhất và dễ hỏng nhất trong flow `code`:
# thợ commit lên nhánh riêng → người soi ở worktree KHÁC có đọc được không.
# Không dùng Claude vì chạy Claude headless có thể tranh device slot với phiên
# remote đang mở (đã đo sự cố rớt phiên 15:04:16).
  [flow.code-thu]
    desc = "Thử cơ chế của flow code (thợ commit lên nhánh, người soi đọc bằng git diff) — không dùng Claude"

    [[flow.code-thu.step]]
      id = "tho"
      type = "agent"
      profile = "antigravity:may"
      worktree = true
      tu_duyet_quyen = true
      timeout_sec = 1200
      on_failure = "stop"
      prompt = """Tạo file `THU-CO-CHE.md` ở gốc thư mục làm việc, nội dung đúng một dòng:
`day la file do agent tao de thu co che`

Rồi COMMIT lên nhánh hiện tại:
    git add -A && git commit -m "thu co che: them THU-CO-CHE.md"

Trả lời đúng hai dòng:
NHANH: <tên nhánh hiện tại, lấy bằng git branch --show-current>
COMMIT: <mã commit ngắn, lấy bằng git rev-parse --short HEAD>"""

    [[flow.code-thu.step]]
      id = "soi"
      type = "agent"
      profile = "grok:api"
      needs = ["tho"]
      worktree = true
      timeout_sec = 1200
      prompt = """CHỈ ĐỌC, không sửa gì. Chạy đúng hai lệnh này:

    git log --oneline main..sagent/may-1
    git diff main...sagent/may-1

Rồi trả lời đúng hai dòng:
THAY DOI: <có / không có commit nào>
NOI DUNG: <nội dung file THU-CO-CHE.md nếu thấy, hoặc "khong thay">"""

# ---------------------------------------------------------------------------
# ĐỘI ĐI HỌC: mỗi agent đọc MỘT dự án mã nguồn mở rồi mang bài học về.
#
# Nguồn danh sách: docs/DU-AN-THAM-KHAO.md, xếp theo LỖ HỔNG ĐÃ ĐO của sagent
# chứ không theo số sao. Ba dự án đứng đầu, mỗi con một dự án, chạy song song.
#
# Luật giấy phép (docs/KE-HOACH-GOC.md mục 2): học và tái triển khai NGUYÊN LÝ
# thì thoải mái; chép mã trực tiếp thì phải ghi nguồn/license/commit vào
# docs/OPEN_SOURCE_LEDGER.md. Cả ba dự án dưới đều MIT hoặc Apache-2.0.
  [flow.hoc]
    desc = "Ba agent đọc ba dự án mã nguồn mở song song, rồi tổng hợp bài học áp dụng được"

    [[flow.hoc.step]]
      id = "hoc-acp"
      type = "agent"
      profile = "claude:tns"
      worktree = true
      tu_duyet_quyen = true
      timeout_sec = 3000
      on_failure = "continue"
      prompt = """Nghiên cứu Agent Client Protocol và SDK Go của nó:
  https://github.com/agentclientprotocol/agent-client-protocol  (Apache-2.0)
  https://github.com/coder/acp-go-sdk  (Apache-2.0)

Clone nông vào thư mục tạm mà đọc. CHỈ ĐỌC hai repo đó, đừng sửa gì trong repo này.

VÌ SAO CẦN: sagent hiện chỉ biết một bước đang `running` hay `done`. Output agent
là một khối chữ, nên phải đoán bằng cách dò chuỗi ký tự để biết agent có làm việc
thật không — xem `khongCoKetQua` trong internal/api/api.go. Đó là chữa cháy.
Ngày 18/08 đã có ba kiểu hỏng lọt lưới: bị chặn quyền, hết hạn đăng nhập, quẩn
vòng gọi tool 399 lần — cả ba đều báo `done`.

TRẢ LỜI ĐÚNG BỐN MỤC, ngắn gọn, có trích dẫn file:dòng của repo upstream:
1. ACP định nghĩa những loại sự kiện nào trong một phiên agent? Liệt kê tên thật.
2. Sự kiện nào cho biết agent ĐANG làm gì (đọc file, chạy lệnh, xin quyền)?
3. Nếu sagent nói ACP, ba kiểu hỏng trên có bị bắt không? Từng cái một, có/không và vì sao.
4. Việc nhỏ nhất để bắt đầu là gì? Nêu đúng một bước đầu tiên, đo được."""

    [[flow.hoc.step]]
      id = "hoc-deck"
      type = "agent"
      profile = "antigravity:may"
      worktree = true
      tu_duyet_quyen = true
      timeout_sec = 3000
      on_failure = "continue"
      prompt = """Nghiên cứu https://github.com/asheshgoplani/agent-deck (MIT, viết bằng Go).

Clone nông vào thư mục tạm mà đọc. CHỈ ĐỌC, đừng sửa gì trong repo này.

VÌ SAO CẦN: đây là dự án gần sagent nhất — cũng Go, cũng quản nhiều phiên agent,
cũng dùng git worktree. sagent đã có fleet và worktree nhưng CHƯA có: fork/resume
một phiên, gom phiên theo project, và bảng điều khiển web đọc được trạng thái thật.

TRẢ LỜI ĐÚNG BỐN MỤC, có trích dẫn file:dòng:
1. Nó lưu trạng thái phiên ở đâu và bằng cấu trúc gì?
2. Fork và resume một phiên hoạt động thế nào?
3. Nó biết một agent đang bận hay rảnh bằng cách nào?
4. Ba thứ đáng mang về sagent nhất, xếp theo dễ làm trước."""

    [[flow.hoc.step]]
      id = "hoc-gastown"
      type = "agent"
      profile = "claude:phu"
      worktree = true
      tu_duyet_quyen = true
      timeout_sec = 3000
      on_failure = "continue"
      prompt = """Nghiên cứu https://github.com/gastownhall/gastown (MIT).

Clone nông vào thư mục tạm mà đọc. CHỈ ĐỌC, đừng sửa gì trong repo này.

VÌ SAO CẦN: chủ dự án nhìn giao diện sagent và hỏi "ai là leader, ai là nhân viên,
nhiệm vụ ra sao". Gas Town có sẵn khái niệm agent identity, handoff, merge queue.
sagent hiện cho mỗi thợ commit lên nhánh sagent/<tài khoản>-1 nhưng KHÔNG có hàng
đợi trộn, và vai trò chỉ suy từ cạnh needs của đồ thị.

TRẢ LỜI ĐÚNG BỐN MỤC, có trích dẫn file:dòng:
1. Nó mô tả vai trò một agent bằng cấu trúc gì? Vai trò là dữ liệu hay chỉ là quy ước?
2. Handoff giữa hai agent diễn ra thế nào — cái gì được truyền?
3. Merge queue quyết định nhánh nào được trộn dựa trên gì?
4. Ba thứ đáng mang về sagent nhất, và một thứ RÕ RÀNG KHÔNG nên mang (kèm lý do)."""

    [[flow.hoc.step]]
      id = "tong-hop"
      type = "agent"
      profile = "claude:phu"
      needs = ["hoc-acp", "hoc-deck", "hoc-gastown"]
      worktree = true
      tu_duyet_quyen = true
      timeout_sec = 2400
      prompt = """Gộp ba bản nghiên cứu dưới thành một mục bổ sung cho
docs/DU-AN-THAM-KHAO.md, phần "Đã học được gì".

--- ACP (claude:tns) ---
{{steps.hoc-acp.output}}

--- Agent Deck (antigravity:may) ---
{{steps.hoc-deck.output}}

--- Gas Town (claude:phu) ---
{{steps.hoc-gastown.output}}

Yêu cầu:
1. Bước nào KHÔNG trả về nghiên cứu thật (rỗng, báo lỗi, hoặc chỉ nói lý thuyết
   không có trích dẫn file:dòng) thì GHI THẲNG là chưa học được, đừng bịa cho đủ.
2. Mỗi bài học phải kèm: nguyên lý, trích dẫn upstream, và nó vá lỗ hổng ĐO ĐƯỢC
   nào của sagent.
3. Kết bằng bảng: việc nên làm tiếp, xếp theo (giá trị / công sức).
4. Chưa chép dòng mã nào thì nói rõ là chưa cần ghi OPEN_SOURCE_LEDGER.md.

Trả về nguyên văn phần markdown để dán vào tài liệu, không lời dẫn."""

# Phép thử nhỏ cho đường NDJSON có cấu trúc của Claude. Giữ lại vì mỗi lần đổi
# HeadlessArgs hoặc cách đọc kết quả đều cần một lượt chạy thật để nghiệm thu.
  [flow.thu-claude]
    desc = "Một bước Claude, để nghiệm thu đường đọc kết quả có cấu trúc"

    [[flow.thu-claude.step]]
      id = "hoi"
      type = "agent"
      profile = "claude:tns"
      timeout_sec = 600
      prompt = "Ngon ngu lap trinh chinh cua repo nay la gi? Tra loi dung mot tu."

# ---------------------------------------------------------------------------
# ĐÊM: một lượt vừa code vừa debug, ba provider phân vai THEO SỐ ĐO.
#
# Phân vai không theo cảm giác "AI nào mạnh" mà theo bằng chứng trong
# docs/DO-LUONG.md và internal/provider/:
#
#   claude:tns      DocKetQua ✓ (claude.go:64) — đọc được kết quả CÓ CẤU TRÚC,
#                   biết chi phí/token thật. Rào quyền tường minh
#                   (--dangerously-skip-permissions). → VIỆC GO NẶNG.
#   antigravity:may DocKetQua ✓ (antigravity.go:137). Nhưng lịch sử: lần #8 trả
#                   câu từ chối quyền mà vẫn `done`, bước hoc-agentdeck TIMEOUT
#                   0 chữ 0 commit. → VIỆC BOUNDED, hỏng thì rẻ: tài liệu.
#   grok:api        DocKetQua trả FALSE (grok.go:219) — hỏng chỉ bắt được bằng
#                   dò chuỗi. KHÔNG có rào quyền nào (grok.go:190), chỉ hạ được
#                   trần vòng tool xuống 60. Lần #21 gọi `ls -la` 399 lần vì
#                   bash của nó đi qua cmd.exe mà nó không thích nghi.
#                   → CHỈ ĐỌC/SOI. Không giao việc ghi.
#
# MÁY CHẤM QUYẾT ĐỊNH, không phải lời agent. Bước shell chạy `go test -C <đường
# dẫn worktree>` vì exec.CommandContext ở step.go:316 KHÔNG đặt cmd.Dir — không
# có -C thì nó chấm repo chính chứ không chấm cây mà thợ vừa sửa, và cả cổng
# kiểm thành vô nghĩa.
  [flow.dem]
    desc = "Một lượt đêm: Claude code Go + Antigravity viết tài liệu song song, máy chấm phán, hai vòng debug, Grok soi"
    [flow.dem.vars]
      viec_go = "mô tả việc Go, truyền bằng --var"
      viec_doc = "mô tả việc tài liệu, truyền bằng --var"
      # Dùng dấu / chứ không phải \: TOML đọc \U là escape unicode và file không
      # parse nổi. Go nhận dấu / trên Windows bình thường.
      wt_tns = "C:/Users/Administrator/.ai-accounts/.worktrees/switch-agent-pro-b2d22420/tns-1"

    [[flow.dem.step]]
      id = "code-go"
      type = "agent"
      profile = "claude:tns"
      worktree = true
      tu_duyet_quyen = true
      timeout_sec = 2400
      on_failure = "continue"
      prompt = """Bạn làm việc trong một git worktree riêng, nhánh sagent/tns-1.
MÁY NÀY LÀ WINDOWS, shell là cmd.exe: KHÔNG có ls/cat/grep. Dùng dir/type/findstr,
hoặc tốt nhất là chỉ dùng `git` và `go` vì chúng chạy giống nhau mọi nền.

VIỆC: {{viec_go}}

Luật bắt buộc, không có ngoại lệ:
1. Đọc code hiện có TRƯỚC khi viết. Bám khuôn sẵn có, đừng phát minh phong cách mới.
2. Viết test cho thứ bạn sửa. Test phải ĐỎ khi gỡ phần sửa ra — không chứng minh
   được điều đó thì đừng bảo là xong.
3. Chạy `go build ./...` và `go test ./...`, phải XANH.
4. XONG THÌ COMMIT: git add -A && git commit -m "<mô tả ngắn tiếng Việt>"
   KHÔNG commit thì người soi ở worktree khác không thấy gì, và coi như bạn chưa làm.
5. Trả lời đúng khuôn:
   NHANH: <git branch --show-current>
   COMMIT: <git rev-parse --short HEAD>
   DA LAM: <gạch đầu dòng>
   CHUA LAM: <nói THẲNG chỗ chưa xong, đừng giấu>"""

    [[flow.dem.step]]
      id = "code-doc"
      type = "agent"
      profile = "antigravity:may"
      worktree = true
      tu_duyet_quyen = true
      timeout_sec = 1800
      on_failure = "continue"
      prompt = """Bạn làm việc trong một git worktree riêng, nhánh sagent/may-1.
MÁY NÀY LÀ WINDOWS, shell là cmd.exe: KHÔNG có ls/cat/grep. Dùng `git` là an toàn nhất.

VIỆC: {{viec_doc}}

CHỈ sửa file .md. TUYỆT ĐỐI không đụng file .go — có người khác đang sửa code
song song với bạn, đụng vào là hỏng việc cả hai.

Luật:
1. Viết cho người KHÔNG RÀNH KỸ THUẬT. Không thuật ngữ chưa giải thích.
2. Mọi lệnh bạn viết ra phải chạy được trên Windows PowerShell, đã kiểm.
3. XONG THÌ COMMIT: git add -A && git commit -m "<mô tả ngắn>"
4. Trả lời đúng khuôn:
   NHANH: <git branch --show-current>
   COMMIT: <git rev-parse --short HEAD>
   FILE: <file đã tạo/sửa>
   CHUA LAM: <nói thẳng>"""

    [[flow.dem.step]]
      id = "kiem-1"
      type = "shell"
      needs = ["code-go"]
      run = ["go", "test", "-C", "{{wt_tns}}", "./..."]
      timeout_sec = 900
      on_failure = "continue"

    [[flow.dem.step]]
      id = "sua-1"
      type = "agent"
      needs = ["kiem-1"]
      when = "steps.kiem-1.state == failed"
      profile = "claude:tns"
      # CỐ Ý KHÔNG worktree = true. nhanhTrong() (workspace/worktree.go:144-152)
      # thấy sagent/tns-1 đã có commit vượt main thì cấp nhánh sagent/tns-1-2 —
      # tức một cây MỚI TINH từ main, KHÔNG có code đang đỏ. Bước sửa sẽ vá nhầm
      # cây. Nên ghim thẳng vào đường dẫn worktree cũ bằng git -C / go -C.
      tu_duyet_quyen = true
      timeout_sec = 1500
      on_failure = "continue"
      prompt = """Test ĐỎ. Bạn phải sửa TRONG ĐÚNG thư mục này, không phải thư mục
hiện tại:

    {{wt_tns}}

Mọi lệnh đều phải trỏ vào đó: `go test -C {{wt_tns}} ./...`,
`git -C {{wt_tns}} add -A`, `git -C {{wt_tns}} commit -m "..."`.
TUYỆT ĐỐI không sửa file ở thư mục hiện tại — đó là repo chính, sửa vào đấy là hỏng.

Output THẬT của máy chấm:

{{steps.kiem-1.output}}

Sửa cho xanh, chạy lại `go test -C {{wt_tns}} ./...` để tự kiểm, rồi commit.
Không sửa được thì NÓI THẲNG và nêu lý do — đừng vá bằng cách xoá test hay bỏ qua case."""

    [[flow.dem.step]]
      id = "kiem-2"
      type = "shell"
      needs = ["sua-1"]
      when = "steps.kiem-1.state == failed"
      run = ["go", "test", "-C", "{{wt_tns}}", "./..."]
      timeout_sec = 900
      on_failure = "continue"

    [[flow.dem.step]]
      id = "sua-2"
      type = "agent"
      needs = ["kiem-2"]
      when = "steps.kiem-2.state == failed"
      profile = "claude:tns"
      # Cùng lý do như sua-1: ghim đường dẫn, không xin worktree mới.
      tu_duyet_quyen = true
      timeout_sec = 1500
      on_failure = "continue"
      prompt = """Vẫn ĐỎ sau vòng sửa thứ nhất. Sửa TRONG ĐÚNG thư mục:

    {{wt_tns}}

Dùng `go test -C {{wt_tns}} ./...` và `git -C {{wt_tns}} ...`. Không đụng thư mục hiện tại.

Output máy chấm:

{{steps.kiem-2.output}}

Đây là vòng CUỐI. Sửa được thì sửa rồi commit. Không sửa được thì commit phần
đang có và ghi rõ là CHUA XANH kèm lý do — báo sai còn tệ hơn báo hỏng."""

    [[flow.dem.step]]
      id = "kiem-cuoi"
      type = "shell"
      needs = ["sua-2"]
      run = ["go", "test", "-C", "{{wt_tns}}", "./..."]
      timeout_sec = 900
      on_failure = "continue"

    [[flow.dem.step]]
      id = "soi"
      type = "agent"
      profile = "grok:api"
      needs = ["kiem-cuoi", "code-doc"]
      timeout_sec = 900
      on_failure = "continue"
      prompt = """Bạn là người soi độc lập, KHÁC HÃNG với hai người vừa làm.
CHỈ ĐỌC — không sửa, không commit, không tạo file.

MÁY NÀY LÀ WINDOWS, shell là cmd.exe. KHÔNG có ls/cat/grep/pwd. Chỉ dùng `git`.
Một lệnh trượt HAI lần thì ĐỔI CÁCH, đừng gọi lại lần thứ ba.

Đọc bằng đúng bốn lệnh này:
    git log --oneline main..sagent/tns-1
    git diff main...sagent/tns-1
    git log --oneline main..sagent/may-1
    git diff main...sagent/may-1

Nhánh nào không có commit nào thì NÓI THẲNG người đó chưa làm gì.

Máy chấm nói gì:
{{steps.kiem-cuoi.output}}

Trả lời đúng khuôn, mỗi mục một dòng:
TNS: NEN TRON / CAN SUA THEM / VUT — kèm lý do một câu
MAY: NEN TRON / CAN SUA THEM / VUT — kèm lý do một câu
LOI: <lỗi cụ thể tìm được, hoặc "khong thay">
GIAM CHAN: <hai nhánh có sửa cùng file không>"""

    [[flow.dem.step]]
      id = "bao"
      type = "notify"
      needs = ["soi"]
      message = "Lượt đêm xong — xem `sagent flow runs <#>` để đọc kết quả và chi phí từng bước."
